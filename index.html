<body>
<style>
/* ============================================================
   ГОМІН — design tokens
   Neutrals carry a jade bias; one warm copper counter-accent.
   ============================================================ */
:root{
  --bg:#E9F0EE;
  --shell:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F3F8F6;
  --surface-3:#E7EFED;
  --line:#DAE5E2;
  --line-soft:#E9F0EE;
  --ink:#0F1E1B;
  --ink-2:#3A4A46;
  --muted:#6C7B77;
  --faint:#93A19D;
  --accent:#0E9C8C;
  --accent-2:#0B7F72;
  --accent-ink:#FFFFFF;
  --accent-soft:#D8F1ED;
  --ember:#C25E36;
  --ember-soft:#F7E4DA;
  --danger:#C0392B;
  --bubble-in:#FFFFFF;
  --bubble-in-ink:var(--ink);
  --bubble-out-a:#12A797;
  --bubble-out-b:#0C8E86;
  --bubble-out-ink:#FFFFFF;
  --wall:#DCE8E5;
  --wall-dot:rgba(14,156,140,.14);
  --shadow-s:0 1px 2px rgba(12,40,36,.06), 0 2px 8px rgba(12,40,36,.05);
  --shadow-m:0 4px 14px rgba(12,40,36,.10), 0 12px 32px rgba(12,40,36,.08);
  --shadow-l:0 18px 50px rgba(9,30,27,.22);
  --scrim:rgba(9,24,21,.42);
  --glass:rgba(255,255,255,.82);

  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --sp:4px;
  --fs:1;
  --tab-h:62px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A100F;
    --shell:#0E1615;
    --surface:#141E1C;
    --surface-2:#1A2523;
    --surface-3:#22302D;
    --line:#243330;
    --line-soft:#1A2523;
    --ink:#E5EEEB;
    --ink-2:#BCCAC6;
    --muted:#8A9995;
    --faint:#63726E;
    --accent:#2FD3BD;
    --accent-2:#22B9A5;
    --accent-ink:#04231F;
    --accent-soft:#12332F;
    --ember:#E5875A;
    --ember-soft:#33211A;
    --danger:#E86A5C;
    --bubble-in:#1A2523;
    --bubble-in-ink:var(--ink);
    --bubble-out-a:#2AC9B4;
    --bubble-out-b:#17A491;
    --bubble-out-ink:#032220;
    --wall:#0B1211;
    --wall-dot:rgba(47,211,189,.10);
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 6px 18px rgba(0,0,0,.45);
    --shadow-l:0 20px 60px rgba(0,0,0,.6);
    --scrim:rgba(2,10,9,.66);
    --glass:rgba(14,22,21,.82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A100F;
  --shell:#0E1615;
  --surface:#141E1C;
  --surface-2:#1A2523;
  --surface-3:#22302D;
  --line:#243330;
  --line-soft:#1A2523;
  --ink:#E5EEEB;
  --ink-2:#BCCAC6;
  --muted:#8A9995;
  --faint:#63726E;
  --accent:#2FD3BD;
  --accent-2:#22B9A5;
  --accent-ink:#04231F;
  --accent-soft:#12332F;
  --ember:#E5875A;
  --ember-soft:#33211A;
  --danger:#E86A5C;
  --bubble-in:#1A2523;
  --bubble-in-ink:var(--ink);
  --bubble-out-a:#2AC9B4;
  --bubble-out-b:#17A491;
  --bubble-out-ink:#032220;
  --wall:#0B1211;
  --wall-dot:rgba(47,211,189,.10);
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 6px 18px rgba(0,0,0,.45);
  --shadow-l:0 20px 60px rgba(0,0,0,.6);
  --scrim:rgba(2,10,9,.66);
  --glass:rgba(14,22,21,.82);
  color-scheme:dark;
}
/* accent variants */
:root[data-accent="ember"]{ --accent:#C25E36; --accent-2:#A54B27; --accent-ink:#FFF; --accent-soft:#F7E4DA; --bubble-out-a:#CF6C42; --bubble-out-b:#A94E2A; --bubble-out-ink:#FFF; --wall-dot:rgba(194,94,54,.14);}
:root[data-theme="dark"][data-accent="ember"], :root:not([data-theme="light"])[data-accent="ember"]{ --accent:#F0956A; --accent-2:#D0764C; --accent-ink:#2A1108; --accent-soft:#33211A; --bubble-out-a:#E4885C; --bubble-out-b:#C06840; --bubble-out-ink:#2A1108; --wall-dot:rgba(240,149,106,.10);}
:root[data-accent="indigo"]{ --accent:#4C5FD7; --accent-2:#3B4BB8; --accent-ink:#FFF; --accent-soft:#E0E3FA; --bubble-out-a:#5568DE; --bubble-out-b:#3F50C0; --bubble-out-ink:#FFF; --wall-dot:rgba(76,95,215,.14);}
:root[data-theme="dark"][data-accent="indigo"], :root:not([data-theme="light"])[data-accent="indigo"]{ --accent:#8E9BFF; --accent-2:#6E7DE8; --accent-ink:#0B1030; --accent-soft:#1B2050; --bubble-out-a:#7C8AF5; --bubble-out-b:#5C6BD8; --bubble-out-ink:#0B1030; --wall-dot:rgba(142,155,255,.10);}
:root[data-accent="plum"]{ --accent:#A63D6E; --accent-2:#8A2E59; --accent-ink:#FFF; --accent-soft:#F7DEE9; --bubble-out-a:#B44878; --bubble-out-b:#8F3059; --bubble-out-ink:#FFF; --wall-dot:rgba(166,61,110,.14);}
:root[data-theme="dark"][data-accent="plum"], :root:not([data-theme="light"])[data-accent="plum"]{ --accent:#EE8AB4; --accent-2:#CE6A95; --accent-ink:#2C0A1B; --accent-soft:#331825; --bubble-out-a:#DC7CA6; --bubble-out-b:#B95C85; --bubble-out-ink:#2C0A1B; --wall-dot:rgba(238,138,180,.10);}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Onest', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size:calc(15px * var(--fs));
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
button,input,textarea,select{font:inherit;color:inherit;}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
input,textarea{background:none;border:0;outline:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
::selection{background:var(--accent-soft);color:var(--ink);}
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;font-variant-numeric:tabular-nums;}
.disp{font-family:'Unbounded', 'Onest', sans-serif;letter-spacing:-.02em;}
[hidden]{display:none !important;}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ---------- ambient desktop stage ---------- */
.stage{
  min-height:100dvh; display:grid; place-items:center; padding:0;
  background:
    radial-gradient(70% 55% at 18% 8%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
    radial-gradient(60% 50% at 88% 92%, color-mix(in srgb, var(--ember) 14%, transparent), transparent 72%),
    var(--bg);
}
.app{
  position:relative; width:100%; max-width:430px; height:100dvh; max-height:100dvh;
  background:var(--shell); overflow:hidden; display:flex; flex-direction:column;
  isolation:isolate;
}
@media (min-width:720px) and (min-height:760px){
  .stage{padding:26px;}
  .app{height:min(920px, calc(100dvh - 52px)); border-radius:38px; box-shadow:var(--shadow-l), 0 0 0 1px color-mix(in srgb, var(--ink) 8%, transparent);}
}

/* ---------- screen stack ---------- */
.screens{position:absolute;inset:0;overflow:hidden;}
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column;
  background:var(--shell); will-change:transform,opacity;
}
.screen[hidden]{display:none;}
.screen.tabroot{padding-bottom:calc(var(--tab-h) + var(--safe-b));}
@keyframes pushIn{from{transform:translate3d(28%,0,0);opacity:.4} to{transform:translate3d(0,0,0);opacity:1}}
@keyframes pushOut{from{transform:translate3d(0,0,0);opacity:1} to{transform:translate3d(-16%,0,0);opacity:.5}}
@keyframes popIn{from{transform:translate3d(-16%,0,0);opacity:.5} to{transform:translate3d(0,0,0);opacity:1}}
@keyframes popOut{from{transform:translate3d(0,0,0);opacity:1} to{transform:translate3d(28%,0,0);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,10px,0)} to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.anim-pushIn{animation:pushIn .34s var(--ease) both;}
.anim-pushOut{animation:pushOut .34s var(--ease) both;}
.anim-popIn{animation:popIn .3s var(--ease) both;}
.anim-popOut{animation:popOut .3s var(--ease) both;}
.anim-fade{animation:fadeIn .22s var(--ease) both;}

/* ---------- top bar ---------- */
.topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:6px;
  padding:calc(var(--safe-t) + 10px) 8px 10px;
  background:var(--glass); backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid var(--line-soft); position:relative; z-index:5;
}
.topbar .grow{flex:1 1 auto; min-width:0;}
.topbar h1{margin:0; font-size:calc(19px*var(--fs)); font-weight:600; letter-spacing:-.02em;}
.topbar .sub{font-size:calc(12px*var(--fs)); color:var(--muted); margin-top:1px; display:flex; align-items:center; gap:5px;}
.brand{font-family:'Unbounded',sans-serif;font-weight:600;font-size:calc(20px*var(--fs));letter-spacing:-.045em;}
.brand em{font-style:normal;color:var(--accent);}
.icon-btn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  transition:background .18s var(--ease), transform .18s var(--ease), color .18s var(--ease);
  flex:0 0 auto;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.icon-btn:active{transform:scale(.9);}
.icon-btn.accent{color:var(--accent);}
.icon-btn svg{width:22px;height:22px;}

/* ---------- search ---------- */
.searchwrap{padding:8px 14px 6px; flex:0 0 auto;}
.search{
  display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid transparent; border-radius:14px;padding:9px 12px;
  transition:border-color .2s var(--ease), background .2s var(--ease);
}
.search:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--surface);}
.search svg{width:18px;height:18px;color:var(--faint);flex:0 0 auto;}
.search input{flex:1;min-width:0;font-size:calc(14.5px*var(--fs));}
.search input::placeholder{color:var(--faint);}
.search .clear{color:var(--faint);display:none;}
.search.has .clear{display:block;}

/* ---------- avatars ---------- */
.av{
  position:relative;flex:0 0 auto;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  font-family:'Unbounded',sans-serif;font-weight:600;color:#fff;letter-spacing:-.02em;user-select:none;
  background:var(--accent);
}
.av img{width:100%;height:100%;object-fit:cover;display:block;}
.av.s{width:34px;height:34px;font-size:13px;}
.av.m{width:52px;height:52px;font-size:19px;}
.av.l{width:82px;height:82px;font-size:30px;}
.av.xl{width:112px;height:112px;font-size:40px;}
.dot-on{
  position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;
  background:#31C48D;border:2.5px solid var(--shell);
}
.av.l + .dot-on{right:4px;bottom:4px;width:16px;height:16px;border-width:3px;}
.av.xl + .dot-on{right:7px;bottom:7px;width:19px;height:19px;border-width:3.5px;}
.avwrap{position:relative;flex:0 0 auto;}

/* ---------- chat list ---------- */
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.list{padding:2px 0 16px;}
.row{
  display:flex;align-items:center;gap:12px;padding:9px 14px;width:100%;text-align:left;
  transition:background .16s var(--ease);position:relative;
}
.row:active{background:var(--surface-2);}
.row + .row::before{content:'';position:absolute;left:78px;right:0;top:0;height:1px;background:var(--line-soft);}
.row .body{flex:1;min-width:0;}
.row .line1{display:flex;align-items:baseline;gap:8px;}
.row .name{font-weight:600;font-size:calc(15.5px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.row .time{font-size:calc(11.5px*var(--fs));color:var(--faint);flex:0 0 auto;}
.row .line2{display:flex;align-items:center;gap:7px;margin-top:2px;}
.row .prev{flex:1;min-width:0;color:var(--muted);font-size:calc(13.5px*var(--fs));display:flex;align-items:center;gap:5px;}
.row .prev .pv{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .prev .tick{flex:0 0 auto;display:inline-flex;color:var(--faint);}
.row .prev .tick.read{color:var(--accent);}
.row .prev .tick svg{width:15px;height:15px;}
.row .prev svg{width:14px;height:14px;flex:0 0 auto;opacity:.8;}
.row.unread .prev{color:var(--ink-2);}
.row.unread .name{font-weight:700;}
.badge{
  min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
  font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:0 0 auto;
  animation:pop .28s var(--ease) both;
}
.badge.muted{background:var(--faint);}
@keyframes pop{from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1}}
.pin{width:14px;height:14px;color:var(--faint);flex:0 0 auto;display:grid;place-items:center;}
.pin svg{width:14px;height:14px;}
.tag{
  font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--faint);flex:0 0 auto;
}
.section-h{
  padding:16px 16px 6px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
}

/* ---------- tab bar ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:20;
  display:flex;padding:6px 8px calc(6px + var(--safe-b));
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-top:1px solid var(--line-soft);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);
  transition:color .2s var(--ease);position:relative;
}
.tab svg{width:23px;height:23px;transition:transform .3s var(--ease);}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.01em;}
.tab.on{color:var(--accent);}
.tab.on svg{transform:translateY(-1px) scale(1.06);}
.tab .nub{position:absolute;top:0;width:18px;height:3px;border-radius:2px;background:var(--accent);opacity:0;transform:scaleX(.3);transition:.3s var(--ease);}
.tab.on .nub{opacity:1;transform:none;}
.tab .cnt{
  position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;
  background:var(--ember);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;
}

/* ---------- FAB ---------- */
.fab{
  position:absolute;right:16px;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);z-index:15;
  width:56px;height:56px;border-radius:19px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--bubble-out-a),var(--bubble-out-b));color:var(--accent-ink);
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 38%,transparent);
  transition:transform .22s var(--ease), box-shadow .22s var(--ease);
  animation:fabIn .4s var(--ease) both;
}
@keyframes fabIn{from{transform:scale(.4) translateY(20px);opacity:0} to{transform:none;opacity:1}}
.fab:active{transform:scale(.9);}
.fab svg{width:25px;height:25px;}

/* ---------- empty ---------- */
.empty{padding:56px 34px;text-align:center;color:var(--muted);animation:fadeUp .4s var(--ease) both;}
.empty .ico{width:66px;height:66px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px;}
.empty .ico svg{width:30px;height:30px;}
.empty h3{margin:0 0 6px;font-size:calc(16.5px*var(--fs));color:var(--ink);font-weight:600;}
.empty p{margin:0;font-size:calc(13.5px*var(--fs));line-height:1.55;}

/* ---------- chat view ---------- */
.chat-head{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.chat-head .name{font-weight:600;font-size:calc(16px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-head .st{font-size:calc(11.5px*var(--fs));color:var(--muted);}
.chat-head .st.on{color:var(--accent);}
.wall{
  flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;position:relative;
  background-color:var(--wall);
  padding:10px 12px 6px;
}
.wall[data-wall="dots"]{background-image:radial-gradient(var(--wall-dot) 1.4px, transparent 1.5px);background-size:22px 22px;}
.wall[data-wall="waves"]{
  background-image:
    radial-gradient(circle at 50% 120%, transparent 46%, var(--wall-dot) 46.4%, transparent 47.4%),
    radial-gradient(circle at 50% 120%, transparent 64%, var(--wall-dot) 64.4%, transparent 65.4%),
    radial-gradient(circle at 50% 120%, transparent 82%, var(--wall-dot) 82.4%, transparent 83.4%);
  background-size:260px 260px;background-position:center bottom;
}
.wall[data-wall="grid"]{
  background-image:linear-gradient(var(--wall-dot) 1px, transparent 1px),linear-gradient(90deg,var(--wall-dot) 1px, transparent 1px);
  background-size:30px 30px;opacity:1;
}
.wall[data-wall="plain"]{background-image:none;}
.msgs{display:flex;flex-direction:column;gap:2px;min-height:100%;justify-content:flex-end;}
.day{align-self:center;margin:14px 0 10px;padding:4px 12px;border-radius:11px;background:color-mix(in srgb,var(--shell) 76%,transparent);backdrop-filter:blur(8px);color:var(--muted);font-size:11.5px;font-weight:600;}
.mrow{display:flex;padding:1px 0;animation:msgIn .34s var(--ease) both;}
@keyframes msgIn{from{opacity:0;transform:translate3d(0,12px,0) scale(.97)} to{opacity:1;transform:none}}
.mrow.out{justify-content:flex-end;}
.mrow.tail{margin-bottom:8px;}
.bubble{
  max-width:min(78%,330px);border-radius:19px;padding:8px 12px 7px;position:relative;
  box-shadow:var(--shadow-s);word-wrap:break-word;overflow-wrap:anywhere;
}
.mrow.in .bubble{background:var(--bubble-in);color:var(--bubble-in-ink);border-bottom-left-radius:7px;}
.mrow.out .bubble{background:linear-gradient(150deg,var(--bubble-out-a),var(--bubble-out-b));color:var(--bubble-out-ink);border-bottom-right-radius:7px;}
.mrow.in:not(.tail) .bubble{border-bottom-left-radius:19px;}
.mrow.out:not(.tail) .bubble{border-bottom-right-radius:19px;}
.bubble .txt{font-size:calc(15px*var(--fs));line-height:1.42;white-space:pre-wrap;}
.bubble .txt a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
.meta{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:2px;height:14px;float:right;margin-left:10px;position:relative;top:4px;}
.meta .t{font-size:10.5px;opacity:.72;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
.meta .tick{display:inline-flex;align-items:center;opacity:.85;}
.tick svg{width:15px;height:15px;}
.mrow.out .meta .tick.read{color:#8FF3E4;opacity:1;}
:root[data-theme="dark"] .mrow.out .meta .tick.read, :root:not([data-theme="light"]) .mrow.out .meta .tick.read{color:#04312B;opacity:.95;}
.bubble.media{padding:4px;overflow:hidden;}
.bubble.media .meta{position:absolute;right:9px;bottom:9px;margin:0;float:none;top:auto;
  background:rgba(6,20,18,.5);backdrop-filter:blur(6px);padding:2px 7px;border-radius:9px;color:#fff;height:auto;}
.bubble.media .meta .t{opacity:.95;}
.bubble.media .meta .tick{color:#fff;}
.photo{display:block;border-radius:15px;max-width:100%;width:246px;height:auto;cursor:zoom-in;background:var(--surface-3);
  transition:transform .3s var(--ease), filter .3s var(--ease);}
.photo:active{transform:scale(.985);}
.photo.ph{width:246px;height:170px;border-radius:15px;cursor:default;
  background:linear-gradient(100deg,var(--surface-3) 30%,var(--surface-2) 50%,var(--surface-3) 70%);
  background-size:300% 100%;animation:phshine 1.4s linear infinite;}
@keyframes phshine{from{background-position:120% 0} to{background-position:-40% 0}}
.bubble .cap{padding:5px 8px 3px;font-size:calc(14px*var(--fs));}

/* voice message */
.voice{display:flex;align-items:center;gap:10px;padding:2px 2px 2px 0;min-width:190px;}
.vplay{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;transition:transform .18s var(--ease);}
.vplay:active{transform:scale(.9);}
.mrow.in .vplay{background:var(--accent);color:var(--accent-ink);}
.mrow.out .vplay{background:rgba(255,255,255,.22);color:var(--bubble-out-ink);}
:root[data-theme="dark"] .mrow.out .vplay,:root:not([data-theme="light"]) .mrow.out .vplay{background:rgba(0,0,0,.18);}
.vplay svg{width:17px;height:17px;}
.vbody{flex:1;min-width:0;}
.wave{display:flex;align-items:center;gap:2px;height:26px;cursor:pointer;}
.wave i{flex:1;min-width:2px;max-width:3px;border-radius:2px;background:currentColor;opacity:.32;transition:opacity .12s linear, background .12s linear;}
.wave i.done{opacity:.95;}
.vfoot{display:flex;align-items:center;gap:6px;margin-top:1px;font-size:11px;opacity:.75;font-family:'JetBrains Mono',monospace;}
.bubble .voice + .meta{float:none;margin:0;justify-content:flex-end;top:0;}
.vdot{width:6px;height:6px;border-radius:50%;background:var(--ember);}

/* typing */
.typing-row{display:flex;padding:2px 0 8px;animation:msgIn .3s var(--ease) both;}
.typing{background:var(--bubble-in);border-radius:19px;border-bottom-left-radius:7px;padding:12px 14px;display:flex;gap:4px;box-shadow:var(--shadow-s);}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.25s infinite var(--ease);}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}

/* system message */
.sys{align-self:center;margin:8px 0;padding:6px 13px;border-radius:12px;background:color-mix(in srgb,var(--shell) 80%,transparent);
  color:var(--muted);font-size:12px;text-align:center;max-width:80%;display:flex;align-items:center;gap:6px;}
.sys svg{width:14px;height:14px;flex:0 0 auto;}

/* ---------- composer ---------- */
.composer{
  flex:0 0 auto;padding:8px 10px calc(8px + var(--safe-b));background:var(--glass);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-top:1px solid var(--line-soft);
}
.cbar{display:flex;align-items:flex-end;gap:6px;}
.cfield{
  flex:1;display:flex;align-items:flex-end;gap:4px;background:var(--surface-2);border-radius:22px;
  padding:4px 4px 4px 6px;border:1px solid transparent;transition:border-color .2s var(--ease);
}
.cfield:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,transparent);}
.cfield textarea{
  flex:1;resize:none;max-height:120px;min-height:34px;padding:7px 2px;font-size:calc(15px*var(--fs));line-height:1.35;
}
.cfield textarea::placeholder{color:var(--faint);}
.send{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(145deg,var(--bubble-out-a),var(--bubble-out-b));color:var(--accent-ink);
  box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 34%,transparent);
  transition:transform .22s var(--ease), opacity .2s var(--ease);
}
.send:active{transform:scale(.88);}
.send svg{width:21px;height:21px;}
.send.mic{background:var(--surface-2);color:var(--ink-2);box-shadow:none;}
.send.rec{background:var(--ember);color:#fff;animation:recPulse 1.4s infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ember) 60%,transparent)}50%{box-shadow:0 0 0 12px transparent}}
.recbar{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;background:var(--ember-soft);border-radius:22px;flex:1;}
.recbar .blink{width:10px;height:10px;border-radius:50%;background:var(--ember);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.recbar .tm{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:14px;color:var(--ember);min-width:44px;}
.recbar .lvl{flex:1;display:flex;align-items:center;gap:2px;height:22px;}
.recbar .lvl i{flex:1;max-width:3px;border-radius:2px;background:var(--ember);opacity:.35;height:20%;transition:height .09s linear,opacity .09s linear;}
.recbar .cancel{color:var(--ember);font-weight:600;font-size:13.5px;padding:0 8px;}

/* attach sheet grid */
.att-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 4px 4px;}
.att{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:18px;background:var(--surface-2);
  transition:transform .18s var(--ease),background .18s var(--ease);}
.att:active{transform:scale(.94);}
.att .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;}
.att .ic svg{width:22px;height:22px;}
.att span{font-size:12px;font-weight:500;color:var(--ink-2);}

/* ---------- username / email fields ---------- */
.uwrap{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:14px;padding:0 14px;transition:border-color .2s var(--ease),background .2s var(--ease);}
.uwrap:focus-within{border-color:var(--accent);background:var(--surface);}
.uwrap.bad{border-color:var(--ember);}
.uwrap.ok{border-color:#31C48D;}
.uwrap .at{font-family:'JetBrains Mono',monospace;font-size:calc(15px*var(--fs));color:var(--faint);flex:0 0 auto;}
.uwrap input{flex:1;min-width:0;padding:12px 0;font-family:'JetBrains Mono',monospace;
  font-size:calc(15px*var(--fs));letter-spacing:-.01em;}
.ustat{display:flex;align-items:center;gap:6px;font-size:12.3px;margin-top:6px;color:var(--muted);min-height:18px;}
.ustat svg{width:14px;height:14px;flex:0 0 auto;}
.ustat.ok{color:#2C9E6B;}
.ustat.bad{color:var(--ember);}
:root[data-theme="dark"] .ustat.ok,:root:not([data-theme="light"]) .ustat.ok{color:#4FD79E;}
.ustat .spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);
  animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.hintline{font-size:12.3px;color:var(--faint);margin-top:6px;line-height:1.45;}

/* ---------- handle chip ---------- */
.handle{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-2);
  border-radius:11px;padding:5px 11px;font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:500;}
:root[data-theme="dark"] .handle,:root:not([data-theme="light"]) .handle{color:var(--accent);}
.row .uname{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--faint);}

/* ---------- friend requests ---------- */
.reqrow{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;
  animation:fadeUp .35s var(--ease) both;}
.reqrow .body{flex:1;min-width:0;}
.reqrow .body b{display:block;font-size:calc(15px*var(--fs));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reqrow .body small{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}
.reqrow .acts{display:flex;gap:8px;flex:0 0 auto;}
.rb2{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;transition:transform .18s var(--ease);}
.rb2:active{transform:scale(.9);}
.rb2 svg{width:19px;height:19px;}
.rb2.y{background:var(--accent);color:var(--accent-ink);}
.rb2.n{background:var(--surface-3);color:var(--muted);}

/* ---------- find result ---------- */
.findcard{margin-top:14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:20px;
  padding:16px;box-shadow:var(--shadow-s);animation:fadeUp .34s var(--ease) both;}
.findcard .top{display:flex;align-items:center;gap:13px;}
.findcard .who{flex:1;min-width:0;}
.findcard .who b{display:block;font-size:calc(16px*var(--fs));font-weight:600;}
.findcard .who small{display:block;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);margin-top:1px;}
.findcard .bio{color:var(--muted);font-size:calc(13.3px*var(--fs));line-height:1.5;margin-top:10px;}
.findcard .btn-row{margin-top:14px;}
.findmsg{margin-top:14px;display:flex;align-items:flex-start;gap:10px;padding:14px;border-radius:18px;
  background:var(--surface-2);color:var(--muted);font-size:13.2px;line-height:1.5;animation:fadeUp .3s var(--ease) both;}
.findmsg svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px;color:var(--faint);}
.findmsg.bad svg{color:var(--ember);}
.pillstate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--accent);}
.pillstate svg{width:15px;height:15px;}

/* ---------- accounts / login ---------- */
.pwrap{position:relative;}
.pwrap .inp{padding-right:48px;}
.pwrap .eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;
  border-radius:50%;display:grid;place-items:center;color:var(--faint);transition:color .18s var(--ease);}
.pwrap .eye:hover{color:var(--ink-2);}
.pwrap .eye svg{width:19px;height:19px;}
.acc{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:18px;background:var(--surface);
  border:1px solid var(--line-soft);box-shadow:var(--shadow-s);width:100%;text-align:left;margin-bottom:10px;
  transition:transform .18s var(--ease),border-color .18s var(--ease);}
.acc:active{transform:scale(.98);}
.acc:hover{border-color:color-mix(in srgb,var(--accent) 40%,transparent);}
.acc .t{flex:1;min-width:0;}
.acc .t b{display:block;font-weight:600;font-size:calc(15.5px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acc .t small{display:block;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);margin-top:1px;}
.acc .chev{width:18px;height:18px;color:var(--faint);flex:0 0 auto;}
.orline{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:var(--faint);font-size:12px;
  text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.orline::before,.orline::after{content:'';flex:1;height:1px;background:var(--line);}
.checkrow{display:flex;align-items:center;gap:12px;padding:10px 2px 14px;width:100%;text-align:left;}
.checkrow .t{flex:1;min-width:0;}
.checkrow .t b{display:block;font-weight:500;font-size:calc(14.5px*var(--fs));}
.checkrow .t small{display:block;color:var(--muted);font-size:12.2px;margin-top:1px;line-height:1.4;}
.keybox{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;resize:none;min-height:110px;
  word-break:break-all;color:var(--ink-2);}
.lockhead{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:8px 0 22px;}
.lockhead .nm{font-family:'Unbounded',sans-serif;font-weight:600;font-size:calc(20px*var(--fs));letter-spacing:-.03em;}
.pwerr{color:var(--ember);font-size:12.8px;margin-top:8px;min-height:18px;display:flex;align-items:center;gap:6px;}
.pwerr svg{width:14px;height:14px;}

/* ---------- sheets & modals ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40;animation:fadeIn .22s var(--ease) both;backdrop-filter:blur(2px);}
.scrim.out{animation:fadeOut .2s var(--ease) both;}
@keyframes fadeOut{to{opacity:0}}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:26px 26px 0 0;padding:10px 16px calc(18px + var(--safe-b));
  box-shadow:var(--shadow-l);animation:sheetIn .38s var(--ease) both;max-height:86%;overflow-y:auto;
}
.sheet.out{animation:sheetOut .26s var(--ease-in) both;}
@keyframes sheetIn{from{transform:translate3d(0,100%,0)} to{transform:none}}
@keyframes sheetOut{to{transform:translate3d(0,100%,0)}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 14px;}
.sheet h2{margin:0 0 4px;font-size:calc(17px*var(--fs));font-weight:600;}
.sheet p.hint{margin:0 0 14px;color:var(--muted);font-size:calc(13px*var(--fs));line-height:1.5;}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:12px;}
.field .lab{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;}
.inp{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  font-size:calc(15px*var(--fs));transition:border-color .2s var(--ease),background .2s var(--ease);
}
.inp:focus{border-color:var(--accent);background:var(--surface);}
textarea.inp{resize:none;min-height:78px;line-height:1.45;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;
  background:linear-gradient(145deg,var(--bubble-out-a),var(--bubble-out-b));color:var(--accent-ink);
  font-weight:600;font-size:calc(15px*var(--fs));box-shadow:0 5px 16px color-mix(in srgb,var(--accent) 30%,transparent);
  transition:transform .2s var(--ease),opacity .2s var(--ease);
}
.btn:active{transform:scale(.975);}
.btn[disabled]{opacity:.45;box-shadow:none;pointer-events:none;}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none;}
.btn.danger{background:none;color:var(--danger);box-shadow:none;}
.btn svg{width:19px;height:19px;}
.btn-row{display:flex;gap:10px;}

/* ---------- settings ---------- */
.group{margin:14px 14px 0;background:var(--surface);border:1px solid var(--line-soft);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-s);}
.srow{display:flex;align-items:center;gap:13px;padding:13px 14px;width:100%;text-align:left;position:relative;transition:background .16s var(--ease);}
.srow:active{background:var(--surface-2);}
.srow + .srow::before{content:'';position:absolute;left:52px;right:0;top:0;height:1px;background:var(--line-soft);}
.srow .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:0 0 auto;}
.srow .ic svg{width:17px;height:17px;}
.srow .t{flex:1;min-width:0;}
.srow .t b{display:block;font-weight:500;font-size:calc(14.8px*var(--fs));}
.srow .t small{display:block;color:var(--muted);font-size:calc(12.3px*var(--fs));margin-top:1px;}
.srow .val{color:var(--muted);font-size:calc(13.5px*var(--fs));flex:0 0 auto;}
.srow .chev{width:17px;height:17px;color:var(--faint);flex:0 0 auto;}
.gh{padding:20px 20px 7px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}

.switch{width:47px;height:28px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto;transition:background .26s var(--ease);}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .26s var(--ease);}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(19px);}

.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:3px;}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:calc(13px*var(--fs));font-weight:600;color:var(--muted);
  transition:background .22s var(--ease),color .22s var(--ease),box-shadow .22s var(--ease);}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s);}

.swatches{display:flex;gap:12px;padding:4px 0;}
.sw{width:42px;height:42px;border-radius:14px;position:relative;transition:transform .2s var(--ease);}
.sw:active{transform:scale(.9);}
.sw.on::after{content:'';position:absolute;inset:-4px;border-radius:18px;border:2px solid var(--accent);}
.walls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.wl{height:62px;border-radius:14px;border:2px solid transparent;background-color:var(--wall);overflow:hidden;position:relative;}
.wl.on{border-color:var(--accent);}
.wl .wall[data-wall="dots"]{background-size:11px 11px;}
.wl .wall[data-wall="grid"]{background-size:15px 15px;}
.wl .wall[data-wall="waves"]{background-size:96px 96px;}

/* ---------- profile ---------- */
.phead{
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 20px 22px;text-align:center;
  background:linear-gradient(180deg, color-mix(in srgb,var(--accent) 13%,var(--shell)), var(--shell));
}
.phead .nm{font-family:'Unbounded',sans-serif;font-weight:600;font-size:calc(21px*var(--fs));letter-spacing:-.03em;}
.phead .bio{color:var(--muted);font-size:calc(13.8px*var(--fs));max-width:34ch;line-height:1.5;}
.pid{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-2);}
.pid svg{width:15px;height:15px;color:var(--accent);}
.pacts{display:flex;gap:10px;padding:0 16px;margin-top:-6px;}
.pact{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 6px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line-soft);color:var(--accent);font-size:12px;font-weight:600;
  box-shadow:var(--shadow-s);transition:transform .18s var(--ease);}
.pact:active{transform:scale(.95);}
.pact svg{width:21px;height:21px;}
.avedit{position:relative;}
.avedit .cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--accent);
  color:var(--accent-ink);display:grid;place-items:center;border:3px solid var(--shell);}
.avedit .cam svg{width:15px;height:15px;}

/* ---------- image viewer ---------- */
.viewer{position:absolute;inset:0;z-index:60;background:#06100E;display:flex;flex-direction:column;animation:vIn .3s var(--ease) both;}
@keyframes vIn{from{opacity:0;transform:scale(.94)} to{opacity:1;transform:none}}
.viewer.out{animation:vOut .24s var(--ease-in) both;}
@keyframes vOut{to{opacity:0;transform:scale(.94)}}
.viewer .vtop{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:calc(var(--safe-t) + 12px) 12px 12px;color:#fff;
  background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);transition:opacity .25s var(--ease);}
.viewer .vtop .icon-btn{color:#fff;}
.viewer .vtop .icon-btn:hover{background:rgba(255,255,255,.14);}
.viewer .vmeta{flex:1;min-width:0;}
.viewer .vmeta b{display:block;font-size:14.5px;font-weight:600;}
.viewer .vmeta small{color:rgba(255,255,255,.65);font-size:11.5px;}
.viewer .vstage{flex:1;display:grid;place-items:center;overflow:hidden;touch-action:none;}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;}
.viewer.hidechrome .vtop{opacity:0;pointer-events:none;}

/* ---------- calls ---------- */
.callscreen{
  position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;color:#fff;overflow:hidden;
  background:linear-gradient(165deg,#0B2622,#071614 55%,#0A1F2C);
  animation:callIn .42s var(--ease) both;
}

  chat:`<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.1 9.1 0 0 1-3.6-.7L3 21l1.9-5.1A8.2 8.2 0 0 1 3.9 11.5a8.4 8.4 0 0 1 8.6-8.4 8.4 8.4 0 0 1 8.5 8.4z"/>`,

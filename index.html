      <div style="padding:14px 16px 4px">
        <div class="group" style="margin:0 0 18px;padding:14px;box-shadow:none;background:var(--accent-soft);border-color:transparent">
          <div style="display:flex;align-items:center;gap:12px">
            <span class="ic" style="width:38px;height:38px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center">${ic('user')}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2)">Ваш юзернейм</div>
              <div class="mono" style="font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis">@${esc(S.me?S.me.username:'')}</div>
            </div>
            <button class="icon-btn accent" data-act="share" aria-label="Поділитися">${ic('copy')}</button>
          </div>
        </div>
        <div class="field"><span class="lab">Юзернейм друга</span>
          <div class="uwrap" id="findUwrap"><span class="at">@</span>
            <input id="findU" maxlength="20" placeholder="oksana" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        </div>
        <button class="btn" id="findBtn" disabled>${ic('search')} Знайти</button>
        <div id="findRes"></div>
        <p style="color:var(--muted);font-size:12.5px;line-height:1.55;margin:16px 2px 0">
          Юзернейм унікальний: поки він зайнятий, ніхто інший не може його взяти. Щоб людину знайшло, у неї має бути відкритий Гомін.</p>
      </div>
      ${known.length?`<div class="gh">Уже в списку</div><div class="list">${known.map(c=>`
        <button class="row" data-act="open" data-id="${esc(c.id)}">${avatarHTML(c,'m',c.online)}
        <div class="body"><div class="line1"><span class="name">${esc(c.name)}</span></div>
        <div class="line2"><span class="prev"><span class="pv uname">@${esc(c.username||userOf(c.id))}</span></span>
        ${c.friend?'':`<span class="tag">${c.pendingOut?'запит надіслано':'не в друзях'}</span>`}</div></div></button>`).join('')}</div>`:''}
    </div>`;
  },
  mount(root){
    const inp=$('#findU',root), btn=$('#findBtn',root), res=$('#findRes',root), wrap=$('#findUwrap',root);
    const sync=()=>{ btn.disabled=!validUser(normUser(inp.value)); };
    inp.addEventListener('input',()=>{
      const n=normUser(inp.value);
      if(inp.value!==n){ const p=inp.selectionStart; inp.value=n; try{inp.setSelectionRange(p,p);}catch(e){} }
      wrap.className='uwrap'; res.innerHTML=''; sync();
    });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!btn.disabled) btn.click(); });
    sync();

    btn.addEventListener('click', async ()=>{
      const u=normUser(inp.value);
      btn.disabled=true;
      res.innerHTML=`<div class="findmsg"><span class="spin" style="width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;display:block"></span>Шукаємо @${esc(u)}…</div>`;
      const r=await window.H.net.findUser(u);
      btn.disabled=false;
      res.innerHTML=resultHTML(r,u);
      wrap.className='uwrap '+(r.ok?'ok':'bad');
    });

    root.addEventListener('click', async e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      const a=b.dataset.act;
      if(a==='back') back();
      else if(a==='share') window.H.shareId();
      else if(a==='open'){ back(); setTimeout(()=>window.H.openChat(b.dataset.id),300); }
      else if(a==='addfriend'){
        window.H.net.friendRequest(b.dataset.id);
        toast('Запит надіслано'); buzz(12);
        const r={ok:true, chat:S.chats[b.dataset.id]};
        res.innerHTML=resultHTML(r, r.chat.username||userOf(r.chat.id));
      }
      else if(a==='write'){ back(); setTimeout(()=>window.H.openChat(b.dataset.id),300); }
    });
  }
};
function resultHTML(r,u){
  if(r.error==='self') return `<div class="findmsg">${ic('info')}Це ви 🙂 Ваш юзернейм — @${esc(u)}.</div>`;
  if(r.error==='invalid') return `<div class="findmsg bad">${ic('x')}Юзернейм має бути 3–20 символів: латиниця, цифри та _.</div>`;
  if(r.error==='nonet') return `<div class="findmsg bad">${ic('x')}Немає зʼєднання з мережею. Перевірте інтернет і спробуйте ще раз.</div>`;
  if(r.error==='notfound') return `<div class="findmsg bad">${ic('x')}${window.H.cloud.on()
    ? '@'+esc(u)+' не знайдено — такого юзернейма немає. Перевірте написання.'
    : '@'+esc(u)+' не знайдено. Або такого юзернейма не існує, або людина зараз не в мережі — попросіть її відкрити Гомін.'}</div>`;
  const c=r.chat;
  const acts = c.friend
    ? `<button class="btn" data-act="write" data-id="${esc(c.id)}">${ic('chat')} Написати</button>`
    : c.pendingOut
      ? `<div class="pillstate">${ic('check')} Запит надіслано</div>
         <button class="btn ghost" style="margin-top:10px" data-act="write" data-id="${esc(c.id)}">${ic('chat')} Написати</button>`
      : `<button class="btn" data-act="addfriend" data-id="${esc(c.id)}">${ic('users')} Додати в друзі</button>
         <button class="btn ghost" style="margin-top:8px" data-act="write" data-id="${esc(c.id)}">${ic('chat')} Написати</button>`;
  return `<div class="findcard">
    <div class="top">${avatarHTML(c,'m',c.online && !r.stale)}
      <div class="who"><b>${esc(c.name)}</b><small>@${esc(c.username||userOf(c.id))}${r.stale?' · зараз офлайн':''}</small></div>
      ${c.friend?`<span class="tag" style="border-color:var(--accent);color:var(--accent)">друг</span>`:''}
    </div>
    ${c.bio?`<div class="bio">${esc(c.bio)}</div>`:''}
    <div class="btn-row" style="flex-direction:column;gap:0">${acts}</div>
  </div>`;
}

/* ---------- helpers exposed ---------- */
window.H.copy = function(text){
  const done=()=>toast('Скопійовано');
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
  else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Не вдалося скопіювати'); }
    ta.remove();
  }
};
window.H.shareId = function(){
  const h='@'+S.me.username;
  const text='Мій юзернейм у Гомоні: '+h;
  if(navigator.share){ navigator.share({title:'Гомін', text}).catch(()=>window.H.copy(h)); }
  else window.H.copy(h);
};
})();
</script>
<script>
/* ============================================================
   ГОМІН — екрани входу: вибір акаунта, пароль, ключ переносу
   ============================================================ */
(function(){
'use strict';
const {ic,$,$$,esc,S,save,avatarHTML,toast,buzz,openSheet,closeSheet,SCREENS,
       go,back,refresh,resetTo,current,applyTheme,normUser,validUser,userOf} = window.H;
const auth = window.H.auth;

function pwField(id, placeholder){
  return `<div class="pwrap">
    <input class="inp" id="${id}" type="password" autocomplete="off" placeholder="${esc(placeholder||'Пароль')}">
    <button class="eye" data-eye="${id}" type="button" aria-label="Показати пароль">${ic('eye')}</button>
  </div>`;
}
function bindEyes(root){
  root.addEventListener('click', e=>{
    const b=e.target.closest('[data-eye]'); if(!b) return;
    const f=$('#'+b.dataset.eye, root); if(!f) return;
    const show = f.type==='password';
    f.type = show?'text':'password';
    b.innerHTML = ic(show?'eyeOff':'eye');
    b.setAttribute('aria-label', show?'Сховати пароль':'Показати пароль');
  });
}
function rememberRow(checked){
  return `<button class="checkrow" data-act="remember" type="button">
    <span class="switch ${checked?'on':''}" id="rmSwitch"></span>
    <span class="t"><b>Не виходити на цьому пристрої</b>
      <small>Інакше пароль запитуватимемо щоразу під час запуску</small></span>
  </button>`;
}
function errLine(id){ return `<div class="pwerr" id="${id}"></div>`; }
function showErr(root,id,msg){
  const e=$('#'+id,root); if(!e) return;
  e.innerHTML = msg?ic('info')+'<span>'+esc(msg)+'</span>':'';
  if(msg) buzz([30,40,30]);
}

/* ============================================================
   ВИБІР АКАУНТА
   ============================================================ */
SCREENS.login = {
  render(){
    const list=auth.accounts();
    return `<div class="onb">
      <div class="logo">${ic('waveform')}</div>
      <h1>З поверненням</h1>
      <p class="lede">${list.length===1?'Увійдіть у свій акаунт, щоб продовжити.':'Оберіть акаунт на цьому пристрої.'}</p>
      <div class="form">
        ${list.map(a=>`<button class="acc" data-act="pick" data-u="${esc(a.username)}">
          ${avatarHTML({name:a.name, avatar:a.avatar, id:'homin-'+a.username},'m')}
          <span class="t"><b>${esc(a.name||a.username)}</b><small>@${esc(a.username)}</small></span>
          <span class="chev">${ic('chev')}</span>
        </button>`).join('')}
        <div class="orline">або</div>
        <button class="btn ghost" data-act="new">${ic('plus')} Створити новий акаунт</button>
        ${window.H.cloud.configured()?`<button class="btn ghost" style="margin-top:10px" data-act="cloud">${ic('cloud')} Увійти в акаунт із хмари</button>`:''}
        <button class="btn ghost" style="margin-top:10px" data-act="restore">${ic('key')} Увійти за ключем акаунта</button>
      </div>
    </div>`;
  },
  mount(root){
    root.addEventListener('click', e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      const a=b.dataset.act;
      if(a==='pick') go('unlock',{username:b.dataset.u});
      else if(a==='new') go('onboard');
      else if(a==='cloud') go('cloudlogin');
      else if(a==='restore') go('restore');
    });
  }
};

/* ============================================================
   ПАРОЛЬ
   ============================================================ */
SCREENS.unlock = {
  render({username}){
    const a=auth.accounts().find(x=>x.username===username)||{username,name:username};
    return `<header class="topbar">
      <button class="icon-btn" data-act="back">${ic('back')}</button>
      <div class="grow"><h1>Вхід</h1></div>
    </header>
    <div class="onb" style="padding-top:26px">
      <div class="lockhead">
        ${avatarHTML({name:a.name, avatar:a.avatar, id:'homin-'+username},'xl')}
        <div><div class="nm">${esc(a.name||username)}</div>
          <div class="handle" style="margin-top:8px">${ic('user')}@${esc(username)}</div></div>
      </div>
      <div class="form">
        <div class="field"><span class="lab">Пароль</span>${pwField('upw')}${errLine('uerr')}</div>
        ${rememberRow(true)}
        <button class="btn" id="uGo">${ic('lock')} Увійти</button>
        <button class="btn danger" style="margin-top:6px" data-act="forgot">Забули пароль?</button>
      </div>
    </div>`;
  },
  mount(root,{username}){
    bindEyes(root);
    const pw=$('#upw',root), btn=$('#uGo',root);
    let remember=true, busy=false;
    setTimeout(()=>pw.focus(),350);
    pw.addEventListener('keydown',e=>{ if(e.key==='Enter') btn.click(); });
    pw.addEventListener('input',()=>showErr(root,'uerr',''));

    async function submit(){
      if(busy) return;
      if(!pw.value){ showErr(root,'uerr','Введіть пароль'); return; }
      busy=true; btn.disabled=true; btn.innerHTML='Перевіряємо…';
      const r=await auth.unlock(username, pw.value, remember);
      busy=false; btn.disabled=false; btn.innerHTML=ic('lock')+' Увійти';
      if(r==='ok'){
        buzz(14); applyTheme(); resetTo('chats');
        window.H.notify.afterLogin();
        setTimeout(()=>window.H.net.start(), 500);
      } else if(r==='wrong-password'){
        showErr(root,'uerr','Невірний пароль'); pw.select();
      } else if(r==='corrupt'){
        showErr(root,'uerr','Не вдалося прочитати дані акаунта');
      } else {
        showErr(root,'uerr','Акаунт не знайдено на цьому пристрої');
      }
    }
    btn.addEventListener('click', submit);
    root.addEventListener('click', e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      const a=b.dataset.act;
      if(a==='back') back();
      else if(a==='remember'){ remember=!remember; $('#rmSwitch',root).classList.toggle('on',remember); buzz(6); }
      else if(a==='forgot') forgotSheet(username);
    });
  }
};

function forgotSheet(username){
  openSheet(`<h2>Пароль не відновлюється</h2>
    <p class="hint">У Гомоні немає сервера з акаунтами: пароль ніде не зберігається, тож і надіслати новий нікому. Але акаунт можна повернути двома шляхами.</p>
    <div class="group" style="margin:0 0 14px">
      <div class="srow"><span class="ic" style="background:#0E9C8C">${ic('key')}</span>
        <div class="t"><b>Ключ акаунта</b><small>Якщо ви зберігали ключ або досі маєте вхід на іншому пристрої — скористайтеся ним.</small></div></div>
      <div class="srow"><span class="ic" style="background:#4C5FD7">${ic('user')}</span>
        <div class="t"><b>Новий акаунт</b><small>Юзернейм @${esc(username)} звільниться, щойно ви видалите цей акаунт із пристрою.</small></div></div>
    </div>
    <button class="btn ghost" id="useKey">${ic('key')} Увійти за ключем</button>
    <button class="btn danger" style="margin-top:8px" id="drop">Видалити акаунт із цього пристрою</button>`, sh=>{
    $('#useKey',sh).onclick=()=>{ closeSheet(); go('restore'); };
    $('#drop',sh).onclick=()=>{
      closeSheet();
      openSheet(`<h2>Видалити @${esc(username)}?</h2>
        <p class="hint">Профіль, листування й журнал дзвінків зникнуть із цього пристрою назавжди. Відновити без ключа акаунта буде неможливо.</p>
        <button class="btn danger" id="y">Так, видалити</button>
        <button class="btn ghost" style="margin-top:8px" id="n">Скасувати</button>`, s2=>{
        $('#y',s2).onclick=()=>{
          auth.removeAccount(username); closeSheet();
          if(auth.hasAccounts()) resetTo('login'); else resetTo('onboard');
          toast('Акаунт видалено з пристрою');
        };
        $('#n',s2).onclick=()=>closeSheet();
      });
    };
  });
}

/* ============================================================
   ВІДНОВЛЕННЯ ЗА КЛЮЧЕМ
   ============================================================ */
SCREENS.restore = {
  render(){
    return `<header class="topbar">
      <button class="icon-btn" data-act="back">${ic('back')}</button>
      <div class="grow"><h1>Вхід за ключем</h1></div>
    </header>
    <div class="scroll"><div style="padding:16px 16px 28px">
      <p style="color:var(--muted);font-size:13.4px;line-height:1.6;margin:0 0 18px">
        Ключ акаунта — це рядок, який починається з <span class="mono">HOMIN1.</span> Його можна зберегти
        в «Налаштуваннях → Ключ акаунта» на пристрої, де ви вже увійшли.</p>
      <div class="field"><span class="lab">Ключ акаунта</span>
        <textarea class="keybox" id="rkey" placeholder="HOMIN1.…" spellcheck="false" autocapitalize="off"></textarea></div>
      <div class="field"><span class="lab">Пароль від акаунта</span>${pwField('rpw')}${errLine('rerr')}</div>
      ${rememberRow(true)}
      <button class="btn" id="rGo">${ic('key')} Відновити акаунт</button>
    </div></div>`;
  },
  mount(root){
    bindEyes(root);
    const key=$('#rkey',root), pw=$('#rpw',root), btn=$('#rGo',root);
    let remember=true, busy=false;
    [key,pw].forEach(el=>el.addEventListener('input',()=>showErr(root,'rerr','')));
    root.addEventListener('click', e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act==='back') back();
      else if(b.dataset.act==='remember'){ remember=!remember; $('#rmSwitch',root).classList.toggle('on',remember); buzz(6); }
    });
    btn.addEventListener('click', async ()=>{
      if(busy) return;
      if(!key.value.trim()){ showErr(root,'rerr','Вставте ключ акаунта'); return; }
      if(!pw.value){ showErr(root,'rerr','Введіть пароль від акаунта'); return; }
      busy=true; btn.disabled=true; btn.innerHTML='Відновлюємо…';
      const r=await auth.importKey(key.value, pw.value, remember);
      busy=false; btn.disabled=false; btn.innerHTML=ic('key')+' Відновити акаунт';
      if(r==='ok'){
        buzz(14); applyTheme(); resetTo('chats');
        window.H.notify.afterLogin();
        toast('Вітаємо, @'+S.me.username+'!');
        setTimeout(()=>window.H.net.start(), 500);
      } else if(r==='wrong-password') showErr(root,'rerr','Невірний пароль для цього ключа');
      else showErr(root,'rerr','Ключ пошкоджено або він не від Гомона');
    });
  }
};

/* ============================================================
   ВХІД ІЗ ХМАРИ (той самий акаунт на іншому пристрої)
   ============================================================ */
SCREENS.cloudlogin = {
  render(){
    return `<header class="topbar">
      <button class="icon-btn" data-act="back">${ic('back')}</button>
      <div class="grow"><h1>Вхід із хмари</h1></div>
    </header>
    <div class="scroll"><div style="padding:16px 16px 28px">
      <p style="color:var(--muted);font-size:13.4px;line-height:1.6;margin:0 0 18px">
        Введіть той самий @юзернейм і пароль, що й на іншому пристрої. Чати та
        листування підтягнуться з хмари, а обидва пристрої працюватимуть
        одночасно.</p>
      <div class="field"><span class="lab">Юзернейм</span>
        <div class="uwrap"><span class="at">@</span>
          <input id="clUser" maxlength="20" placeholder="ваш_юзернейм"
                 autocomplete="username" autocapitalize="off" spellcheck="false"></div></div>
      <div class="field"><span class="lab">Пароль</span>${pwField('clPw')}${errLine('clErr')}</div>
      ${rememberRow(true)}
      <button class="btn" id="clGo">${ic('cloud')} Увійти</button>
    </div></div>`;
  },
  mount(root){
    bindEyes(root);
    const u=$('#clUser',root), pw=$('#clPw',root), btn=$('#clGo',root);
    let remember=true, busy=false;
    [u,pw].forEach(el=>el.addEventListener('input',()=>showErr(root,'clErr','')));
    root.addEventListener('click', e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act==='back') back();
      else if(b.dataset.act==='remember'){ remember=!remember; $('#rmSwitch',root).classList.toggle('on',remember); buzz(6); }
    });
    const done=()=>{
      buzz(14); applyTheme(); resetTo('chats');
      window.H.notify.afterLogin();
      toast('Вітаємо, @'+S.me.username+'!');
      setTimeout(()=>window.H.net.start(), 500);
    };
    btn.addEventListener('click', async ()=>{
      if(busy) return;
      const name=normUser(u.value);
      if(!validUser(name)){ showErr(root,'clErr','Юзернейм — 3–20 символів латиницею'); return; }
      if(!pw.value){ showErr(root,'clErr','Введіть пароль'); return; }
      busy=true; btn.disabled=true; btn.innerHTML='Заходимо…';
      const finish=()=>{ busy=false; btn.disabled=false; btn.innerHTML=ic('cloud')+' Увійти'; };

      /* акаунт уже є на цьому пристрої — це звичайний вхід */
      if(auth.accounts().some(a=>a.username===name)){
        const r=await auth.unlock(name, pw.value, remember);
        finish();
        if(r==='ok') done();
        else if(r==='wrong-password') showErr(root,'clErr','Невірний пароль');
        else showErr(root,'clErr','Не вдалося увійти');
        return;
      }
      const r=await window.H.cloud.signIn(name, pw.value);
      if(r.error){
        finish();
        const why={wrong:'Невірний юзернейм або пароль',
                   'no-config':'Хмару не налаштовано — вкажіть проєкт Firebase у налаштуваннях',
                   'auth-off':'У проєкті Firebase не увімкнено вхід за паролем',
                   'too-many':'Забагато спроб — трохи зачекайте',
                   net:'Немає зʼєднання з хмарою'};
        showErr(root,'clErr', why[r.error]||'Не вдалося увійти в хмару');
        return;
      }
      await auth.adoptCloud(name, pw.value, Object.assign({uid:window.H.cloud.uid()}, r.profile||{}), remember);
      finish();
      done();
    });
    setTimeout(()=>u.focus(),350);
  }
};

/* ============================================================
   ПЕРЕНЕСЕННЯ ПРОФІЛЮ ЗІ СТАРОЇ ВЕРСІЇ
   ============================================================ */
SCREENS.adopt = {
  render(){
    const old=auth.legacy()||{me:{name:'',username:''}};
    const u=old.me.username||userOf(old.me.id||'');
    return `<div class="onb">
      <div class="logo">${ic('lock')}</div>
      <h1>Захистіть акаунт</h1>
      <p class="lede">На цьому пристрої вже є ваш профіль. Придумайте пароль — далі вхід буде за ним.</p>
      <div class="form">
        <div class="lockhead" style="padding-top:0">
          ${avatarHTML(old.me,'l')}
          <div><div class="nm">${esc(old.me.name)}</div>
            <div class="handle" style="margin-top:8px">${ic('user')}@${esc(u)}</div></div>
        </div>
        <div class="field"><span class="lab">Пароль</span>${pwField('apw','Мінімум 4 символи')}</div>
        <div class="field"><span class="lab">Повторіть пароль</span>${pwField('apw2')}${errLine('aerr')}</div>
        ${rememberRow(true)}
        <button class="btn" id="aGo">Зберегти пароль</button>
      </div>
    </div>`;
  },
  mount(root){
    bindEyes(root);
    const p1=$('#apw',root), p2=$('#apw2',root), btn=$('#aGo',root);
    let remember=true;
    [p1,p2].forEach(el=>el.addEventListener('input',()=>showErr(root,'aerr','')));
    root.addEventListener('click', e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      if(b.dataset.act==='remember'){ remember=!remember; $('#rmSwitch',root).classList.toggle('on',remember); buzz(6); }
    });
    btn.addEventListener('click', async ()=>{
      if(p1.value.length<4){ showErr(root,'aerr','Пароль замалий — щонайменше 4 символи'); return; }
      if(p1.value!==p2.value){ showErr(root,'aerr','Паролі не збігаються'); return; }
      btn.disabled=true; btn.innerHTML='Зберігаємо…';
      const r=await auth.adoptLegacy(p1.value, remember);
      btn.disabled=false; btn.innerHTML='Зберегти пароль';
      if(r==='ok'){ buzz(14); resetTo('chats'); window.H.notify.afterLogin();
        setTimeout(()=>window.H.net.start(), 500); }
      else showErr(root,'aerr','Не вдалося перенести профіль');
    });
  }
};

/* ============================================================
   ДІАЛОГИ З НАЛАШТУВАНЬ
   ============================================================ */
window.H.accountSheets = {
  key(){
    openSheet(`<h2>Ключ акаунта</h2>
      <p class="hint">Це ваш запасний вхід. Збережіть його в надійному місці — з ним і паролем ви зайдете
      у свій акаунт на іншому пристрої. Ключ містить профіль, контакти й листування без медіафайлів.</p>
      <textarea class="keybox" id="kbox" readonly style="min-height:130px">Готуємо ключ…</textarea>
      <button class="btn" style="margin-top:12px" id="kcopy">${ic('copy')} Скопіювати ключ</button>
      ${(function(){ try{ return window.top===window.self; }catch(e){ return false; } })()
        ? `<button class="btn ghost" style="margin-top:8px" id="ksave">${ic('down')} Зберегти файлом</button>` : ''}
      <p class="hint" style="margin:14px 0 0">Хто має ключ і пароль — має доступ до акаунта. Не надсилайте його нікому.</p>`,
      async sh=>{
        const key=await auth.exportKey();
        const box=$('#kbox',sh);
        if(!key){ box.value='Не вдалося створити ключ'; return; }
        box.value=key;
        $('#kcopy',sh).onclick=()=>window.H.copy(key);
        const sv=$('#ksave',sh);
        if(sv) sv.onclick=()=>{
          const a=document.createElement('a');
          a.href=URL.createObjectURL(new Blob([key],{type:'text/plain'}));
          a.download='homin-'+S.me.username+'.key.txt'; a.click();
          setTimeout(()=>URL.revokeObjectURL(a.href),4000);
          toast('Ключ збережено у завантаження');
        };
      });
  },
  password(){
    openSheet(`<h2>Змінити пароль</h2>
      <p class="hint">Новий пароль знадобиться і для ключа акаунта — старий ключ після зміни не спрацює.</p>
      <div class="field"><span class="lab">Поточний пароль</span>${pwField('cp0')}</div>
      <div class="field"><span class="lab">Новий пароль</span>${pwField('cp1','Мінімум 4 символи')}</div>
      <div class="field"><span class="lab">Повторіть новий</span>${pwField('cp2')}${errLine('cerr')}</div>
      <button class="btn" id="cGo">Змінити пароль</button>`, sh=>{
      bindEyes(sh);
      const a=$('#cp0',sh), b=$('#cp1',sh), c=$('#cp2',sh);
      $('#cGo',sh).onclick=async ()=>{
        if(b.value.length<4){ showErr(sh,'cerr','Пароль замалий — щонайменше 4 символи'); return; }
        if(b.value!==c.value){ showErr(sh,'cerr','Нові паролі не збігаються'); return; }
        const r=await auth.changePassword(a.value, b.value);
        if(r==='ok'){ closeSheet(); toast('Пароль змінено'); buzz(12); }
        else if(r==='failed') showErr(sh,'cerr','Не вдалося перешифрувати дані — спробуйте ще раз');
        else showErr(sh,'cerr','Поточний пароль невірний');
      };
    });
  },
  logout(){
    openSheet(`<h2>Вийти з акаунта?</h2>
      <p class="hint">Листування залишиться на пристрої — щоб повернутися, достатньо ввести пароль. Переконайтеся, що ви його памʼятаєте.</p>
      <button class="btn" id="y">${ic('logout')} Вийти</button>
      <button class="btn ghost" style="margin-top:8px" id="n">Залишитись</button>`, sh=>{
      $('#y',sh).onclick=()=>{
        closeSheet();
        if(window.H.net && window.H.net.shutdown) window.H.net.shutdown();
        auth.logout();
        resetTo('login');
      };
      $('#n',sh).onclick=()=>closeSheet();
    });
  },
  remove(){
    const u=S.me?S.me.username:'';
    openSheet(`<h2>Видалити акаунт із пристрою?</h2>
      <p class="hint">Профіль @${esc(u)}, усе листування, медіа та журнал дзвінків буде стерто з цього пристрою.
      Без ключа акаунта повернути їх буде неможливо.</p>
      <button class="btn danger" id="y">Так, видалити все</button>
      <button class="btn ghost" style="margin-top:8px" id="n">Скасувати</button>`, sh=>{
      $('#y',sh).onclick=()=>{
        closeSheet();
        if(window.H.net && window.H.net.shutdown) window.H.net.shutdown();
        auth.removeAccount(u);
        if(auth.hasAccounts()) resetTo('login'); else resetTo('onboard');
        toast('Акаунт видалено');
      };
      $('#n',sh).onclick=()=>closeSheet();
    });
  },
  switch(){
    openSheet(`<h2>Змінити акаунт</h2>
      <p class="hint">Поточний акаунт залишиться на пристрої — до нього можна повернутися з паролем.</p>
      <button class="btn" id="y">${ic('switchUser')} До списку акаунтів</button>
      <button class="btn ghost" style="margin-top:8px" id="n">Скасувати</button>`, sh=>{
      $('#y',sh).onclick=()=>{
        closeSheet();
        if(window.H.net && window.H.net.shutdown) window.H.net.shutdown();
        auth.logout();
        resetTo('login');
      };
      $('#n',sh).onclick=()=>closeSheet();
    });
  }
};
window.H.pwField=pwField;
window.H.bindEyes=bindEyes;
window.H.showErr=showErr;
})();
</script>
<script>
/* ============================================================
   ГОМІН — екран чату, композер, медіа, голосові
   ============================================================ */
(function(){
'use strict';
const {ic,$,$$,esc,uid,S,save,avatarHTML,shortTime,hhmm,dayLabel,dur,durLong,isSameDay,
       toast,buzz,openSheet,closeSheet,SCREENS,go,back,refresh,current,linkify,tick,clamp} = window.H;

const EMOJI='😀 😄 😁 🙂 😉 😍 🥰 😘 🤗 🤔 😐 🙄 😴 😢 😭 😤 😅 😎 🤩 🥳 👍 👎 👌 🙏 👏 💪 🔥 ✨ 🎉 ❤️ 🧡 💛 💚 💙 💜 🤍 💔 ☕ 🍕 🌿 🌞 🌙 ⭐ ⚡ 🎵 📷 📎 ✅ ❌ ⏰'.split(' ');

/* ============================================================
   CHAT SCREEN
   ============================================================ */
SCREENS.chat = {
  render({id}){
    const c=S.chats[id]; if(!c) return '';
    const st = c.typing ? '<span class="st on">друкує…</span>'
      : c.online ? '<span class="st on">у мережі</span>'
      : `<span class="st">${c.lastSeen?('був(ла) '+shortTime(c.lastSeen)):'офлайн'}</span>`;
    return `<header class="topbar">
      <button class="icon-btn" data-act="back" aria-label="Назад">${ic('back')}</button>
      <button class="chat-head" data-act="profile">
        ${avatarHTML(c,'s',c.online)}
        <div style="min-width:0;text-align:left"><div class="name">${esc(c.name)}</div>${st}</div>
      </button>
      <button class="icon-btn" data-act="audio" aria-label="Аудіодзвінок">${ic('phone')}</button>
      <button class="icon-btn" data-act="video" aria-label="Відеодзвінок">${ic('video')}</button>
      <button class="icon-btn" data-act="more" aria-label="Більше">${ic('more')}</button>
    </header>
    <div class="wall" id="wall" data-wall="${S.cfg.wall}">
      <div class="msgs" id="msgs">${renderMessages(c)}</div>
    </div>
    <button class="icon-btn" id="toBottom" style="position:absolute;right:14px;bottom:104px;z-index:9;background:var(--surface);
      box-shadow:var(--shadow-m);width:42px;height:42px;display:none">${ic('down')}</button>
    <div class="composer">
      <div class="cbar" id="cbar">
        <button class="icon-btn" data-act="attach" aria-label="Додати">${ic('clip')}</button>
        <div class="cfield">
          <textarea id="input" rows="1" placeholder="Повідомлення" maxlength="4000"></textarea>
          <button class="icon-btn" data-act="emoji" style="width:34px;height:34px" aria-label="Емодзі">${ic('smile')}</button>
        </div>
        <button class="send mic" id="sendBtn" data-act="mic" aria-label="Записати голосове">${ic('mic')}</button>
      </div>
      <div class="cbar" id="recwrap" hidden></div>
    </div>`;
  },
  mount(root,{id, focusMsg}){
    const c=S.chats[id]; if(!c) return;
    S.active=id;
    markRead(c);
    window.H.notify && window.H.notify.clear(id);
    const wall=$('#wall',root), input=$('#input',root), sendBtn=$('#sendBtn',root), toB=$('#toBottom',root);

    const scrollBottom=(smooth)=>{ wall.scrollTo({top:wall.scrollHeight, behavior:smooth?'smooth':'auto'}); };
    requestAnimationFrame(()=>{
      if(focusMsg){ const t=$('#m-'+CSS.escape(focusMsg),root);
        if(t){ t.scrollIntoView({block:'center'}); t.style.transition='background .5s';
          const b=t.querySelector('.bubble'); if(b){ b.animate([{filter:'brightness(1.35)'},{filter:'brightness(1)'}],{duration:900,easing:'ease-out'}); } return; } }
      scrollBottom();
    });
    wall.addEventListener('scroll',()=>{
      const far = wall.scrollHeight - wall.scrollTop - wall.clientHeight > 320;
      toB.style.display = far?'grid':'none';
    });
    toB.addEventListener('click',()=>scrollBottom(true));

    // autosize + send state
    const sync=()=>{
      input.style.height='auto';
      input.style.height=Math.min(120,input.scrollHeight)+'px';
      const has=input.value.trim().length>0;
      sendBtn.classList.toggle('mic',!has);
      sendBtn.dataset.act = has?'send':'mic';
      sendBtn.innerHTML = has?ic('send'):ic('mic');
      sendBtn.setAttribute('aria-label', has?'Надіслати':'Записати голосове');
      S.drafts[id]=input.value;
    };
    input.value = S.drafts[id]||''; sync();
    input.addEventListener('input',()=>{ sync(); window.H.net.sendTyping(id); });
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter' && !e.shiftKey && S.cfg.enterToSend){ e.preventDefault(); doSend(); }
    });

    function doSend(){
      const t=input.value.trim(); if(!t) return;
      window.H.sendText(id,t);
      input.value=''; S.drafts[id]=''; sync(); scrollBottom(true); buzz(8);
    }

    root.addEventListener('click', e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      const a=b.dataset.act;
      if(a==='back'){ S.active=null; back(); }
      else if(a==='profile') go('contact',{id});
      else if(a==='audio') window.H.net.startCall(id,'audio');
      else if(a==='video') window.H.net.startCall(id,'video');
      else if(a==='more') chatMenu(id);
      else if(a==='send') doSend();
      else if(a==='mic') window.H.voice.toggle(id, root);
      else if(a==='attach') attachSheet(id);
      else if(a==='emoji') emojiSheet(input, sync);
      else if(a==='play') window.H.voice.play(id, b.dataset.mid, b);
      else if(a==='view') window.H.viewImage(id, b.dataset.mid);
      else if(a==='retry') window.H.resend(id, b.dataset.mid);
      else if(a==='reccancel') window.H.voice.stop(true);
      else if(a==='recstop') window.H.voice.stop(false);
    });
    $('#msgs',root).addEventListener('click', e=>{
      const w=e.target.closest('.wave'); if(!w) return;
      const mid=w.dataset.mid; const box=w.closest('.mrow');
      const r=w.getBoundingClientRect();
      window.H.voice.seek(id, mid, (e.clientX-r.left)/r.width, box);
    });
  },
  onShow(root,{id}){ const c=S.chats[id]; if(c){ S.active=id; markRead(c); } }
};

function markRead(c){
  if(c.unread){ c.unread=0; save(); window.H.syncTabbar(); }
  let changed=false;
  c.messages.forEach(m=>{ if(m.from==='them' && !m.seen){ m.seen=true; changed=true; } });
  if(changed){ window.H.net.sendRead(c.id); window.H.cloud.markRead(c.id); save(); }
}

/* ---------- message rendering ---------- */
function renderMessages(c){
  if(!c.messages.length){
    return `<div class="empty" style="margin:auto"><div class="ico">${ic('waveform')}</div>
      <h3>Початок розмови</h3><p>Напишіть перше повідомлення — воно надійде, щойно ${esc(c.name)} буде в мережі.</p></div>`;
  }
  let html='', prevDay=null, prev=null;
  c.messages.forEach((m,i)=>{
    if(!prevDay || !isSameDay(prevDay,m.ts)){ html+=`<div class="day">${dayLabel(m.ts)}</div>`; prevDay=m.ts; }
    const next=c.messages[i+1];
    const tail = !next || next.from!==m.from || !isSameDay(next.ts,m.ts) || (next.ts-m.ts>4*60000) || next.type==='call';
    html += msgHTML(m, tail, c);
    prev=m;
  });
  if(c.typing) html += `<div class="typing-row"><div class="typing"><i></i><i></i><i></i></div></div>`;
  return html;
}
window.H.renderMessages = renderMessages;

function msgHTML(m, tail, c){
  if(m.type==='call'){
    return `<div class="sys" id="m-${esc(m.id)}"><span style="display:inline-flex;color:${m.missed?'var(--ember)':'var(--muted)'}">${ic(m.missed?'phoneOff':(m.from==='me'?'phoneOut':'phoneIn'))}</span><span>${esc(m.text)} · ${hhmm(m.ts)}</span></div>`;
  }
  if(m.type==='sys') return `<div class="sys" id="m-${esc(m.id)}">${esc(m.text)}</div>`;
  const out = m.from==='me';
  const meta = `<span class="meta"><span class="t">${hhmm(m.ts)}</span>${out?tick(m.status):''}</span>`;
  let inner='';
  if(m.type==='image'){
    inner = (m.src
        ? `<a class="photoWrap" data-act="view" data-mid="${esc(m.id)}" style="display:block">
        <img class="photo" src="${esc(m.src)}" alt="Фото" loading="lazy">
      </a>`
        : `<div class="photo ph" aria-label="Фото завантажується"></div>`)
      + `${m.text?`<div class="cap">${linkify(m.text)}</div>`:''}${meta}`;
    return `<div class="mrow ${out?'out':'in'} ${tail?'tail':''}" id="m-${esc(m.id)}"><div class="bubble media">${inner}</div></div>`;
  }
  if(m.type==='voice'){
    const bars=(m.wave&&m.wave.length?m.wave:defaultWave(m.id));
    inner = `<div class="voice">
        <button class="vplay" data-act="play" data-mid="${esc(m.id)}" aria-label="Відтворити">${ic('play')}</button>
        <div class="vbody">
          <div class="wave" data-mid="${esc(m.id)}">${bars.map(v=>`<i style="height:${Math.max(12,Math.round(v*100))}%"></i>`).join('')}</div>
          <div class="vfoot"><span class="vtime">${dur(m.dur||0)}</span>${!out&&!m.heard?'<span class="vdot"></span>':''}</div>
        </div>
      </div>${meta}`;
    return `<div class="mrow ${out?'out':'in'} ${tail?'tail':''}" id="m-${esc(m.id)}"><div class="bubble">${inner}</div></div>`;
  }
  inner = `<div class="txt">${linkify(m.text||'')}</div>${meta}`;
  return `<div class="mrow ${out?'out':'in'} ${tail?'tail':''}" id="m-${esc(m.id)}"><div class="bubble">${inner}</div></div>`;
}
function defaultWave(seed){
  const h=window.H.hashOf(seed); const out=[];
  for(let i=0;i<34;i++){ out.push(0.25+((h>>(i%16))&7)/12); }
  return out;
}

/* ---------- repaint ---------- */
let repaintPending=false;
window.H.repaintChat = function(id){
  const c=current();
  if(!c || c.name!=='chat' || c.params.id!==id) return;
  if(repaintPending) return; repaintPending=true;
  requestAnimationFrame(()=>{
    repaintPending=false;
    const cur=current(); if(!cur||cur.name!=='chat'||cur.params.id!==id) return;
    const wall=$('#wall',cur.el), box=$('#msgs',cur.el);
    if(!wall||!box) return;
    const near = wall.scrollHeight - wall.scrollTop - wall.clientHeight < 220;
    box.innerHTML = renderMessages(S.chats[id]);
    if(near) wall.scrollTop = wall.scrollHeight;
    // header status
    const chat=S.chats[id];
    const st=cur.el.querySelector('.chat-head .st');
    if(st){ st.className='st'+((chat.typing||chat.online)?' on':'');
      st.textContent = chat.typing?'друкує…' : chat.online?'у мережі'
        : (chat.lastSeen?('був(ла) '+shortTime(chat.lastSeen)):'офлайн'); }
  });
};
window.H.repaintList = function(){
  const c=current();
  if(c && (c.name==='chats'||c.name==='calls')) refresh();
  window.H.syncTabbar();
};

/* ---------- open chat ---------- */
window.H.openChat=function(id, focusMsg){
  if(!S.chats[id]) return;
  S.search='';
  const db=window.H.db;
  if(db.active() && !db.isHydrated(id)){
    /* повну історію й медіа беремо з бази; якщо база забарилася —
       відкриваємо чат одразу, решта дозавантажиться на місці */
    const ready=db.hydrate(id).then(()=>{ db.evict(id); window.H.repaintChat(id); });
    Promise.race([ready, new Promise(r=>setTimeout(r,450))])
      .then(()=>go('chat',{id, focusMsg}));
    return;
  }
  go('chat',{id, focusMsg});
};

/* ---------- chat menu ---------- */
function chatMenu(id){
  const c=S.chats[id];
  openSheet(`<h2>${esc(c.name)}</h2><p class="hint mono" style="font-size:12.5px">${esc(c.id)}</p>
    <div class="group" style="margin:0">
      <button class="srow" data-a="profile"><span class="ic" style="background:#0E9C8C">${ic('user')}</span><div class="t"><b>Профіль</b></div></button>
      <button class="srow" data-a="pin"><span class="ic" style="background:#B8892B">${ic('pin')}</span><div class="t"><b>${c.pinned?'Відкріпити':'Закріпити'}</b></div></button>
      <button class="srow" data-a="mute"><span class="ic" style="background:#6C7B77">${ic('bell')}</span><div class="t"><b>${c.muted?'Увімкнути сповіщення':'Вимкнути сповіщення'}</b></div></button>
      <button class="srow" data-a="clear"><span class="ic" style="background:#C0392B">${ic('trash')}</span><div class="t"><b style="color:var(--danger)">Очистити листування</b></div></button>
    </div>`, sh=>{
    sh.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]'); if(!b) return;
      const a=b.dataset.a; closeSheet();
      if(a==='profile') go('contact',{id});
      else if(a==='pin'){ c.pinned=!c.pinned; save(); toast(c.pinned?'Закріплено':'Відкріплено'); }
      else if(a==='mute'){ c.muted=!c.muted; save(); toast(c.muted?'Сповіщення вимкнено':'Сповіщення увімкнено'); }
      else if(a==='clear'){ c.messages=[]; window.H.db.clearMessages(id); save();
        window.H.repaintChat(id); toast('Листування очищено'); }
    });
  });
}

/* ---------- attach & emoji ---------- */
function attachSheet(id){
  openSheet(`<h2>Додати до повідомлення</h2>
    <div class="att-grid">
      <button class="att" data-a="gallery"><span class="ic" style="background:linear-gradient(145deg,#0E9C8C,#0B6E7F)">${ic('image')}</span><span>Галерея</span></button>
      <button class="att" data-a="camera"><span class="ic" style="background:linear-gradient(145deg,#C25E36,#93381F)">${ic('camera')}</span><span>Камера</span></button>
      <button class="att" data-a="voice"><span class="ic" style="background:linear-gradient(145deg,#4C5FD7,#2E3B96)">${ic('mic')}</span><span>Голосове</span></button>
    </div>`, sh=>{
    sh.addEventListener('click',e=>{
      const b=e.target.closest('[data-a]'); if(!b) return;
      const a=b.dataset.a; closeSheet();
      if(a==='gallery') window.H.pickImage(false, src=>window.H.sendImage(id,src));
      else if(a==='camera') window.H.pickImage(true, src=>window.H.sendImage(id,src));

function compress(file, max, q, square){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const cv=document.createElement('canvas');
        const ctx=cv.getContext('2d');
        if(square){
          const s=Math.min(w,h); cv.width=cv.height=Math.min(max,s);
          ctx.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,cv.width,cv.height);
        } else {
          const k=Math.min(1,max/Math.max(w,h));
          cv.width=Math.round(w*k); cv.height=Math.round(h*k);
          ctx.drawImage(img,0,0,cv.width,cv.height);
        }
        res(cv.toDataURL('image/jpeg',q));
      };
      img.onerror=rej; img.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

/* ---------- fullscreen viewer ---------- */
function canSave(){ try{ return window.top===window.self; }catch(e){ return false; } }
window.H.viewImage=function(chatId, mid){
  const c=S.chats[chatId]; if(!c) return;
  const list=c.messages.filter(m=>m.type==='image'&&m.src);
  let i=Math.max(0,list.findIndex(m=>m.id===mid));
  const ov=document.createElement('div');
  ov.className='viewer';
  ov.innerHTML=`<div class="vtop">
      <button class="icon-btn" data-a="close" aria-label="Закрити">${ic('x')}</button>

    </div>
    <div class="vstage" id="vstage"><img id="vimg" alt=""></div>`;
  $('#overlays').appendChild(ov);
  const img=$('#vimg',ov), stage=$('#vstage',ov);
  let scale=1,tx=0,ty=0;
  const apply=()=>{ img.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`; };
  function show(k){
    i=(k+list.length)%list.length;
    const m=list[i];
    img.src=m.src;
    $('#vName',ov).textContent = m.from==='me'?(S.me.name+' (ви)'):c.name;
    $('#vTime',ov).textContent = dayLabel(m.ts)+' · '+hhmm(m.ts)+(list.length>1?`  ·  ${i+1}/${list.length}`:'');
    scale=1;tx=0;ty=0;apply();
  }
  show(i);
  const close=()=>{ ov.classList.add('out'); setTimeout(()=>ov.remove(),240); };
  ov.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');
    if(b){ if(b.dataset.a==='close') close();
      else { const a=document.createElement('a'); a.href=img.src; a.download='homin-'+Date.now()+'.jpg'; a.click(); toast('Збережено у завантаження'); }
      return; }
    if(e.target===stage||e.target===img){ ov.classList.toggle('hidechrome'); }
  });
  // gestures
  let pointers=new Map(), startDist=0, startScale=1, sx=0, sy=0, panning=false, lastTap=0;
  stage.addEventListener('pointerdown',e=>{
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){ const p=[...pointers.values()]; startDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); startScale=scale; }
    else { panning=true; sx=e.clientX-tx; sy=e.clientY-ty;
      const now=Date.now();
      if(now-lastTap<300){ scale = scale>1?1:2.4; tx=0;ty=0; apply(); }
      lastTap=now; }
  });
  stage.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){
      const p=[...pointers.values()]; const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      scale=clamp(startScale*(d/startDist),1,5); apply();
    } else if(panning){
      tx=e.clientX-sx; ty=e.clientY-sy;
      if(scale<=1){ tx=0; img.style.opacity=String(Math.max(.25,1-Math.abs(ty)/420)); }
      apply();
    }
  });
  const up=e=>{
    pointers.delete(e.pointerId);
    if(pointers.size===0){
      panning=false;
      if(scale<=1){
        if(Math.abs(ty)>110){ close(); return; }
        if(Math.abs(tx)<10 && Math.abs(ty)<10){}
        ty=0;tx=0; img.style.opacity='1'; img.style.transition='transform .28s cubic-bezier(.22,1,.36,1)';
        apply(); setTimeout(()=>img.style.transition='',300);
      }
    }
  };
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
  if(list.length>1){
    let swx=0;
    stage.addEventListener('pointerdown',e=>{ if(pointers.size===1&&scale<=1) swx=e.clientX; });
    stage.addEventListener('pointerup',e=>{
      if(scale>1) return;
      const dx=e.clientX-swx;
      if(Math.abs(dx)>70 && Math.abs(ty)<60) show(i+(dx<0?1:-1));
    });
  }
};

/* ============================================================

const voice = {
  rec:null, stream:null, chunks:[], t0:0, timer:null, analyser:null, raf:0, chatId:null, cancelled:false,
  async toggle(chatId, root){
    if(this.rec){ this.stop(false); return; }
    try{
      this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    }catch(e){ toast('Немає доступу до мікрофона'); return; }
    this.chatId=chatId; this.cancelled=false; this.chunks=[];
    let mime='';
    ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].some(m=>{
      if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)){ mime=m; return true; } return false; });
    try{ this.rec = new MediaRecorder(this.stream, mime?{mimeType:mime}:undefined); }
    catch(e){ toast('Запис не підтримується'); this.release(); return; }
    this.rec.ondataavailable=e=>{ if(e.data&&e.data.size) this.chunks.push(e.data); };
    this.rec.onstop=()=>this.finish();
    this.rec.start(100); this.t0=Date.now(); buzz(14);
    this.showBar(root);
    // level meter
    try{
      const ac=new (window.AudioContext||window.webkitAudioContext)();
      const src=ac.createMediaStreamSource(this.stream);
      const an=ac.createAnalyser(); an.fftSize=64; src.connect(an);
      this.actx=ac; this.analyser=an;
      const data=new Uint8Array(an.frequencyBinCount);
      const bars=$$('#recLvl i');
      const loop=()=>{ if(!this.rec) return;
        an.getByteFrequencyData(data);
        bars.forEach((b,k)=>{ const v=data[(k*2)%data.length]/255; b.style.height=Math.max(12,v*100)+'%'; b.style.opacity=String(.35+v*.65); });
        this.raf=requestAnimationFrame(loop); };
      loop();
    }catch(e){}
  },
  showBar(root){
    const cbar=$('#cbar',root), rw=$('#recwrap',root); if(!cbar||!rw) return;
    rw.innerHTML=`<div class="recbar"><span class="blink"></span><span class="tm" id="recTm">0:00</span>
      <span class="lvl" id="recLvl">${Array.from({length:22}).map(()=>'<i></i>').join('')}</span>
      <button class="cancel" data-act="reccancel">Скасувати</button></div>
      <button class="send rec" data-act="recstop" aria-label="Надіслати">${ic('send')}</button>`;
    cbar.hidden=true; rw.hidden=false;
    this.timer=setInterval(()=>{
      const el=$('#recTm'); if(el) el.textContent=dur((Date.now()-this.t0)/1000);
      if((Date.now()-this.t0)>1000*60*5) this.stop(false);
    },200);
  },
  hideBar(){
    clearInterval(this.timer); cancelAnimationFrame(this.raf);
    const cur=current(); if(!cur) return;
    const cbar=$('#cbar',cur.el), rw=$('#recwrap',cur.el);
    if(rw){ rw.hidden=true; rw.innerHTML=''; }
    if(cbar) cbar.hidden=false;
  },
  stop(cancel){
    if(!this.rec) return;
    this.cancelled=!!cancel;
    try{ this.rec.stop(); }catch(e){}
    buzz(10);
  },
  release(){
    if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; }
    if(this.actx){ try{this.actx.close();}catch(e){} this.actx=null; }
    this.rec=null; this.analyser=null;
  },
  async finish(){
    const secs=(Date.now()-this.t0)/1000;
    const blob=new Blob(this.chunks,{type:this.chunks[0]&&this.chunks[0].type||'audio/webm'});
    const chatId=this.chatId, cancelled=this.cancelled;
    this.release(); this.hideBar();
    if(cancelled){ toast('Запис скасовано'); return; }
    if(secs<0.7){ toast('Занадто коротко — тримайте довше'); return; }
    const src=await blobToDataURL(blob);
    const wave=await waveFrom(blob).catch(()=>defaultWave(String(Date.now())));
    window.H.sendVoice(chatId, src, Math.round(secs), wave);
  },
  /* playback */
  audio:null, cur:null,
  play(chatId, mid, btn){
    const c=S.chats[chatId]; const m=c.messages.find(x=>x.id===mid); if(!m||!m.src) return;
    const row=btn.closest('.mrow');
    if(this.cur===mid && this.audio && !this.audio.paused){ this.audio.pause(); this.setIcon(row,false); return; }
    if(this.audio){ this.audio.pause(); const old=document.getElementById('m-'+CSS.escape(this.cur||'')); if(old) this.setIcon(old,false); }
    this.audio=new Audio(m.src); this.cur=mid;
    m.heard=true;
    const bars=$$('.wave i',row), tm=$('.vtime',row);
    this.audio.onended=()=>{ this.setIcon(row,false); bars.forEach(b=>b.classList.remove('done')); if(tm) tm.textContent=dur(m.dur||0); };
    this.audio.ontimeupdate=()=>{
      const d=this.audio.duration||m.dur||1, p=this.audio.currentTime/d;
      bars.forEach((b,k)=>b.classList.toggle('done', k/bars.length<=p));
      if(tm) tm.textContent=dur(this.audio.currentTime);
    };
    this.audio.play().then(()=>this.setIcon(row,true)).catch(()=>toast('Не вдалося відтворити'));
  },
  seek(chatId,mid,p,row){
    if(this.cur!==mid||!this.audio){ const b=row.querySelector('.vplay'); if(b) this.play(chatId,mid,b); return; }
    const d=this.audio.duration; if(isFinite(d)) this.audio.currentTime=clamp(p,0,1)*d;
  },
  setIcon(row,playing){
    const b=row.querySelector('.vplay'); if(b) b.innerHTML=ic(playing?'pause':'play');
  }
};
window.H.voice=voice;

function blobToDataURL(b){ return new Promise((res,rej)=>{ const f=new FileReader(); f.onload=()=>res(f.result); f.onerror=rej; f.readAsDataURL(b); }); }
async function waveFrom(blob){
  const buf=await blob.arrayBuffer();
  const ac=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,1,22050);
  const audio=await ac.decodeAudioData(buf);
  const data=audio.getChannelData(0); const N=34, step=Math.floor(data.length/N)||1; const out=[];
  let max=0.0001;
  for(let i=0;i<N;i++){
    let s=0; const o=i*step;
    for(let k=0;k<step;k+=Math.max(1,Math.floor(step/60))) s=Math.max(s,Math.abs(data[o+k]||0));
    out.push(s); if(s>max) max=s;
  }
  return out.map(v=>clamp(0.14+(v/max)*0.86,0.14,1));
}
window.H.defaultWave=defaultWave;
})();

<script>
/* ============================================================
   ГОМІН — мережа (WebRTC/PeerJS), повідомлення, дзвінки
   ============================================================ */
(function(){
'use strict';
const {ic,$,$$,esc,uid,S,save,toast,buzz,avatarHTML,dur,durLong,current,go,back,
       openSheet,closeSheet,refresh,hhmm,sleep,clamp,idOf,userOf,normUser,validUser} = window.H;

/* ---------- sound ---------- */
let AC=null;
function actx(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function beep(freqs, len, gain){
  if(!S.cfg.sounds) return;
  const ac=actx(); if(!ac) return;
  freqs.forEach((f,i)=>{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=f;
    const t0=ac.currentTime+i*0.09;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(gain||0.07,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+(len||0.18));
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+(len||0.18)+0.05);
  });
}
const snd={ in:()=>beep([680,900],.16,.05), out:()=>beep([880],.1,.035), call:()=>beep([520,660],.2,.06) };
let ringTimer=null;
function ringStart(){ if(!S.cfg.sounds) return; ringStop(); const t=()=>{beep([740,880,740],.22,.08); buzz([90,60,90]);}; t(); ringTimer=setInterval(t,2200); }
function ringStop(){ clearInterval(ringTimer); ringTimer=null; }

/* ---------- data helpers ---------- */
function dataURLtoBytes(d){
  const i=d.indexOf(','), meta=d.slice(0,i), b64=d.slice(i+1);
  const bin=atob(b64), a=new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++) a[k]=bin.charCodeAt(k);
  return {bytes:a, mime:(meta.match(/data:([^;]+)/)||[])[1]||'application/octet-stream'};
}
function bytesToDataURL(bytes, mime){
  const a = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  let s=''; const CH=0x8000;
  for(let i=0;i<a.length;i+=CH) s+=String.fromCharCode.apply(null,a.subarray(i,i+CH));
  return 'data:'+(mime||'application/octet-stream')+';base64,'+btoa(s);
}

/* ---------- chat helpers ---------- */
function ensureChat(id, name, username){
  if(!S.chats[id]){
    S.chats[id]={id, username:username||userOf(id), name:name||('@'+userOf(id)), bio:'', avatar:null,
      messages:[], unread:0, created:Date.now(), online:false, lastSeen:0, typing:false,
      pinned:false, muted:false, friend:false, pendingIn:false, pendingOut:false};
    save();
  }
  const c=S.chats[id];
  if(!c.username) c.username=username||userOf(id);
  return c;
}
function applyProfile(c, prof){
  if(!prof) return;
  if(prof.name) c.name=prof.name;
  if(prof.username) c.username=prof.username;
  if(prof.bio) c.bio=prof.bio;
  if(prof.avatar!==undefined) c.avatar=prof.avatar;
  if(prof.pub && c.uid){ window.H.e2e.forget(c.uid, prof.pub); c.pub=prof.pub; }
  else if(prof.pub) c.pub=prof.pub;
}
function pushMsg(chat, m, silent){
  chat.messages.push(m);
  if(chat.messages.length>400) chat.messages.splice(0, chat.messages.length-400);
  save();
  window.H.repaintChat(chat.id);
  window.H.repaintList();
  if(!silent && m.from==='them' && S.active!==chat.id && !chat.muted){ chat.unread=(chat.unread||0)+1; snd.in(); buzz(12); }
  if(!silent && m.from==='them') window.H.notify.message(chat, m);
  window.H.syncTabbar();
}
function newMsg(o){ return Object.assign({id:uid(10), ts:Date.now(), status:'sending', from:'me', type:'text'}, o); }

/* Повідомлення приходять двома шляхами — напряму від пристрою і
   з хмари, — тож приймаємо їх в одному місці й відсіюємо повтори
   за ідентифікатором. */
function receive(chatId, m, mine){
  const c=ensureChat(chatId);
  const old=c.messages.find(x=>x.id===m.id);
  if(old){
    /* другий примірник того самого: беремо звідти те, чого бракує */
    let ch=false;
    if(m.src && !old.src){ old.src=m.src; ch=true; }
    if(ch){ save(); window.H.repaintChat(chatId); }
    return;
  }
  c.typing=false;
  const last=c.messages[c.messages.length-1];
  if(last && m.ts < last.ts){
    /* старіше за те, що вже маємо — це історія, вставляємо мовчки */
    const i=c.messages.findIndex(x=>x.ts>m.ts);
    c.messages.splice(i<0?c.messages.length:i, 0, m);
    save(); window.H.repaintChat(chatId); window.H.repaintList();
    return;
  }
  pushMsg(c, m, !!mine);
  if(!mine && S.active===chatId){
    setTimeout(()=>{ m.seen=true; net.sendRead(chatId); window.H.cloud.markRead(chatId); }, 200);
  }
}

/* ---------- outgoing ---------- */
window.H.sendText=function(id,text){
  const c=ensureChat(id);
  const m=newMsg({type:'text', text});
  pushMsg(c,m); snd.out();
  deliver(c,m);
};
window.H.sendImage=function(id,src,caption){
  const c=ensureChat(id);
  const m=newMsg({type:'image', src, text:caption||''});
  pushMsg(c,m); snd.out();
  deliver(c,m);
};
window.H.sendVoice=function(id,src,seconds,wave){
  const c=ensureChat(id);
  const m=newMsg({type:'voice', src, dur:seconds, wave});
  pushMsg(c,m); snd.out();
  deliver(c,m);
};
window.H.resend=function(id,mid){
  const c=S.chats[id]; const m=c.messages.find(x=>x.id===mid); if(!m) return;
  m.status='sending'; window.H.repaintChat(id); deliver(c,m);
};

function deliver(chat, m){
  const conn=conns[chat.id];
  const payload={t:'msg', m:{id:m.id, type:m.type, text:m.text||'', ts:m.ts, dur:m.dur||0, wave:m.wave||null}};
  if(m.src){ const {bytes,mime}=dataURLtoBytes(m.src); payload.bin=bytes; payload.mime=mime; }
  if(conn && conn.open){
    try{ conn.send(payload); setStatus(chat,m,'sent'); }
    catch(e){ queue(chat.id,payload); }
  } else {
    queue(chat.id,payload);
    net.addPeer(chat.id, true);
    window.H.notify.wake(chat, 'msg');
  }
  /* Хмара доносить повідомлення, навіть якщо співрозмовник офлайн,
     і показує його на решті ваших пристроїв. */
  if(window.H.cloud.on()){
    window.H.cloud.send(chat.id, m).then(ok=>{ if(ok) setStatus(chat,m,'sent'); });
  }
}
function setStatus(chat,m,st){
  const rank={sending:0,sent:1,delivered:2,read:3};
  if(rank[st]<=rank[m.status]) return;
  m.status=st; save(); window.H.repaintChat(chat.id); window.H.repaintList();
}
const outbox={};
function queue(id,payload){ (outbox[id]=outbox[id]||[]).push(payload); }
function flush(id){
  const q=outbox[id]; if(!q||!q.length) return;
  const conn=conns[id]; if(!conn||!conn.open) return;
  const chat=S.chats[id];
  q.splice(0).forEach(p=>{
    try{ conn.send(p); if(p.t==='msg'&&chat){ const m=chat.messages.find(x=>x.id===p.m.id); if(m) setStatus(chat,m,'sent'); } }
    catch(e){ queue(id,p); }
  });
}

/* ============================================================
   PEER / NETWORK

   Раніше пристрій підключався до мережі під іменем homin-<юзернейм>,
   тому другий пристрій з тим самим акаунтом діставав відмову
   «юзернейм уже в мережі» й лишався без звʼязку.

   Тепер ім'я займає той, хто прийшов першим, а наступні пристрої
   беруть homin-<юзернейм>-<пристрій> і працюють одночасно з ним.
   Ключ чату завжди канонічний homin-<юзернейм>, тож для
   співрозмовника нічого не змінюється; а куди саме стукати,
   підказує список пристроїв із хмари.
   ============================================================ */
const conns={};
const lookups={};
let peer=null, peerLoaded=false, callObj=null, idRetry=0, myPeer=null;
let tries=0, connectAt=0;

/* Прямий звʼязок між двома телефонами в різних мережах майже
   завжди впирається в NAT оператора. STUN лише підказує вашу
   зовнішню адресу; провести трафік крізь «глухий» NAT може тільки
   TURN. Свій вкажіть у firebase-config.js полем ice — без нього
   дзвінки працюють здебільшого в межах однієї мережі, а
   повідомлення все одно доходять через хмару. */
const STUN=[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302',
                   'stun:stun.cloudflare.com:3478']}];
let iceFetched=null;      // те, що віддав постачальник TURN
function iceServers(){
  const cfg=window.H.cloud.config()||{};
  if(iceFetched && iceFetched.length) return iceFetched;
  return (Array.isArray(cfg.ice) && cfg.ice.length) ? cfg.ice : STUN;
}

/* Більшість постачальників TURN (metered.ca, Cloudflare, Twilio)
   видають тимчасові логін і пароль за одним посиланням. Тоді в
   firebase-config.js досить рядка iceUrl — застосунок сам візьме
   свіжі дані під час запуску, і ніхто нічого не вводить. */
async function loadIce(){
  const cfg=window.H.cloud.config()||{};
  if(!cfg.iceUrl) return false;
  try{
    const res=await fetch(cfg.iceUrl, {cache:'no-store'});
    if(!res.ok) return false;
    const data=await res.json();
    const list=Array.isArray(data) ? data
             : Array.isArray(data.iceServers) ? data.iceServers
             : Array.isArray(data.v) ? data.v : null;
    if(!list || !list.length) return false;
    /* до отриманих додаємо STUN — раптом постачальник його не дав */
    iceFetched=list.concat(STUN);
    return true;
  }catch(e){ return false; }
}
window.H.loadIce=loadIce;
function hasTurn(){
  const cfg=window.H.cloud.config()||{};
  if(cfg.iceUrl && !iceFetched) return true;   /* ще не встигли завантажити */
  return iceServers().some(s=>{
    const u=s&&s.urls;
    const list=Array.isArray(u)?u:[u];
    return list.some(x=>String(x||'').indexOf('turn')===0);
  });
}
window.H.iceServers=iceServers;
window.H.hasTurn=hasTurn;

/* homin-maks-3f8a1c  ->  homin-maks */
function canon(pid){
  const p=String(pid||'').split('-');
  return p.length>1 ? p[0]+'-'+p[1] : String(pid||'');
}
function myPeerId(){
  const base=idOf(S.me.username);
  /* перша спроба — звичне імʼя; воно ж лишається адресою для тих,
     хто шукає нас напряму, без хмари */
  if(!idRetry) return base;
  return base+'-'+window.H.cloud.device().slice(1,9)+(idRetry>1?String(idRetry):'');
}
/* Кому саме адресувати зʼєднання: свіжий пристрій друга з хмари,
   а якщо його там немає — просто homin-<юзернейм>. */
function targetOf(chatId){
  const c=S.chats[chatId];
  if(c && c.uid){
    const list=window.H.cloud.peersOf(c.uid);
    if(list.length) return list[0];
  }
  return chatId;
}

function loadPeerJS(){
  if(peerLoaded) return Promise.resolve(!!window.Peer);
  const urls=[
    'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js',
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'
  ];
  return new Promise(res=>{
    let i=0;
    const tryNext=()=>{
      if(i>=urls.length){ peerLoaded=true; res(false); return; }
      const s=document.createElement('script');
      s.src=urls[i++]; s.async=true;
      s.onload=()=>{ peerLoaded=true; res(!!window.Peer); };
      s.onerror=tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
}

const net = {
  async start(manual){
    if(!S.me) return;
    if(peer && !peer.destroyed && !peer.disconnected){ if(manual) toast('Уже підключено'); return; }
    setNet('wait');
    connectAt=Date.now();
    if(!iceFetched) await loadIce();
    const ok=await loadPeerJS();
    if(!ok || !window.Peer){ setNet('bad'); if(manual) toast('Не вдалося підключитися — перевірте інтернет'); return; }
    try{
      if(peer){ try{peer.destroy();}catch(e){} }
      S.me.id = idOf(S.me.username);
      myPeer = myPeerId();
      peer = new window.Peer(myPeer, {debug:0, config:{iceServers:iceServers()}});
    }catch(e){ setNet('bad'); return; }
    /* Буває, що сервер не відповідає ні «готово», ні помилкою.
       Без цього сторожа застосунок підключався б нескінченно. */
    const mine=peer;
    setTimeout(()=>{
      if(peer!==mine || !peer || peer.open) return;
      try{ peer.destroy(); }catch(e){}
      peer=null;
      if(tries<3){ tries++; setTimeout(()=>net.start(), 900*tries); }
      else { tries=0; setNet('bad'); }
    }, 12000);
    peer.on('open', ()=>{ setNet('ok'); idRetry=0; tries=0;
      window.H.cloud.touch(myPeer);
      // reconnect to known peers
      if(S.cfg.autoConnect) Object.keys(S.chats).forEach(id=>net.addPeer(id,true));
    });
    peer.on('connection', conn=>attach(conn));
    peer.on('call', c=>incomingCall(c));
    peer.on('disconnected', ()=>{ setNet('wait'); setTimeout(()=>{ try{ peer && peer.reconnect(); }catch(e){} },1500); });
    peer.on('error', err=>{
      const t=err && err.type;
      if(t==='peer-unavailable'){
        const m=(err.message||'').match(/homin-[a-z0-9_]+/);
        if(m && lookups[m[0]]) lookups[m[0]].fail();
        if(m && callUI && callUI.peerId===m[0] && !callUI.connected) endCall('Абонент не в мережі', true);
        return; }
      if(t==='unavailable-id'){
        /* імʼя вже зайняте іншим нашим пристроєм — беремо власне */
        if(idRetry<3){ idRetry++; try{peer.destroy();}catch(e2){} peer=null; setTimeout(()=>net.start(),1000); }
        else { setNet('bad'); toast('Не вдалося зайняти імʼя в мережі', 3600); }
        return; }
      if(t==='network'||t==='server-error'||t==='socket-error'||t==='browser-incompatible'){ setNet('bad'); }
    });
  },
  addPeer(id, silent){
    if(!id||id===S.me.id) return;
    const c=ensureChat(id);
    if(!silent){ window.H.repaintList(); }
    if(!peer || peer.destroyed || !peer.open){
      if(!silent && !window.H.cloud.on()) toast('Немає зʼєднання — повідомлення надішлеться пізніше');
      return;
    }
    if(conns[id] && conns[id].open) return;
    try{
      const conn=peer.connect(targetOf(id),{reliable:true, metadata:{profile:shortProfile()}});
      attach(conn);
    }catch(e){}
  },
  peerId(){ return myPeer; },
  ensureChat,
  receive,
  /* Телефон, який пролежав у кишені, часто повертається з мертвим
     сокетом, про який PeerJS ще не знає. Тут ми це помічаємо. */
  wake(){
    if(!S.me) return;
    if(!peer || peer.destroyed || peer.disconnected){ net.start(); return; }
    if(peer.open){ window.H.cloud.touch(myPeer); return; }
    if(Date.now()-connectAt > 15000) net.restart();
  },
  sendTyping(id){
    const conn=conns[id]; const now=Date.now();
    if(!conn||!conn.open) return;
    if(net._lastTyping && now-net._lastTyping<1800) return;
    net._lastTyping=now;
    try{ conn.send({t:'typing'}); }catch(e){}
  },
  sendRead(id){
    if(!S.cfg.readReceipts) return;
    const conn=conns[id]; if(!conn||!conn.open) return;
    const ids=S.chats[id].messages.filter(m=>m.from==='them').map(m=>m.id);
    try{ conn.send({t:'read', ids}); }catch(e){}
  },
  broadcastProfile(){
    Object.values(conns).forEach(c=>{ if(c&&c.open){ try{ c.send({t:'profile', profile:myProfile(), push:myPush(S.chats[canon(c.peer)])}); }catch(e){} } });
  },
  /* підписка на пуш зʼявилася або змінилася — сповіщаємо друзів */
  sharePush(){
    Object.values(conns).forEach(c=>{
      if(!c || !c.open) return;
      const chat=S.chats[canon(c.peer)];
      if(!chat || !chat.friend) return;
      try{ c.send({t:'push', push:myPush(chat)}); }catch(e){}
    });
  },
  /* --- юзернейми та друзі --- */
  async checkUsername(u){
    if(!validUser(u)) return 'invalid';
    if(S.me && S.me.username===u) return 'free';
    /* з хмарою це точна відповідь, а не здогадка «хтось зараз у мережі» */
    if(window.H.cloud.configured()){
      const free=await window.H.cloud.usernameFree(u);
      if(free===true) return 'free';
      if(free===false) return 'taken';
    }
    const ok=await loadPeerJS();
    if(!ok || !window.Peer) return 'unknown';
    return new Promise(res=>{
      let done=false, probe=null, tm=null;
      const fin=v=>{ if(done) return; done=true; clearTimeout(tm); try{ probe && probe.destroy(); }catch(e){} res(v); };
      try{ probe = new window.Peer(idOf(u), {debug:0}); }catch(e){ return res('unknown'); }
      probe.on('open', ()=>fin('free'));
      probe.on('error', err=>{
        const t=err&&err.type;
        if(t==='unavailable-id') fin('taken'); else fin('unknown');
      });
      tm=setTimeout(()=>fin('unknown'), 9000);
    });
  },
  async findUser(u){
    u=normUser(u);
    if(!validUser(u)) return {error:'invalid'};
    const id=idOf(u);
    if(S.me && id===S.me.id) return {error:'self'};
    /* у хмарі людина знаходиться, навіть якщо зараз офлайн */
    if(window.H.cloud.on()){
      const prof=await window.H.cloud.lookup(u);
      if(prof===null) return {error:'notfound'};
      if(prof){
        const c=ensureChat(id, prof.name||('@'+u), u);
        c.uid=prof.uid;
        if(prof.name) c.name=prof.name;
        c.bio=prof.bio||'';
        if(prof.avatar!==undefined) c.avatar=prof.avatar||null;
        if(prof.push!==undefined) c.push=prof.push||null;
        if(prof.pub) c.pub=prof.pub;
        if(prof.seen) c.lastSeen=Math.max(c.lastSeen||0, prof.seen);
        save();
        net.addPeer(id, true);
        return {ok:true, chat:c};
      }
      /* хмара мовчить — пробуємо знайти людину напряму */
    }
    const known=S.chats[id];
    if(!peer || peer.destroyed || !peer.open) await net.start();
    if(!peer || !peer.open) return known?{ok:true, chat:known, stale:true}:{error:'nonet'};
    if(conns[id] && conns[id].open && known) return {ok:true, chat:known};
    return new Promise(res=>{
      let done=false, tm=null;
      const fin=r=>{ if(done) return; done=true; clearTimeout(tm); delete lookups[id]; res(r); };
      lookups[id]={
        fail:()=>{ if(conns[id] && !conns[id].open){ try{conns[id].close();}catch(e){} delete conns[id]; }
                   fin(known?{ok:true, chat:known, stale:true}:{error:'notfound'}); },
        found:c=>fin({ok:true, chat:c})
      };
      try{ attach(peer.connect(id,{reliable:true, metadata:{profile:shortProfile()}})); }
      catch(e){ return fin({error:'notfound'}); }
      tm=setTimeout(()=>lookups[id] && lookups[id].fail(), 9000);
    });
  },
  friendRequest(id){
    const c=ensureChat(id);
    if(c.friend) return;
    c.pendingOut=true; c.pendingIn=false; save();
    if(window.H.cloud.on() && c.uid) window.H.cloud.friendRequest(id, c.uid);
    const msg={t:'friend-req', profile:myProfile()};
    const conn=conns[id];
    if(conn && conn.open){ try{ conn.send(msg); }catch(e){ queue(id,msg); } }
    else { queue(id,msg); net.addPeer(id,true); window.H.notify.wake(c,'friend'); }
    window.H.repaintList();
  },
  acceptFriend(id){
    const c=S.chats[id]; if(!c) return;
    c.friend=true; c.pendingIn=false; c.pendingOut=false; save();
    if(window.H.cloud.on()) window.H.cloud.acceptFriend(id);
    const msg={t:'friend-ok', profile:myProfile(), push:myPush(c)};
    const conn=conns[id];
    if(conn && conn.open){ try{ conn.send(msg); }catch(e){ queue(id,msg); } }
    else { queue(id,msg); net.addPeer(id,true); }
    buzz(14); window.H.repaintList();
  },
  declineFriend(id){
    const c=S.chats[id]; if(!c) return;
    const conn=conns[id];
    if(conn && conn.open){ try{ conn.send({t:'friend-no'}); }catch(e){} }
    if(window.H.cloud.on()) window.H.cloud.declineFriend(id);
    delete S.chats[id]; save(); window.H.repaintList();
  },
  shutdown(){
    try{ peer && peer.destroy(); }catch(e){}
    peer=null; idRetry=0;
    Object.keys(conns).forEach(k=>delete conns[k]);
    Object.keys(outbox).forEach(k=>delete outbox[k]);
    if(callUI){ try{ callObj && callObj.close(); }catch(e){} stopLocal(); closeCallUI(true); }
    S.net='off';
  },
  restart(){
    try{ peer && peer.destroy(); }catch(e){}
    peer=null; idRetry=0;
    Object.keys(conns).forEach(k=>delete conns[k]);
    setTimeout(()=>net.start(), 400);
  },
  startCall, hangup, answerCall,
  ringing(){ return !!(callUI && callUI.incoming && !callUI.connected); }
};
window.H.net=net;

function myProfile(){ return {name:S.me.name, username:S.me.username, bio:S.me.bio,
                             avatar:S.me.avatar, id:S.me.id, pub:window.H.e2e.pub()||undefined}; }

/* У метадані зʼєднання кладемо лише імʼя: вони йдуть через
   сигнальний сервер, а аватар — це кілька десятків кілобайтів
   у кожному запиті. Саме через це зʼєднання зривалося одразу
   після зміни фото, і застосунок нескінченно «підключався».
   Повний профіль приходить у hello вже по каналу даних. */
function shortProfile(){ return {name:S.me.name, username:S.me.username, id:S.me.id}; }

/* Куди стукати, щоб розбудити цей пристрій. Віддаємо лише друзям —
   і лише тим, кого самі вважаємо друзями. */
function myPush(chat){
  if(!chat || !chat.friend) return undefined;
  return window.H.notify.card() || undefined;
}
function savePushCard(c, card){
  if(!card || !card.relay || !card.sub || !card.sub.endpoint) return;
  const old=c.push && c.push.sub ? c.push.sub.endpoint : '';
  if(old===card.sub.endpoint && c.push.relay===card.relay) return;
  c.push={relay:String(card.relay), sub:card.sub};
  save();
}
function setNet(v){ S.net=v; const c=current(); if(c&&(c.name==='chats'||c.name==='calls'||c.name==='settings')) refresh(); }

function attach(conn){
  const id=canon(conn.peer);
  conns[id]=conn;
  conn.on('open', ()=>{
    const c=ensureChat(id);
    c.online=true; save();
    try{ conn.send({t:'hello', profile:myProfile(), push:myPush(c)}); }catch(e){}
    flush(id);
    net.sendRead(id);
    window.H.repaintList(); window.H.repaintChat(id);
  });
  conn.on('data', d=>onData(id,d));
  conn.on('close', ()=>{
    const c=S.chats[id]; if(c){ c.online=false; c.typing=false; c.lastSeen=Date.now(); save(); }
    delete conns[id];
    window.H.repaintList(); window.H.repaintChat(id);
  });
  conn.on('error', ()=>{});
}

let typingTimers={};
function onData(id, d){
  if(!d||typeof d!=='object') return;
  const c=ensureChat(id, (d.profile&&d.profile.name)||id);
  if(d.t==='push'){ savePushCard(c, d.push); return; }
  if(d.t==='hello'||d.t==='profile'){
    applyProfile(c, d.profile);
    savePushCard(c, d.push);
    c.online=true; save();
    if(lookups[id]) lookups[id].found(c);
    window.H.repaintList(); window.H.repaintChat(id);
    const cur=current(); if(cur&&(cur.name==='contact'||cur.name==='find')&&cur.params.id===id) refresh();
    return;
  }
  if(d.t==='friend-req'){
    applyProfile(c, d.profile);
    if(c.friend){
      try{ conns[id].send({t:'friend-ok', profile:myProfile(), push:myPush(c)}); }catch(e){}
    } else if(c.pendingOut){
      c.friend=true; c.pendingOut=false;
      try{ conns[id].send({t:'friend-ok', profile:myProfile(), push:myPush(c)}); }catch(e){}
      toast(c.name+' тепер у друзях'); snd.in();
    } else {
      c.pendingIn=true; snd.in(); buzz(18);
      toast('Запит у друзі від '+c.name, 3200);
      window.H.notify.friendRequest(c);
    }
    save(); window.H.repaintList(); window.H.syncTabbar();
    return;
  }
  if(d.t==='friend-ok'){
    applyProfile(c, d.profile);
    savePushCard(c, d.push);
    if(!c.friend){ toast(c.name+' прийняв(ла) ваш запит', 3000); window.H.notify.friendOk(c); }
    c.friend=true; c.pendingOut=false; c.pendingIn=false; save();
    snd.in(); window.H.repaintList();
    const cur=current(); if(cur&&cur.name==='contact'&&cur.params.id===id) refresh();
    return;
  }
  if(d.t==='friend-no'){
    c.pendingOut=false; save();
    toast('Запит у друзі відхилено');
    window.H.repaintList();
    return;
  }
  if(d.t==='typing'){
    c.typing=true; window.H.repaintChat(id); window.H.repaintList();
    clearTimeout(typingTimers[id]);
    typingTimers[id]=setTimeout(()=>{ c.typing=false; window.H.repaintChat(id); window.H.repaintList(); },2600);
    return;
  }
  if(d.t==='ack'){ const m=c.messages.find(x=>x.id===d.id); if(m) setStatus(c,m,'delivered'); return; }
  if(d.t==='read'){
    let ch=false;
    (d.ids||[]).forEach(mid=>{ const m=c.messages.find(x=>x.id===mid&&x.from==='me'); if(m&&m.status!=='read'){ m.status='read'; ch=true; } });
    if(ch){ save(); window.H.repaintChat(id); window.H.repaintList(); }
    return;
  }
  if(d.t==='msg'){
    const src = d.bin ? bytesToDataURL(d.bin, d.mime) : null;
    const m={id:d.m.id||uid(10), from:'them', type:d.m.type||'text', text:d.m.text||'',
      ts:d.m.ts||Date.now(), dur:d.m.dur||0, wave:d.m.wave||null, src, status:'read', seen:S.active===id};
    receive(id, m, false);
    try{ conns[id]&&conns[id].open&&conns[id].send({t:'ack', id:m.id}); }catch(e){}
    return;
  }
  if(d.t==='ring'){ /* handled by peer.on('call') — used only for pre-announce */ return; }
  if(d.t==='callend'){ if(callUI && callUI.peerId===id && !callUI.connected){ endCall('Скасовано', true); } return; }
}

let callUI=null, localStream=null, remoteStream=null, callTimer=null, callT0=0;

function callHTML(st){

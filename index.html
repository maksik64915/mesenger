  eyeOff:`<path d="M9.9 5.2A9.9 9.9 0 0 1 12 5c6.5 0 10.5 7 10.5 7a18 18 0 0 1-3.3 4.2M6.3 6.4A18 18 0 0 0 1.5 12S5.5 19 12 19c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M1 1l22 22"/>`,
  key:`<circle cx="7.5" cy="15.5" r="4"/><path d="m10.5 12.5 8-8"/><path d="m15.5 7.5 2.5 2.5"/><path d="m18.5 4.5 2.5 2.5"/>`,
  upload:`<path d="M12 19V5M5 12l7-7 7 7"/>`,
  bellOff:`<path d="M1 1l22 22"/><path d="M18.5 10c0-.7.5-2 .5-2a6 6 0 0 0-9.2-5.1"/><path d="M6 8v.5c0 6.5-3 7.5-3 7.5h13.5"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>`,
  db:`<ellipse cx="12" cy="5.6" rx="7.5" ry="2.9"/><path d="M4.5 5.6v12.8c0 1.6 3.4 2.9 7.5 2.9s7.5-1.3 7.5-2.9V5.6"/><path d="M4.5 12c0 1.6 3.4 2.9 7.5 2.9s7.5-1.3 7.5-2.9"/>`,
  cloud:`<path d="M17.5 19.5a4.5 4.5 0 0 0 .6-9 6.5 6.5 0 0 0-12.4-1.4A4.2 4.2 0 0 0 6.2 19.5z"/>`,
  switchUser:`<path d="M16 3.1a4 4 0 0 1 0 7.8"/><circle cx="9" cy="7" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><path d="M20 14v6M17 17h6"/>`
};
function ic(name, cls){ return `<svg viewBox="0 0 24 24" ${P} ${cls?`class="${cls}"`:''} aria-hidden="true">${ICONS[name]||''}</svg>`; }

/* ---------- utils ---------- */
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (n=8)=>{ const a='abcdefghijkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep = ms => new Promise(r=>setTimeout(r,ms));

const MONTHS=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const WDAYS=['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];
const pad=n=>String(n).padStart(2,'0');
function hhmm(ts){ const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function isSameDay(a,b){ const x=new Date(a),y=new Date(b); return x.toDateString()===y.toDateString(); }
function dayLabel(ts){
  const now=new Date(), d=new Date(ts);
  if(isSameDay(now,d)) return 'Сьогодні';
  const y=new Date(now); y.setDate(y.getDate()-1);
  if(isSameDay(y,d)) return 'Вчора';
  if(now-d < 6*864e5) return WDAYS[d.getDay()][0].toUpperCase()+WDAYS[d.getDay()].slice(1);
  return d.getDate()+' '+MONTHS[d.getMonth()]+(d.getFullYear()!==now.getFullYear()?' '+d.getFullYear():'');
}
function shortTime(ts){
  if(!ts) return '';
  const now=new Date(), d=new Date(ts);
  if(isSameDay(now,d)) return hhmm(ts);
  const y=new Date(now); y.setDate(y.getDate()-1);
  if(isSameDay(y,d)) return 'вчора';
  if(now-d < 6*864e5) return WDAYS[d.getDay()].slice(0,2);
  return pad(d.getDate())+'.'+pad(d.getMonth()+1);
}
function dur(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60); return m+':'+pad(sec%60); }
function durLong(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return (h?h+':'+pad(m):m)+':'+pad(s); }
function plural(n,a,b,c){ const m=n%100; if(m>=11&&m<=14) return c; const k=n%10; return k===1?a:(k>=2&&k<=4?b:c); }

const GRADS=[['#0E9C8C','#0B6E7F'],['#C25E36','#93381F'],['#4C5FD7','#2E3B96'],['#A63D6E','#6E2247'],
             ['#2F8F4E','#1B6234'],['#B8892B','#8A5F16'],['#3C7FA8','#22536F'],['#7B4CC0','#4E2C87'],
             ['#C0435A','#8A2438'],['#2A9D8F','#1D6F65']];
function hashOf(s){ let h=0; s=String(s||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function gradOf(seed){ return GRADS[hashOf(seed)%GRADS.length]; }
function initials(name){
  const p=String(name||'?').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '?';
  return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();
}
function avatarHTML(person, size, online){
  const s=size||'m';
  const g=gradOf(person.id||person.name);
  const style=person.avatar?'':`background:linear-gradient(145deg,${g[0]},${g[1]})`;
  const inner=person.avatar?`<img src="${esc(person.avatar)}" alt="">`:esc(initials(person.name));
  return `<div class="avwrap"><div class="av ${s}" style="${style}">${inner}</div>${online?'<span class="dot-on"></span>':''}</div>`;
}
const USER_RE=/^[a-z][a-z0-9_]{2,19}$/;
const RESERVED=['admin','support','homin','me','you','root','system','null','undefined','help','info'];
function normUser(v){ return String(v||'').trim().toLowerCase().replace(/^@+/,'').replace(/[^a-z0-9_]/g,''); }
function validUser(v){ return USER_RE.test(v) && RESERVED.indexOf(v)<0; }
function idOf(u){ return 'homin-'+u; }
function userOf(id){ return String(id||'').replace(/^homin-/,''); }

function linkify(t){
  return esc(t).replace(/(https?:\/\/[^\s<]+)/g, u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
}

/* ---------- storage (safe: falls back to memory) ---------- */
const mem = {};
const store = {
  ok:(function(){ try{ const k='__homin'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })(),
  get(k,d){ try{ const v=this.ok?localStorage.getItem(k):mem[k]; return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ const s=JSON.stringify(v); try{ if(this.ok) localStorage.setItem(k,s); else mem[k]=s; }catch(e){ mem[k]=s; return false; } return true; },
  del(k){ try{ if(this.ok) localStorage.removeItem(k); }catch(e){} delete mem[k]; },
  keys(){ try{ return this.ok?Object.keys(localStorage):Object.keys(mem); }catch(e){ return Object.keys(mem); } }
};

/* ---------- state ---------- */
const DEFAULTS = {
  theme:'system', accent:'jade', wall:'dots', fontScale:1,
  enterToSend:true, sounds:true, animations:true, readReceipts:true, autoConnect:true,
  notifications:true, notifPreview:true, pushRelay:''
};
/* Налаштування вигляду належать пристрою, а не акаунту. */
const S = {
  me: null,
  chats: {},
  calls: [],
  cfg: Object.assign({}, DEFAULTS, store.get('homin.cfg', {})),
  active: null,
  net:'off',
  search:'',
  drafts:{},
  playing:null
};

let saveTimer=null;
function save(){
  store.set('homin.cfg', S.cfg);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ if(window.H.auth) window.H.auth.persist(); }, 260);
}
function trimChats(chats, dropMedia){
  const out={};
  for(const id in chats){
    const c=chats[id];
    out[id]=Object.assign({},c,{
      typing:false,
      messages:c.messages.slice(-160).map(m=>{
        const n=Object.assign({},m);
        if(dropMedia && (n.type==='image'||n.type==='voice')) n.src=null;
        return n;
      })
    });
  }
  return out;
}

function chatList(){
  const ids = Object.keys(S.chats);
  ids.sort((a,b)=>{
    const A=S.chats[a],B=S.chats[b];
    if(!!B.pinned - !!A.pinned) return (B.pinned?1:0)-(A.pinned?1:0);
    return (lastTs(B)||0)-(lastTs(A)||0);
  });
  return ids.map(id=>S.chats[id]);
}
function lastTs(c){ const m=c.messages[c.messages.length-1]; return m?m.ts:(c.created||0); }
function lastMsg(c){ return c.messages[c.messages.length-1]; }
function totalUnread(){ return Object.values(S.chats).reduce((n,c)=>n+(c.unread||0),0); }

/* ---------- theme ---------- */
function applyTheme(){
  const r=document.documentElement;
  if(S.cfg.theme==='system') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', S.cfg.theme);
  r.setAttribute('data-accent', S.cfg.accent);
  r.style.setProperty('--fs', S.cfg.fontScale);
  const dark = S.cfg.theme==='dark' || (S.cfg.theme==='system' && matchMedia('(prefers-color-scheme: dark)').matches);
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute('content', dark?'#0A100F':'#E9F0EE');
  if(!S.cfg.animations) r.style.setProperty('--ease','linear');
}

/* ---------- toast ---------- */
function toast(msg, ms, action){
  const wrap=$('#toasts'); if(!wrap) return;
  const t=document.createElement('div');
  t.className='toast'+(action?' has-action':'');
  const span=document.createElement('span'); span.textContent=msg; t.appendChild(span);
  const close=()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),260); };
  if(action){
    const b=document.createElement('button');
    b.className='tact'; b.textContent=action.label;
    b.addEventListener('click',()=>{ close(); action.fn&&action.fn(); });
    t.appendChild(b);
  }
  wrap.appendChild(t);
  setTimeout(close, ms||2100);
  return t;
}

/* ---------- haptics ---------- */
function buzz(p){ try{ if(navigator.vibrate && S.cfg.sounds) navigator.vibrate(p||8); }catch(e){} }

/* ---------- sheets ---------- */
let sheetEl=null, scrimEl=null;
function openSheet(html, onMount){
  closeSheet(true);
  const ov=$('#overlays');
  scrimEl=document.createElement('div'); scrimEl.className='scrim';
  sheetEl=document.createElement('div'); sheetEl.className='sheet';
  sheetEl.innerHTML=`<div class="grab"></div>`+html;
  ov.appendChild(scrimEl); ov.appendChild(sheetEl);
  scrimEl.addEventListener('click', ()=>closeSheet());
  if(onMount) onMount(sheetEl);
  return sheetEl;
}
function closeSheet(instant){
  if(!sheetEl) return;
  const s=sheetEl, c=scrimEl; sheetEl=null; scrimEl=null;
  if(instant){ s.remove(); c&&c.remove(); return; }
  s.classList.add('out'); c&&c.classList.add('out');
  setTimeout(()=>{ s.remove(); c&&c.remove(); }, 280);
}

/* ---------- navigation ---------- */
const SCREENS={};       // name -> {render(params), mount(root,params), tab?}
const stack=[];         // [{name, params, el}]
let busy=false;

function screenEl(name, params){
  const d=document.createElement('section');
  d.className='screen'+(SCREENS[name].tab?' tabroot':'');
  d.dataset.screen=name;
  d.innerHTML=SCREENS[name].render(params||{});
  return d;
}
function mountScreen(entry){
  const m=SCREENS[entry.name].mount;
  if(m) m(entry.el, entry.params||{});
}
function current(){ return stack[stack.length-1]; }

function go(name, params){
  if(busy||!SCREENS[name]) return;
  busy=true;
  const prev=current();
  const el=screenEl(name, params);
  $('#screens').appendChild(el);
  const entry={name, params:params||{}, el};
  stack.push(entry);
  mountScreen(entry);
  if(prev && S.cfg.animations){
    el.classList.add('anim-pushIn'); prev.el.classList.add('anim-pushOut');
    setTimeout(()=>{ el.classList.remove('anim-pushIn'); prev.el.classList.remove('anim-pushOut'); prev.el.hidden=true; busy=false; }, 340);
  } else {
    if(prev) prev.el.hidden=true;
    busy=false;
  }
  syncTabbar();
}
function back(){
  if(busy||stack.length<2) return;
  busy=true;
  const top=stack.pop(); const prev=current();
  prev.el.hidden=false;
  if(S.cfg.animations){
    top.el.classList.add('anim-popOut'); prev.el.classList.add('anim-popIn');
    setTimeout(()=>{ top.el.remove(); prev.el.classList.remove('anim-popIn'); busy=false; onShow(prev); }, 300);
  } else { top.el.remove(); busy=false; onShow(prev); }
  syncTabbar();
}
function onShow(entry){
  const f=SCREENS[entry.name].onShow;
  if(f) f(entry.el, entry.params);
}
function resetTo(name, params){
  stack.splice(0).forEach(e=>e.el.remove());
  go(name, params);
}
function refresh(){
  const c=current(); if(!c) return;
  const old=c.el;
  const prevScroll = old.querySelector('.scroll') ? old.querySelector('.scroll').scrollTop : 0;
  /* replace the element so delegated listeners are not attached twice */
  const el=screenEl(c.name, c.params);
  old.replaceWith(el);
  c.el=el;
  mountScreen(c);
  const sc=el.querySelector('.scroll'); if(sc) sc.scrollTop=prevScroll;
}
function syncTabbar(){
  const c=current();
  const tb=$('#tabbar');
  const isTab = c && SCREENS[c.name].tab;
  tb.hidden = !isTab;
  $$('.tab', tb).forEach(b=>b.classList.toggle('on', isTab && b.dataset.tab===c.name));
  const tz=$('#toasts'); if(tz) tz.classList.toggle('above-tabs', !!isTab);
  const n=totalUnread(), cnt=$('#tabUnread');
  cnt.hidden = n===0; cnt.textContent = n>99?'99+':n;
  if(window.H.notify) window.H.notify.badge();
}
function switchTab(name){
  if(busy) return;
  const c=current();
  if(c && c.name===name){ const sc=c.el.querySelector('.scroll'); if(sc) sc.scrollTo({top:0,behavior:'smooth'}); return; }
  stack.splice(0).forEach(e=>e.el.remove());
  const el=screenEl(name,{});
  $('#screens').appendChild(el);
  const entry={name, params:{}, el};
  stack.push(entry); mountScreen(entry);
  if(S.cfg.animations){ el.classList.add('anim-fade'); setTimeout(()=>el.classList.remove('anim-fade'),240); }
  syncTabbar();
}

/* expose */
window.H = { ic, ICONS, $, $$, esc, uid, clamp, sleep, hhmm, dayLabel, shortTime, dur, durLong, plural,
  isSameDay, avatarHTML, initials, gradOf, hashOf, linkify, store, S, save, chatList, lastMsg, lastTs,
  totalUnread, applyTheme, toast, buzz, openSheet, closeSheet, SCREENS, stack, go, back, refresh,
  normUser, validUser, idOf, userOf, USER_RE, RESERVED,
  switchTab, current, resetTo, syncTabbar, DEFAULTS, trimChats, MONTHS };
})();
</script>
<script>
/* ============================================================
   ГОМІН — база даних (IndexedDB)
   Чати, повідомлення, медіа та журнал дзвінків лежать у
   структурованій базі замість одного великого рядка в
   localStorage: історія більше не обрізається, фото й голосові
   не викидаються, коли скінчиться місце.

   Кожен запис зашифрований тим самим ключем акаунта (AES-GCM,
   похідний від пароля). У відкритому вигляді лишаються тільки
   поля, потрібні для пошуку: акаунт, чат і час.

     profile   акаунт  -> профіль власника
     chats     чат     -> імʼя, аватар, прапорці, лічильник
     messages  повідомлення (індекс by_chat: чат + час)
     media     фото й голосові окремо від тексту
     calls     журнал дзвінків
     kv        дрібниці: підписка на пуш, службові позначки
   ============================================================ */
(function(){
'use strict';
const {S} = window.H;

const NAME='homin', VER=1;
const BOOT_MSGS=150;    // скільки останніх повідомлень чату піднімати на старті
const OPEN_MSGS=800;    // скільки піднімати, коли чат відкривають
const CHUNK=40;         // розмір пачки під час читання медіа й перешифрування
const HI='\uffff';   // верхня межа діапазону ключів

let dbp=null;           // Promise<IDBDatabase>
let dead=false;         // база недоступна — працюємо на localStorage
let acc=null;           // {username, key}

/* що вже лежить у базі — щоб не переписувати незмінне */
const seenChat=new Map();
const seenMsg=new Map();
const seenMedia=new Set();
const seenCall=new Set();
const hydrated=new Set();
let lastMeSig=null;
let saving=false, again=false;

function box(){ return window.H.cryptoBox; }
function supported(){ try{ return !!window.indexedDB; }catch(e){ return false; } }
function active(){ return !dead && !!acc && !!box(); }
function reset(){
  seenChat.clear(); seenMsg.clear(); seenMedia.clear(); seenCall.clear(); hydrated.clear();
  lastMeSig=null;
}

/* ---------- дрібні обгортки над IndexedDB ---------- */
function openDB(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{
    let req;
    try{ req=indexedDB.open(NAME,VER); }catch(e){ rej(e); return; }
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains('profile')) db.createObjectStore('profile',{keyPath:'acc'});
      if(!db.objectStoreNames.contains('chats')) db.createObjectStore('chats',{keyPath:['acc','id']});
      if(!db.objectStoreNames.contains('messages')){
        const s=db.createObjectStore('messages',{keyPath:['acc','mid']});
        s.createIndex('by_chat',['acc','chatId','ts']);
      }
      if(!db.objectStoreNames.contains('media')) db.createObjectStore('media',{keyPath:['acc','mid']});
      if(!db.objectStoreNames.contains('calls')){
        const s=db.createObjectStore('calls',{keyPath:['acc','id']});
        s.createIndex('by_ts',['acc','ts']);
      }
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv',{keyPath:['acc','k']});
    };
    req.onsuccess=()=>{
      const db=req.result;
      db.onversionchange=()=>{ try{ db.close(); }catch(e){} dbp=null; };
      res(db);
    };
    req.onerror=()=>rej(req.error||new Error('idb'));
    req.onblocked=()=>rej(new Error('blocked'));
  }).catch(e=>{ dbp=null; dead=true; throw e; });
  return dbp;
}
function reqP(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function tx(names, mode, fn){
  const db=await openDB();
  return new Promise((res,rej)=>{
    let out, t;
    try{ t=db.transaction(names, mode); }catch(e){ rej(e); return; }
    t.oncomplete=()=>res(out);
    t.onerror=()=>rej(t.error||new Error('tx'));
    t.onabort=()=>rej(t.error||new Error('abort'));
    try{ out=fn(t); }catch(e){ try{ t.abort(); }catch(e2){} rej(e); }
  });
}
const accRange = u => IDBKeyRange.bound([u],[u,HI]);
const chatRange = (u,id) => IDBKeyRange.bound([u,id],[u,id,HI]);

/* ---------- що саме зберігаємо ---------- */
const CHAT_FIELDS=['id','username','name','bio','avatar','unread','created','lastSeen',
                   'pinned','muted','friend','pendingIn','pendingOut','push',
                   'uid','cloudId','cloudTs','pub'];
function chatMeta(c){
  const o={}; CHAT_FIELDS.forEach(k=>{ if(c[k]!==undefined) o[k]=c[k]; });
  return o;
}
function brief(v){
  if(v==null) return '';
  if(typeof v==='object') return JSON.stringify(v).length+'#';
  const s=String(v);
  return s.length>64 ? s.length+':'+s.slice(0,24) : s;
}
function chatSig(c){ return CHAT_FIELDS.map(k=>brief(c[k])).join('|'); }
function msgSig(m){
  return [m.status, m.seen?1:0, m.heard?1:0, m.type, m.ts, (m.text||'').length].join('|');
}
function msgPlain(m){ const o=Object.assign({},m); delete o.src; return o; }

/* ---------- читання ---------- */
function lastMessages(u, chatId, limit){
  return tx(['messages'],'readonly', t=>new Promise(res=>{
    const out=[];
    const cur=t.objectStore('messages').index('by_chat').openCursor(chatRange(u,chatId),'prev');
    cur.onsuccess=()=>{
      const k=cur.result;
      if(!k || out.length>=limit){ res(out.reverse()); return; }
      out.push(k.value); k.continue();
    };
    cur.onerror=()=>res(out.reverse());
  }));
}
async function decode(recs, skip){
  const out=[];
  for(const r of recs){
    if(skip && skip.has(r.mid)) continue;
    try{
      const m=JSON.parse(await box().open(acc.key, r.blob));
      m.src=null;
      seenMsg.set(m.id, msgSig(m));
      out.push(m);
    }catch(e){}
  }
  return out;
}
async function loadMediaFor(c){
  const u=acc.username;
  const want=c.messages.filter(m=>!m.src && (m.type==='image'||m.type==='voice')).map(m=>m.id);
  for(let i=0;i<want.length;i+=CHUNK){
    const slice=want.slice(i,i+CHUNK);
    const recs=await tx(['media'],'readonly', t=>{
      const s=t.objectStore('media');
      return Promise.all(slice.map(mid=>reqP(s.get([u,mid]))));
    });
    for(const r of recs){
      if(!r) continue;
      try{
        const src=await box().open(acc.key, r.blob);
        const m=c.messages.find(x=>x.id===r.mid);
        if(m && src) m.src=src;
        seenMedia.add(r.mid);
      }catch(e){}
    }
  }
}

/* Профіль, чати, журнал дзвінків і хвіст кожної розмови.
   Медіа лишається на диску, доки чат не відкриють. */
async function loadAccount(username, key){
  if(!supported() || dead) return null;
  acc={username, key}; reset();
  try{
    const [prof, chatRecs, callRecs] = await tx(['profile','chats','calls'],'readonly', t=>Promise.all([
      reqP(t.objectStore('profile').get(username)),
      reqP(t.objectStore('chats').getAll(accRange(username))),
      reqP(t.objectStore('calls').getAll(accRange(username)))
    ]));
    if(!prof) return null;
    const me=JSON.parse(await box().open(key, prof.blob));
    lastMeSig=JSON.stringify(me);

    const chats={};
    for(const r of chatRecs){
      try{
        const c=JSON.parse(await box().open(key, r.blob));
        if(!c || !c.id) continue;
        c.messages=[]; c.typing=false; c.online=false;
        chats[c.id]=c; seenChat.set(c.id, chatSig(c));
      }catch(e){}
    }
    const calls=[];
    for(const r of callRecs){
      try{ const v=JSON.parse(await box().open(key, r.blob)); calls.push(v); seenCall.add(v.id); }catch(e){}
    }
    calls.sort((a,b)=>(b.ts||0)-(a.ts||0));

    for(const id in chats) chats[id].messages = await decode(await lastMessages(username, id, BOOT_MSGS));
    return {me, chats, calls};
  }catch(e){ dead=true; acc=null; return null; }
}

/* Повна історія чату разом з медіа — коли його відкривають. */
async function hydrate(chatId){
  if(!active()) return false;
  const c=S.chats[chatId];
  if(!c) return false;
  try{
    if(!hydrated.has(chatId)){
      const have=new Set(c.messages.map(m=>m.id));
      const older=await decode(await lastMessages(acc.username, chatId, OPEN_MSGS), have);
      if(older.length){
        c.messages=older.concat(c.messages).sort((a,b)=>(a.ts||0)-(b.ts||0));
      }
    }
    await loadMediaFor(c);
    hydrated.add(chatId);
    return true;
  }catch(e){ return false; }
}
function isHydrated(id){ return hydrated.has(id); }

/* Медіа інших чатів звільняє памʼять — на диску воно лишається. */
function evict(keepId){
  for(const id in S.chats){
    if(id===keepId) continue;
    const c=S.chats[id];
    let n=0;
    for(const m of c.messages){ if(m.src && seenMedia.has(m.id)){ m.src=null; n++; } }
    if(n) hydrated.delete(id);
  }
}

/* ---------- запис ---------- */
async function saveState(){
  if(!active()) return false;
  if(saving){ again=true; return true; }
  saving=true;
  try{
    const u=acc.username, key=acc.key;
    const profile=[], chats=[], messages=[], media=[], calls=[], gone=[];

    if(S.me){
      const sig=JSON.stringify(S.me);
      if(sig!==lastMeSig){ profile.push({acc:u, blob:await box().seal(key, sig)}); lastMeSig=sig; }
    }
    const live=new Set();
    for(const id in S.chats){
      const c=S.chats[id]; live.add(id);
      const sig=chatSig(c);
      if(seenChat.get(id)!==sig){
        chats.push({acc:u, id, ts:window.H.lastTs(c)||c.created||0,
                    blob:await box().seal(key, JSON.stringify(chatMeta(c)))});
        seenChat.set(id, sig);
      }
      for(const m of c.messages){
        const sg=msgSig(m);
        if(seenMsg.get(m.id)!==sg){
          messages.push({acc:u, mid:m.id, chatId:id, ts:m.ts||0,
                         blob:await box().seal(key, JSON.stringify(msgPlain(m)))});
          seenMsg.set(m.id, sg);
        }
        if(m.src && !seenMedia.has(m.id)){
          media.push({acc:u, mid:m.id, blob:await box().seal(key, m.src)});
          seenMedia.add(m.id);
        }
      }
    }
    seenChat.forEach((_,id)=>{ if(!live.has(id)) gone.push(id); });
    for(const cl of (S.calls||[])){
      if(seenCall.has(cl.id)) continue;
      calls.push({acc:u, id:cl.id, ts:cl.ts||0, blob:await box().seal(key, JSON.stringify(cl))});
      seenCall.add(cl.id);
    }

    if(profile.length||chats.length||messages.length||media.length||calls.length||gone.length){
      await tx(['profile','chats','messages','media','calls'],'readwrite', t=>{
        profile.forEach(r=>t.objectStore('profile').put(r));
        chats.forEach(r=>t.objectStore('chats').put(r));
        messages.forEach(r=>t.objectStore('messages').put(r));
        media.forEach(r=>t.objectStore('media').put(r));
        calls.forEach(r=>t.objectStore('calls').put(r));
        gone.forEach(id=>{
          seenChat.delete(id); hydrated.delete(id);
          t.objectStore('chats').delete([u,id]);
          const cur=t.objectStore('messages').index('by_chat').openCursor(chatRange(u,id));
          cur.onsuccess=()=>{
            const k=cur.result; if(!k) return;
            t.objectStore('media').delete([u,k.value.mid]);
            seenMsg.delete(k.value.mid); seenMedia.delete(k.value.mid);
            k.delete(); k.continue();
          };
        });
      });
    }
    return true;
  }catch(e){
    dead=true; return false;
  }finally{
    saving=false;
    if(again){ again=false; setTimeout(()=>saveState(), 0); }
  }
}

/* Перенесення зі старого сховища: один зашифрований рядок -> база. */
async function importAll(username, key, data){
  if(!supported() || dead) return false;
  acc={username, key}; reset();
  try{
    const u=username;
    const rows={profile:[], chats:[], messages:[], media:[], calls:[]};
    rows.profile.push({acc:u, blob:await box().seal(key, JSON.stringify(data.me))});
    lastMeSig=JSON.stringify(data.me);
    const chats=data.chats||{};
    for(const id in chats){
      const c=chats[id];
      if(!c || !c.id) continue;
      rows.chats.push({acc:u, id, ts:window.H.lastTs(c)||c.created||0,
                       blob:await box().seal(key, JSON.stringify(chatMeta(c)))});
      seenChat.set(id, chatSig(c));
      for(const m of (c.messages||[])){
        rows.messages.push({acc:u, mid:m.id, chatId:id, ts:m.ts||0,
                            blob:await box().seal(key, JSON.stringify(msgPlain(m)))});
        seenMsg.set(m.id, msgSig(m));
        if(m.src){ rows.media.push({acc:u, mid:m.id, blob:await box().seal(key, m.src)}); seenMedia.add(m.id); }
      }
    }
    for(const cl of (data.calls||[])){
      rows.calls.push({acc:u, id:cl.id, ts:cl.ts||0, blob:await box().seal(key, JSON.stringify(cl))});
      seenCall.add(cl.id);
    }
    const names=['profile','chats','messages','media','calls'];
    for(const n of names){
      const list=rows[n];
      for(let i=0;i<list.length;i+=CHUNK){
        const part=list.slice(i,i+CHUNK);
        await tx([n],'readwrite', t=>{ const s=t.objectStore(n); part.forEach(r=>s.put(r)); });
      }
    }
    await kvSet('imported', Date.now());
    return true;
  }catch(e){ dead=true; return false; }
}

async function hasAccount(username){
  if(!supported() || dead) return false;
  try{ return !!(await tx(['profile'],'readonly', t=>reqP(t.objectStore('profile').get(username)))); }
  catch(e){ return false; }
}

async function clearMessages(chatId){
  if(!active()) return;
  const u=acc.username;
  try{
    await tx(['messages','media'],'readwrite', t=>{
      const cur=t.objectStore('messages').index('by_chat').openCursor(chatRange(u,chatId));
      cur.onsuccess=()=>{
        const k=cur.result; if(!k) return;
        t.objectStore('media').delete([u,k.value.mid]);
        seenMsg.delete(k.value.mid); seenMedia.delete(k.value.mid);
        k.delete(); k.continue();
      };
    });
    hydrated.delete(chatId);
  }catch(e){}
}

async function clearCalls(){
  if(!active()) return;
  try{
    await tx(['calls'],'readwrite', t=>t.objectStore('calls').delete(accRange(acc.username)));
    seenCall.clear();
  }catch(e){}
}

async function dropAccount(username){
  if(!supported() || dead) return;
  try{
    await tx(['profile','chats','messages','media','calls','kv'],'readwrite', t=>{
      t.objectStore('profile').delete(username);
      ['chats','messages','media','calls','kv'].forEach(n=>t.objectStore(n).delete(accRange(username)));
    });
  }catch(e){}
  if(acc && acc.username===username){ acc=null; reset(); }
}

/* Пароль змінився — переписуємо всі записи новим ключем. */
async function rekey(newKey){
  if(!active()) return false;
  const u=acc.username, oldKey=acc.key;
  try{
    for(const name of ['profile','chats','messages','media','calls','kv']){
      const rng = name==='profile' ? IDBKeyRange.only(u) : accRange(u);
      const keys=await tx([name],'readonly', t=>reqP(t.objectStore(name).getAllKeys(rng)));
      for(let i=0;i<keys.length;i+=CHUNK){
        const part=keys.slice(i,i+CHUNK);
        const recs=await tx([name],'readonly', t=>{
          const s=t.objectStore(name);
          return Promise.all(part.map(k=>reqP(s.get(k))));
        });
        const out=[];
        for(const r of recs){
          if(!r || !r.blob) continue;
          const text=await box().open(oldKey, r.blob);
          r.blob=await box().seal(newKey, text);
          out.push(r);
        }
        if(out.length) await tx([name],'readwrite', t=>{ const s=t.objectStore(name); out.forEach(r=>s.put(r)); });
      }
    }
    acc.key=newKey;
    return true;
  }catch(e){ return false; }
}

/* ---------- дрібні значення ---------- */
async function kvSet(k, v){
  if(!active()) return false;
  try{
    await tx(['kv'],'readwrite', t=>t.objectStore('kv').put(
      {acc:acc.username, k, blob:null, v:JSON.stringify(v)}));
    return true;
  }catch(e){ return false; }
}
async function kvGet(k, d){
  if(!active()) return d;
  try{
    const r=await tx(['kv'],'readonly', t=>reqP(t.objectStore('kv').get([acc.username,k])));
    return r && r.v!=null ? JSON.parse(r.v) : d;
  }catch(e){ return d; }
}

/* Пошук по всьому листуванню. У памʼяті лежать тільки хвости
   розмов, тож шукати треба в базі: читаємо записи, розшифровуємо
   й порівнюємо. */
const SCAN_MAX=8000;
async function searchMessages(q, limit){
  const needle=String(q||'').trim().toLowerCase();
  if(!active() || needle.length<2) return [];
  const u=acc.username, out=[];
  try{
    const recs=await tx(['messages'],'readonly', t=>new Promise(res=>{
      const list=[];
      const cur=t.objectStore('messages').openCursor(accRange(u));
      cur.onsuccess=()=>{
        const k=cur.result;
        if(!k || list.length>=SCAN_MAX){ res(list); return; }
        if(S.chats[k.value.chatId]) list.push(k.value);
        k.continue();
      };
      cur.onerror=()=>res(list);
    }));
    for(const r of recs){
      if(out.length>=(limit||60)) break;
      try{
        const m=JSON.parse(await box().open(acc.key, r.blob));
        if(m.type==='text' && m.text && m.text.toLowerCase().indexOf(needle)>=0)
          out.push({chatId:r.chatId, m});
      }catch(e){}
    }
    out.sort((a,b)=>(b.m.ts||0)-(a.m.ts||0));
  }catch(e){}
  return out;
}

/* Те саме, але зашифроване ключем акаунта — для таємниць
   на кшталт приватного ключа шифрування. */
async function secretSet(k, v){
  if(!active()) return false;
  try{
    const blob=await box().seal(acc.key, JSON.stringify(v));
    await tx(['kv'],'readwrite', t=>t.objectStore('kv').put({acc:acc.username, k, blob, v:null}));
    return true;
  }catch(e){ return false; }
}
async function secretGet(k, d){
  if(!active()) return d;
  try{
    const r=await tx(['kv'],'readonly', t=>reqP(t.objectStore('kv').get([acc.username,k])));
    if(!r || !r.blob) return d;
    const text=await box().open(acc.key, r.blob);
    return text ? JSON.parse(text) : d;
  }catch(e){ return d; }
}

/* ---------- скільки місця займають дані ---------- */
async function stats(){
  const out={ok:false, chats:0, messages:0, media:0, calls:0, usage:0, quota:0, persisted:false};
  try{
    if(navigator.storage){
      if(navigator.storage.estimate){
        const e=await navigator.storage.estimate();
        out.usage=e.usage||0; out.quota=e.quota||0;
      }
      if(navigator.storage.persisted) out.persisted=await navigator.storage.persisted();
    }
  }catch(e){}
  if(!active()) return out;
  try{
    const u=acc.username;
    const [c,m,md,cl]=await tx(['chats','messages','media','calls'],'readonly', t=>Promise.all([
      reqP(t.objectStore('chats').count(accRange(u))),
      reqP(t.objectStore('messages').count(accRange(u))),
      reqP(t.objectStore('media').count(accRange(u))),
      reqP(t.objectStore('calls').count(accRange(u)))
    ]));
    out.chats=c; out.messages=m; out.media=md; out.calls=cl; out.ok=true;
  }catch(e){}
  return out;
}
/* Проситься не бути витертою, коли на пристрої закінчується місце. */
async function persistent(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return false;
    if(navigator.storage.persisted && await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  }catch(e){ return false; }
}

function close(){ acc=null; reset(); }

window.H.db = {
  supported, active, dead:()=>dead,
  loadAccount, importAll, hasAccount, saveState,
  hydrate, isHydrated, evict, clearMessages, clearCalls, dropAccount, rekey,
  kvGet, kvSet, secretGet, secretSet, searchMessages, stats, persistent, close,
  account:()=>acc&&acc.username
};
})();
</script>
<script>
/* ============================================================
   ГОМІН — акаунти: реєстрація, вхід, пароль, ключ переносу
   Дані акаунта шифруються AES-GCM ключем, похідним від пароля
   (PBKDF2, 150 000 ітерацій). Пароль ніде не зберігається.
   ============================================================ */
(function(){
'use strict';
const {S, store, save, trimChats, DEFAULTS, uid, userOf} = window.H;

const ACCOUNTS='homin.accounts', SESSION='homin.session';
const dataKey = u => 'homin.acc.'+u;
const rememberKey = u => 'homin.keep.'+u;

const TE=new TextEncoder(), TD=new TextDecoder();
const subtle = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;

function b64(buf){
  const a = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let s=''; for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null, a.subarray(i,i+0x8000));
  return btoa(s);
}
function unb64(s){
  const bin=atob(s), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}
function randomBytes(n){
  const a=new Uint8Array(n);
  if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else for(let i=0;i<n;i++) a[i]=Math.floor(Math.random()*256);
  return a;
}

/* Запасний варіант, якщо WebCrypto недоступний (дуже рідко).
   Слабший за PBKDF2, але вхід усе одно працює. */
function weakBits(password, saltB64){
  const src=password+'|'+saltB64;
  const out=new Uint8Array(64);
  let h1=0x811c9dc5, h2=0x01000193;
  for(let round=0; round<4096; round++){
    for(let i=0;i<src.length;i++){
      h1=(h1^src.charCodeAt(i))>>>0; h1=Math.imul(h1,16777619)>>>0;
      h2=(h2+((h1^round)>>>0))>>>0; h2=Math.imul(h2,2246822519)>>>0;
    }
    out[round%64]=(out[round%64]^(h1&255)^(h2>>>8&255))&255;
  }
  return out;
}
async function deriveBits(password, saltB64){
  if(!subtle) return weakBits(password, saltB64);
  const base=await subtle.importKey('raw', TE.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits=await subtle.deriveBits(
    {name:'PBKDF2', salt:unb64(saltB64), iterations:150000, hash:'SHA-256'}, base, 512);
  return new Uint8Array(bits);
}
async function keyFromBits(bits){
  if(!subtle) return null;
  return subtle.importKey('raw', bits.slice(0,32), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
}
async function verifierOf(bits){
  const tail=bits.slice(32,64);
  if(!subtle) return b64(tail);
  return b64(await subtle.digest('SHA-256', tail));
}
async function seal(key, text){
  if(!key) return {v:0, plain:text};
  const iv=randomBytes(12);
  const ct=await subtle.encrypt({name:'AES-GCM', iv}, key, TE.encode(text));
  return {v:1, iv:b64(iv), ct:b64(ct)};
}
async function open_(key, blob){
  if(!blob) return null;
  if(blob.v===0 || blob.plain!=null) return blob.plain;
  if(!key) throw new Error('no-key');
  const pt=await subtle.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, key, unb64(blob.ct));
  return TD.decode(pt);
}

/* ---------- session ---------- */
let sess = null;   // {username, bits, key}

function accounts(){ return store.get(ACCOUNTS, []) || []; }
function saveAccounts(list){ store.set(ACCOUNTS, list); }
function findAcc(u){ return accounts().find(a=>a.username===u) || null; }
function upsertAcc(rec){
  const list=accounts().filter(a=>a.username!==rec.username);
  list.unshift(rec); saveAccounts(list);
}

function applyData(data){
  S.me = data.me || null;
  S.chats = data.chats || {};
  S.calls = data.calls || [];
  Object.keys(S.chats).forEach(id=>{
    const c=S.chats[id];
    if(c.demo){ delete S.chats[id]; return; }
    if(!c.username) c.username=userOf(id);
    c.typing=false; c.online=false;
  });
}
function currentData(dropMedia){
  return { me:S.me, chats:trimChats(S.chats, !!dropMedia), calls:S.calls.slice(0,120) };
}

function syncAccRec(){
  const rec=findAcc(sess.username);
  if(rec && S.me && (rec.name!==S.me.name || rec.avatar!==S.me.avatar)){
    rec.name=S.me.name; rec.avatar=S.me.avatar; upsertAcc(rec);
  }
}

/* Основне сховище — база даних; localStorage лишається запасним
   варіантом там, де IndexedDB недоступна (приватні вікна тощо). */
async function persist(){
  if(!sess || !S.me) return;
  const db=window.H.db;
  if(db.active() && await db.saveState()){ syncAccRec(); return; }
  const key=sess.key;
  let blob=await seal(key, JSON.stringify(currentData(false)));
  if(!store.set(dataKey(sess.username), blob)){
    blob=await seal(key, JSON.stringify(currentData(true)));
    store.set(dataKey(sess.username), blob);
  }
  syncAccRec();
}

/* Дані акаунта: спершу база, потім — старий зашифрований рядок,
   який одразу переносимо в базу й прибираємо з localStorage. */
async function loadData(username, key){
  const db=window.H.db;
  if(db.supported() && !db.dead()){
    const fromDb=await db.loadAccount(username, key);
    if(fromDb) return fromDb;
  }
  const blob=store.get(dataKey(username), null);
  const text=await open_(key, blob);
  const data=text?JSON.parse(text):{};
  if(data && data.me && db.supported() && !db.dead()){
    if(await db.importAll(username, key, data)) store.del(dataKey(username));
  }
  return data;
}

/* Новий акаунт (реєстрація, ключ переносу, перенос зі старої версії). */
async function initDb(){
  const db=window.H.db;
  if(!sess || !db.supported() || db.dead()) return false;
  return db.importAll(sess.username, sess.key, currentData(false));
}

async function startSession(username, bits, remember){
  sess={username, bits, key:await keyFromBits(bits)};
  store.set(SESSION, username);
  if(remember) store.set(rememberKey(username), b64(bits));
  else store.del(rememberKey(username));
}

const auth = {
  hasAccounts(){ return accounts().length>0; },
  accounts,
  username(){ return sess ? sess.username : null; },
  remembered(){ return sess ? !!store.get(rememberKey(sess.username), null) : false; },
  persist,

  /* ---- реєстрація ---- */
  async signup(o){
    let cloud='off';
    if(window.H.cloud.configured()){
      if(o.remember!==false) await window.H.cloud.rememberLogin(o.username, o.password);
      cloud=await window.H.cloud.signUp(o.username, o.password,
        {name:o.name, bio:o.bio||'', avatar:o.avatar||null});
      if(cloud==='taken') return 'taken';
    }
    const salt=b64(randomBytes(16));
    const bits=await deriveBits(o.password, salt);
    const verifier=await verifierOf(bits);
    const rec={username:o.username, name:o.name, avatar:o.avatar||null, salt, verifier, created:Date.now()};
    upsertAcc(rec);
    S.me={ id:'homin-'+o.username, username:o.username, name:o.name,
           email:o.email||'', bio:o.bio||'В мережі через Гомін', avatar:o.avatar||null };
    S.chats={}; S.calls=[];
    if(cloud==='ok') S.me.uid=window.H.cloud.uid();
    await startSession(o.username, bits, o.remember!==false);
    await initDb();
    /* Ключі шифрування зберігаються вже після створення бази —
       інакше локальна копія нікуди не лягає, і після перезапуску
       листування виявилося б без шифрування. */
    if(window.H.e2e.ready()) await window.H.e2e.rewrap(o.password);
    else await window.H.e2e.create(o.password);
    await persist();
    if(cloud==='ok') window.H.cloud.start();
    else if(cloud!=='off') return 'cloud:'+cloud;
    return true;
  },

  /* ---- акаунт із хмари на новому пристрої ---- */
  async adoptCloud(username, password, profile, remember){
    const salt=b64(randomBytes(16));
    /* ключі вже відкрито під час входу в хмару — лишається
       покласти їх у нову локальну базу */
    const bits=await deriveBits(password, salt);
    upsertAcc({username, name:profile.name||username, avatar:profile.avatar||null,
               salt, verifier:await verifierOf(bits), created:Date.now()});
    S.me={ id:'homin-'+username, username, name:profile.name||username, email:'',
           bio:profile.bio||'', avatar:profile.avatar||null, uid:profile.uid||null };
    S.chats={}; S.calls=[];
    await startSession(username, bits, remember!==false);
    if(remember!==false) await window.H.cloud.rememberLogin(username, password);
    await initDb();
    if(window.H.e2e.ready()) await window.H.e2e.rewrap(password);
    await persist();
    window.H.cloud.start();
    return 'ok';
  },

  /* ---- вхід ---- */
  async unlock(username, password, remember){
    const rec=findAcc(username);
    if(!rec) return 'no-account';
    const bits=await deriveBits(password, rec.salt);
    const verifier=await verifierOf(bits);
    if(verifier!==rec.verifier) return 'wrong-password';
    const key=await keyFromBits(bits);
    let data={};
    try{ data=await loadData(username, key) || {}; }
    catch(e){ return 'corrupt'; }
    if(!data.me) data.me={ id:'homin-'+username, username, name:rec.name||username, email:'', bio:'', avatar:rec.avatar||null };
    applyData(data);
    await startSession(username, bits, !!remember);
    /* Хмара підхоплюється сама: якщо акаунта там ще немає —
       він створюється тим самим паролем. Нічого вводити не треба. */
    if(window.H.cloud.configured()){
      /* Запамʼятовуємо похідну від пароля одразу: якщо хмара
         зараз не відповість, застосунок доробить усе сам пізніше,
         не питаючи людину вдруге. */
      if(remember) await window.H.cloud.rememberLogin(username, password);
      const r=await window.H.cloud.linkAccount(username, password,
        {name:S.me.name, bio:S.me.bio, avatar:S.me.avatar});
      if(r==='ok'){ S.me.uid=window.H.cloud.uid(); window.H.cloud.start(); }
      else await window.H.e2e.unlock(password, null);
    } else {
      await window.H.e2e.unlock(password, null);
    }
    persist();
    return 'ok';
  },

  /* ---- автоматичний вхід, якщо просили запамʼятати ---- */
  async resume(){
    const u=store.get(SESSION, null);
    if(!u || !findAcc(u)) return false;
    const kept=store.get(rememberKey(u), null);
    if(!kept) return false;
    try{
      const bits=unb64(kept);
      const key=await keyFromBits(bits);
      sess={username:u, bits, key};
      const data=await loadData(u, key);
      if(!data || !data.me){ sess=null; return false; }
      applyData(data);
      await window.H.e2e.resume();
      if(window.H.cloud.configured()){
        const cl=window.H.cloud;
        cl.init().then(async ok=>{
          if(!ok) return;
          await cl.waitAuth();
          const r=await cl.ensure(u);
          if(r==='ok'){ S.me.uid=cl.uid(); persist(); }
          else if(r==='need-password' && window.H.cloudNeedsLink) window.H.cloudNeedsLink();
        });
      }
      return true;
    }catch(e){ return false; }
  },

  logout(){
    const who=sess?sess.username:store.get(SESSION,null);
    if(who) window.H.cloud.forgetLogin(who);
    window.H.e2e.lock();
    window.H.cloud.signOutCloud();
    window.H.db.close();
    const u=sess?sess.username:store.get(SESSION,null);
    if(u) store.del(rememberKey(u));
    store.del(SESSION);
    sess=null;
    S.me=null; S.chats={}; S.calls=[]; S.active=null; S.drafts={};
  },

  async changePassword(oldPass, newPass){
    if(!sess) return 'no-session';
    const rec=findAcc(sess.username);
    const oldBits=await deriveBits(oldPass, rec.salt);
    if(await verifierOf(oldBits) !== rec.verifier) return 'wrong-password';
    const salt=b64(randomBytes(16));
    const bits=await deriveBits(newPass, salt);
    const newKey=await keyFromBits(bits);
    /* уся база перешифровується новим ключем — інакше старі записи
       вже не відкриються */
    if(window.H.db.active() && !await window.H.db.rekey(newKey)) return 'failed';
    if(window.H.cloud.on()){
      await window.H.cloud.changePassword(sess.username, newPass);
      if(store.get(rememberKey(sess.username), null)) await window.H.cloud.rememberLogin(sess.username, newPass);
    }
    else await window.H.e2e.rewrap(newPass);
    rec.salt=salt; rec.verifier=await verifierOf(bits);
    upsertAcc(rec);
    sess.bits=bits; sess.key=newKey;
    if(store.get(rememberKey(sess.username), null)) store.set(rememberKey(sess.username), b64(bits));
    await persist();
    return 'ok';
  },

  removeAccount(username){
    window.H.cloud.forgetLogin(username);
    window.H.db.dropAccount(username);
    saveAccounts(accounts().filter(a=>a.username!==username));
    store.del(dataKey(username));
    store.del(rememberKey(username));
    if(store.get(SESSION,null)===username) store.del(SESSION);
    if(sess && sess.username===username){ sess=null; S.me=null; S.chats={}; S.calls=[]; }
  },

  /* ---- ключ переносу на інший пристрій ---- */
  async exportKey(){
    if(!sess) return null;
    const rec=findAcc(sess.username);
    const payload={ me:S.me, chats:trimChats(S.chats, true), calls:S.calls.slice(0,60) };
    const blob=await seal(sess.key, JSON.stringify(payload));
    if(!sess.key){
      return 'HOMIN1.'+btoa(unescape(encodeURIComponent(JSON.stringify(
        {u:sess.username, salt:rec.salt, plain:payload}))));
    }
    const outer={u:sess.username, salt:rec.salt, iv:blob.iv, ct:blob.ct};
    return 'HOMIN1.'+btoa(unescape(encodeURIComponent(JSON.stringify(outer))));
  },

  async importKey(text, password, remember){
    text=String(text||'').trim().replace(/\s+/g,'');
    if(text.indexOf('HOMIN1.')!==0) return 'bad-format';
    let outer;
    try{ outer=JSON.parse(decodeURIComponent(escape(atob(text.slice(7))))); }
    catch(e){ return 'bad-format'; }
    if(!outer || !outer.u || !outer.salt) return 'bad-format';
    const bits=await deriveBits(password, outer.salt);
    const key=await keyFromBits(bits);
    let data;
    if(outer.plain){ data=outer.plain; }
    else {
      try{ data=JSON.parse(await open_(key, {v:1, iv:outer.iv, ct:outer.ct})); }
      catch(e){ return 'wrong-password'; }
    }
    if(!data || !data.me) return 'bad-format';
    const rec={ username:outer.u, name:data.me.name, avatar:data.me.avatar||null,
                salt:outer.salt, verifier:await verifierOf(bits), created:Date.now() };
    upsertAcc(rec);
    applyData(data);
    await startSession(outer.u, bits, remember!==false);
    await initDb();
    await persist();
    return 'ok';
  },

  /* ---- перенесення профілю зі старих версій (без пароля) ---- */
  legacy(){
    const me=store.get('homin.me', null);
    if(!me || !me.name) return null;
    return { me, chats:store.get('homin.chats', {})||{}, calls:store.get('homin.calls', [])||[] };
  },
  async adoptLegacy(password, remember){
    const old=auth.legacy(); if(!old) return 'none';
    const username=old.me.username || userOf(old.me.id||'') || ('user'+uid(4));
    const salt=b64(randomBytes(16));
    const bits=await deriveBits(password, salt);
    upsertAcc({username, name:old.me.name, avatar:old.me.avatar||null,
               salt, verifier:await verifierOf(bits), created:Date.now()});
    old.me.username=username; old.me.id='homin-'+username;
    if(!old.me.email) old.me.email='';
    applyData(old);
    await startSession(username, bits, remember!==false);
    await initDb();
    await persist();
    store.del('homin.me'); store.del('homin.chats'); store.del('homin.calls'); store.del('homin.order');
    return 'ok';
  }
};

/* база даних шифрує свої записи тим самим ключем акаунта */
window.H.cryptoBox = { seal, open:open_, b64, unb64, randomBytes };
window.H.auth = auth;
})();

<script>
/* ============================================================
   ГОМІН — екрани: онбординг, чати, дзвінки, налаштування, профілі

(function(){
'use strict';
const {ic,$,$$,esc,uid,S,save,chatList,lastMsg,avatarHTML,shortTime,dur,durLong,plural,
       toast,buzz,openSheet,closeSheet,SCREENS,go,back,refresh,switchTab,current,applyTheme,

       normUser,validUser,idOf,userOf} = window.H;

/* ---------- username field (shared by onboarding & profile) ---------- */
function unameField(id, value, statusId){
  return `<div class="uwrap" id="${id}wrap"><span class="at">@</span>
    <input id="${id}" value="${esc(value||'')}" maxlength="20" autocomplete="off"
      autocapitalize="off" spellcheck="false" placeholder="ваш_юзернейм"></div>
    <div class="ustat" id="${statusId}"></div>`;
}
function statusHTML(state, u){
  if(state==='checking') return `<span class="spin"></span> Перевіряємо @${esc(u)}…`;
  if(state==='free') return `${ic('check')} @${esc(u)} вільний — він буде вашим`;
  if(state==='taken') return `${ic('x')} @${esc(u)} уже зайнятий, оберіть інший`;
  if(state==='unknown') return `${ic('info')} Не вдалося перевірити — немає зʼєднання`;
  if(state==='invalid') return `3–20 символів: латиниця, цифри та _, починається з літери`;
  return `3–20 символів: латиниця, цифри та _, починається з літери`;
}
function statusClass(state){ return state==='free'?'ok':(state==='taken'||state==='invalid')?'bad':''; }

/* live username checker bound to an input */
function bindUsername(root, inputId, statusId, onState, initial){
  const inp=$('#'+inputId, root), st=$('#'+statusId, root), wrap=$('#'+inputId+'wrap', root);
  let state = initial || 'idle', timer=null, seq=0;
  const paint=()=>{ st.className='ustat '+statusClass(state); st.innerHTML=statusHTML(state, normUser(inp.value));
    wrap.className='uwrap '+statusClass(state); if(onState) onState(state, normUser(inp.value)); };
  const run=()=>{
    const u=normUser(inp.value); const my=++seq;
    if(!validUser(u)){ state = u.length?'invalid':'idle'; paint(); return; }
    state='checking'; paint();
    window.H.net.checkUsername(u).then(r=>{ if(my!==seq) return; state=r; paint(); });
  };
  inp.addEventListener('input', ()=>{
    const n=normUser(inp.value);
    if(inp.value!==n){ const p=inp.selectionStart; inp.value=n; try{inp.setSelectionRange(p,p);}catch(e){} }
    clearTimeout(timer); state='idle'; paint();
    timer=setTimeout(run, 650);
  });
  paint();
  return { get state(){ return state; }, value:()=>normUser(inp.value), check:run };
}

/* ---------- shared bits ---------- */
function tick(status){
  if(status==='sending') return `<span class="tick">${ic('clock')}</span>`;
  if(status==='sent') return `<span class="tick">${ic('check')}</span>`;
  if(status==='delivered') return `<span class="tick">${ic('checks')}</span>`;
  if(status==='read') return `<span class="tick read">${ic('checks')}</span>`;
  return '';
}
window.H.tick = tick;

function previewOf(c){
  if(c.typing) return `<span class="pv" style="color:var(--accent);font-weight:600">друкує…</span>`;
  const m=lastMsg(c);
  if(!m) return `<span class="pv" style="color:var(--faint)">Немає повідомлень</span>`;
  const mine = m.from==='me';
  const t = (mine && m.type!=='call') ? `<span class="tick ${m.status==='read'?'read':''}">${
      m.status==='read'||m.status==='delivered'?ic('checks'):m.status==='sent'?ic('check'):ic('clock')}</span>` : '';
  let body;
  if(m.type==='image') body = ic('image')+' '+(m.text?esc(m.text):'Фото');
  else if(m.type==='voice') body = ic('mic')+' Голосове · '+dur(m.dur||0);
  else if(m.type==='call') body = ic(m.missed?'phoneOff':'phone')+' '+esc(m.text);
  else body = esc(m.text||'');
  return t+`<span class="pv">${body}</span>`;
}
function netPill(){
  const map={ok:['ok','у мережі'],wait:['wait','підключення…'],bad:['bad','немає мережі'],off:['','офлайн']};
  const [cls,label]=map[S.net]||map.off;
  return `<span class="netpill ${cls}"><i></i>${label}</span>`;
}
window.H.netPill = netPill;

/* ============================================================

SCREENS.onboard = {
  render(){

        <label class="field"><span class="lab">Про себе</span>

        <div class="field"><span class="lab">Повторіть пароль</span>${window.H.pwField('obPw2')}

        <button class="btn ghost" data-act="cloudlogin">${ic('cloud')} У мене вже є акаунт — увійти</button>`:''}
      </div>
    </div>`;
  },
  mount(root){
    window.H.bindEyes(root);
    const name=$('#obName',root), bio=$('#obBio',root), mail=$('#obMail',root),
          btn=$('#obGo',root), av=$('#obAv',root), uinp=$('#obUser',root),

    let avatar=null, uState='idle';
    const sync=()=>{
      const okName = name.value.trim().length>=2;
      const u = normUser(uinp.value);

                       && pw.value.length>=4 && pw2.value.length>=4);

};
const TRANS={'а':'a','б':'b','в':'v','г':'h','ґ':'g','д':'d','е':'e','є':'ie','ж':'zh','з':'z','и':'y','і':'i',
  'ї':'i','й':'i','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f',
  'х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ь':'','ю':'iu','я':'ia','ы':'y','э':'e','ъ':''};
function translit(v){
  const s=String(v||'').trim().toLowerCase().split(/\s+/)[0]||'';
  let out=''; for(const ch of s) out += (TRANS[ch]!==undefined?TRANS[ch]:ch);
  out=normUser(out);
  return validUser(out)?out:'';
}

SCREENS.chats = {

  render(){

/* Пошук у базі йде окремо від набору тексту: коли він
   завершиться, список просто перемальовується. */
let deepTimer=null;
function deepSearch(raw){
  clearTimeout(deepTimer);
  const query=(normUser(raw)||String(raw||'').trim().toLowerCase());
  if(query.length<2){ S.deep=null; return; }
  if(S.deep && S.deep.q===query) return;
  deepTimer=setTimeout(async ()=>{
    const list=await window.H.db.searchMessages(query, 60);
    if(!list.length && !S.deep) { S.deep={q:query, list:[]}; return; }
    S.deep={q:query, list};
    const cur=current();
    if(!cur || cur.name!=='chats') return;
    const active=document.activeElement, focused=active && active.id==='q';
    const pos=focused?active.selectionStart:0;
    refresh();
    if(focused){
      const nq=$('#q',current().el);
      if(nq){ nq.focus(); try{ nq.setSelectionRange(pos,pos); }catch(e){} }
    }
  }, 320);
}

function rowHTML(c,q){
  const m=lastMsg(c);
  let name=esc(c.name);
  if(q){ const i=c.name.toLowerCase().indexOf(q);
    if(i>=0) name=esc(c.name.slice(0,i))+'<span class="hl">'+esc(c.name.slice(i,i+q.length))+'</span>'+esc(c.name.slice(i+q.length)); }
  return `<button class="row ${c.unread?'unread':''}" data-act="open" data-id="${esc(c.id)}">
    ${avatarHTML(c,'m',c.online)}
    <div class="body">
      <div class="line1"><span class="name">${name}</span>
        <span class="time">${m?shortTime(m.ts):''}</span></div>
      <div class="line2"><span class="prev">${previewOf(c)}</span>
        ${c.pinned?`<span class="pin">${ic('pin')}</span>`:''}
        ${c.unread?`<span class="badge ${c.muted?'muted':''}">${c.unread>99?'99+':c.unread}</span>`:''}</div>
    </div></button>`;
}
function reqRowHTML(c){
  return `<div class="reqrow">
    ${avatarHTML(c,'m',c.online)}
    <div class="body"><b>${esc(c.name)}</b><small>@${esc(c.username||userOf(c.id))}</small></div>
    <div class="acts">
      <button class="rb2 y" data-act="acc" data-id="${esc(c.id)}" aria-label="Прийняти">${ic('check')}</button>
      <button class="rb2 n" data-act="dec" data-id="${esc(c.id)}" aria-label="Відхилити">${ic('x')}</button>
    </div></div>`;
}
function msgHitHTML(c,m,q){
  const t=m.text||''; const i=t.toLowerCase().indexOf(q);
  const from=Math.max(0,i-24);
  const frag=(from?'…':'')+esc(t.slice(from,i))+'<span class="hl">'+esc(t.slice(i,i+q.length))+'</span>'+esc(t.slice(i+q.length,i+q.length+40));
  return `<button class="row" data-act="open" data-id="${esc(c.id)}" data-msg="${esc(m.id)}">
    ${avatarHTML(c,'m')}
    <div class="body"><div class="line1"><span class="name">${esc(c.name)}</span><span class="time">${shortTime(m.ts)}</span></div>
    <div class="line2"><span class="prev"><span class="pv">${frag}</span></span></div></div></button>`;
}

  const why={'auth-none':'Authentication у проєкті ще не активовано — Build → Authentication → Get started',

        ? 'Увімкнено · @'+esc(S.me?S.me.username:'')+' · чатів у хмарі: '+cl.chats()

  return `<button class="srow" data-act="cloud"><span class="ic" style="background:${live?'#2F8F4E':(st==='error'?'#C0392B':'#6C7B77')}">${ic('cloud')}</span>

      <div class="t"><b>Наскрізне шифрування</b><small>${window.H.e2e.ready()
        ? 'Ключі створено — листування в хмарі читають лише співрозмовники'
        : 'Цей браузер не має WebCrypto, тож шифрування недоступне'}</small></div></div>`
      : `<button class="srow" data-act="cloudlink"><span class="ic" style="background:#0E9C8C">${ic('switchUser')}</span>
      <div class="t"><b>Спробувати ще раз</b><small>Зазвичай акаунт підключається сам під час входу — тут можна повторити вручну</small></div>
      <span class="chev">${ic('chev')}</span></button>`);
}

function cloudSheet(){

  const cur=cl.config();
  const shown=cur?JSON.stringify(cur,null,1):'';
  openSheet(`<h2>Хмара Firebase</h2>
    <p class="hint">Гомін працює і без хмари — напряму між пристроями. З нею акаунт перестає бути привʼязаним до одного телефона: увійшли з іншого — і бачите ті самі чати, а повідомлення чекають на вас, навіть коли співрозмовник офлайн.</p>
    <div class="group" style="margin:0 0 12px">
      <div class="srow"><span class="ic" style="background:#0E9C8C">${ic('info')}</span>
        <div class="t"><b>Що зробити в Firebase Console</b><small>1. Створити проєкт · 2. Authentication → Sign-in method → Email/Password · 3. Firestore Database → Create · 4. Project settings → Your apps → Web → скопіювати firebaseConfig</small></div></div>
      <div class="srow"><span class="ic" style="background:#C25E36">${ic('shield')}</span>
        <div class="t"><b>Правила доступу</b><small>Вміст файла firebase/firestore.rules вставте у Firestore → Rules, інакше базу зможе прочитати будь-хто</small></div></div>
      <div class="srow"><span class="ic" style="background:#2F8F4E">${ic('lock')}</span>
        <div class="t"><b>Листування зашифроване</b><small>Повідомлення шифруються ключем, який є лише у двох співрозмовників. Власник проєкту бачить час, тип і хто кому написав — але не зміст. Дзвінки й далі йдуть напряму</small></div></div>
    </div>
    <div class="field"><span class="lab">firebaseConfig (JSON)</span>
      <textarea class="keybox" id="fbCfg" spellcheck="false" autocapitalize="off"
        placeholder='{"apiKey":"…","authDomain":"…","projectId":"…","appId":"…","messagingSenderId":"…","vapidKey":"…"}'>${esc(shown)}</textarea>
      <div class="hintline">vapidKey — з Cloud Messaging → Web Push certificates; потрібен лише для пушу через FCM.</div>
    </div>
    <div class="pwerr" id="fbErr"></div>
    <button class="btn" id="fbGo">Зберегти й підключити</button>

    $('#fbGo',sh).onclick=async ()=>{
      let o=null;
      try{ o=JSON.parse(ta.value.trim()); }catch(e){ err.textContent='Це не схоже на JSON — скопіюйте блок firebaseConfig цілком'; return; }
      if(!o || !o.apiKey || !o.projectId){ err.textContent='Бракує apiKey або projectId'; return; }
      cl.setConfig(o);
      err.textContent='Підключаємось…';
      const ok=await cl.init();
      if(!ok){ err.textContent='Не вдалося підключитися: '+(cl.error()||'перевірте дані проєкту'); return; }

/* Перевірка каже не «щось не так», а що саме натиснути в консолі. */
function diagHTML(d){
  const line=(state, ok, title, bad)=>`<div class="srow">
    <span class="ic" style="background:${state?'#2F8F4E':'#C0392B'}">${ic(state?'check':'x')}</span>
    <div class="t"><b>${title}</b><small>${state?ok:bad}</small></div></div>`;
  const auth={
    ok:['Вхід за паролем працює', ''],
    none:['', 'Authentication ще не активовано: Build → Authentication → Get started'],
    off:['', 'Увімкніть провайдер: Authentication → Sign-in method → Email/Password → Enable → Save'],
    net:['', 'Немає звʼязку з Firebase'],
    error:['', 'Firebase відповів помилкою — перевірте apiKey і projectId']
  }[d.auth] || ['', 'Невідомо'];
  const db={
    ok:['База відповідає, правила пропускають', ''],
    rules:['', 'Правила не пропускають: Firestore → Rules → вставте firebase/firestore.rules → Publish'],
    none:['', 'Базу ще не створено: Build → Firestore Database → Create database'],
    net:['', 'Немає звʼязку з Firestore'],
    error:['', 'Firestore відповів помилкою']
  }[d.db] || ['', 'Невідомо'];
  return `<div class="group" style="margin:14px 0 0">
    ${line(d.sdk, 'Проєкт '+esc(d.project), 'Підключення до Firebase', 'Не вдалося підняти SDK')}
    ${line(d.auth==='ok', auth[0], 'Акаунти (Authentication)', auth[1])}
    ${line(d.db==='ok', db[0], 'База (Firestore)', db[1])}
    ${line(d.vapid || d.relay,
        d.vapid?'Ключ Web Push на місці — пуш увімкнеться сам':'Адреса ретранслятора на місці',
        'Пуш із закритим застосунком',
        'Немає ані vapidKey, ані relay у firebase-config.js — сповіщення приходитимуть лише поки Гомін відкритий')}
    ${line(d.turn===true, 'TURN відповідає — дзвінки проходять крізь будь-який NAT',
        'Дзвінки з різних мереж',
        d.turn===false && window.H.hasTurn()
          ? 'TURN вказано, але він не відповів — перевірте адресу й пароль'
          : 'Немає TURN у firebase-config.js: повідомлення ходять через хмару завжди, а дзвінки — здебільшого лише в межах однієї мережі')}
  </div>`;
}

/* Єдиний випадок, коли без людини не обійтися: акаунт створено
   до появи хмари, і пароля застосунок не памʼятає — а Firebase

window.H.cloudNeedsLink=function(){

  setTimeout(()=>{
    if(window.H.cloud.on()) return;
    cloudLinkSheet(true);
  }, 2200);
};
window.H.cloudLink=()=>cloudLinkSheet();

function cloudLinkSheet(auto){
  const cl=window.H.cloud;
  if(!cl.configured()){ cloudSheet(); return; }
  openSheet(`<h2>${auto?'Останній крок':'Акаунт у хмарі'}</h2>
    <p class="hint">${auto
      ? 'Ваш акаунт створено ще до того, як зʼявилася хмара, тож пароля Гомін не памʼятає. Введіть його один раз — і далі все відбуватиметься саме: інші пристрої, пошук людей поза вашою мережею, сповіщення.'
      : 'Введіть пароль від акаунта — Гомін увійде в хмару під @'+esc(S.me?S.me.username:'')+' або створить там цей акаунт, якщо його ще немає.'} Пароль у Firebase не потрапляє: туди йде лише його необоротна похідна.</p>
    <div class="field"><span class="lab">Пароль від акаунта</span>
      <div class="pwrap"><input class="inp" id="lkPw" type="password" autocomplete="off" placeholder="Пароль"></div>
      <div class="pwerr" id="lkErr"></div></div>
    <button class="btn" id="lkGo">${ic('cloud')} Підключити акаунт</button>`, sh=>{

    btn.onclick=async ()=>{
      if(!pw.value){ err.textContent='Введіть пароль'; return; }
      btn.disabled=true; btn.innerHTML='Підключаємо…';
      const r=await cl.linkAccount(S.me.username, pw.value,
        {name:S.me.name, bio:S.me.bio, avatar:S.me.avatar});
      btn.disabled=false; btn.innerHTML=ic('cloud')+' Підключити акаунт';
      if(r==='ok'){
        S.me.uid=cl.uid(); save();
        /* щоб більше ніколи не питати */
        await cl.rememberLogin(S.me.username, pw.value);
        cl.start();
        window.H.notify.autoPush();
        closeSheet(); toast('Акаунт підключено до хмари'); buzz(12); refresh();
        setTimeout(()=>window.H.net.restart(), 300);
        return;
      }
      const why={taken:'Цей юзернейм у хмарі належить іншому акаунту',
                 'auth-off':'У проєкті Firebase не увімкнено вхід за паролем',
                 net:'Немає зʼєднання з хмарою',
                 'no-config':'Хмару не налаштовано'};
      err.textContent=why[r]||('Не вдалося підключити ('+r+')');
    };
    setTimeout(()=>pw.focus(),320);
  });

/* ---------- сповіщення ---------- */
function swHTML(on){ return `<span class="switch ${on?'on':''}"></span>`; }

function notifRow(){
  const n=window.H.notify;
  if(!n.supported())
    return `<div class="srow"><span class="ic" style="background:#6C7B77">${ic('bellOff')}</span>
      <div class="t"><b>Сповіщення недоступні</b><small>Цей браузер їх не підтримує — або сторінка відкрита не через https://</small></div></div>`;
  const p=n.permission();
  if(p==='denied')
    return `<button class="srow" data-act="notifhelp"><span class="ic" style="background:#C0392B">${ic('bellOff')}</span>
      <div class="t"><b>Сповіщення заблоковано</b><small>Дозвіл вимкнено в налаштуваннях браузера — покажемо, як повернути</small></div>
      <span class="chev">${ic('chev')}</span></button>`;
  const on = p==='granted' && S.cfg.notifications!==false;
  return `<button class="srow" data-act="notif"><span class="ic" style="background:#C25E36">${ic('bell')}</span>
    <div class="t"><b>Сповіщення</b><small>${on?'Нові повідомлення, запити в друзі та дзвінки':'Показувати, коли застосунок у фоні'}</small></div>
    ${swHTML(on)}</button>`
    + (on ? `<button class="srow" data-tog="notifPreview"><span class="ic" style="background:#3C7FA8">${ic('eye')}</span>
      <div class="t"><b>Показувати текст</b><small>${S.cfg.notifPreview===false?'У сповіщенні лише імʼя відправника':'У сповіщенні видно початок повідомлення'}</small></div>
      ${swHTML(S.cfg.notifPreview!==false)}</button>` : '');
}
async function toggleNotifications(btn){
  const n=window.H.notify;
  if(n.permission()==='granted'){
    S.cfg.notifications = !S.cfg.notifications;
    save(); buzz(6);
    if(!S.cfg.notifications) n.clear();
    refresh();
    return;
  }
  const r=await n.ask();
  if(r==='granted'){ S.cfg.notifications=true; save(); toast('Сповіщення увімкнено'); n.badge(); }
  else if(r==='denied') toast('Браузер заблокував сповіщення для цього сайту', 3000);
  refresh();
}

/* ---------- пуш ---------- */
function hostOf(url){ try{ return new URL(url).host; }catch(e){ return url; } }
function pushRow(){
  const n=window.H.notify, cl=window.H.cloud;
  if(!n.pushSupported()) return '';
  const fcm=cl.fcm(), relay=!!(n.relay() && n.subscription());
  const ready=fcm||relay;
  const sub = fcm ? 'Увімкнено через Firebase — надходять навіть із закритим застосунком'
    : relay ? 'Увімкнено через ретранслятор '+esc(hostOf(n.relay()))
    : 'Поки що приходять, лише коли Гомін запущено';
  return `<button class="srow" data-act="push"><span class="ic" style="background:${ready?'#2F8F4E':'#6C7B77'}">${ic('cloud')}</span>
    <div class="t"><b>Пуш коли застосунок закритий</b><small>${sub}</small></div>
    <span class="chev">${ic('chev')}</span></button>`;
}
function pushSheet(){
  const n=window.H.notify, cl=window.H.cloud;
  const relay=n.relay(), subscribed=!!(relay && n.subscription()), fcm=cl.fcm();
  const ready=subscribed||fcm;
  const auto=(cl.config()||{}).relay || ((cl.config()||{}).vapidKey && cl.on());
  openSheet(`<h2>Пуш-сповіщення</h2>
    <div class="group" style="margin:0 0 14px">
      <div class="srow"><span class="ic" style="background:${ready?'#2F8F4E':'#6C7B77'}">${ic(ready?'check':'bellOff')}</span>
        <div class="t"><b>${ready?'Усе налаштовано':'Поки що лише поки застосунок відкритий'}</b>
        <small>${fcm?'Пристрій зареєстровано у Firebase Cloud Messaging'
                : subscribed?'Підписку оформлено через '+esc(hostOf(relay))
                : auto?'Спробуємо ввімкнути автоматично, щойно дозволите сповіщення'
                : 'Той, хто розгортав Гомін, не залишив ані ключа Firebase, ані адреси ретранслятора'}</small></div></div>
    </div>
    ${ready?`<button class="btn ghost" id="pOff">Вимкнути пуш</button>`:''}
    ${fcmBlock()}
    ${ready?'':`<div class="orline" style="margin:16px 0 10px">вручну</div>
    <div class="field"><span class="lab">Адреса ретранслятора</span>
      <input id="prl" type="url" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://push.example.net" value="${esc(relay)}"></div>
    <button class="btn" id="pGo">Підключити</button>`}
    <p class="hint" style="margin-top:12px">Хто б не доставляв сповіщення, він дізнається лише те, що вам щось надійшло і від кого. Текст, фото, голосові та дзвінки через нього не проходять — а листування в хмарі ще й зашифроване так, що прочитати його може тільки співрозмовник.</p>`, sh=>{
    const inp=$('#prl',sh), go=$('#pGo',sh);
    if(go) go.onclick=async ()=>{
      go.disabled=true; go.textContent='Підключаємо…';
      const r=await n.connectRelay(inp.value);
      go.disabled=false; go.textContent='Підключити';
      if(r.ok){ closeSheet(); toast('Пуш увімкнено'); buzz(12); refresh(); return; }
      const why={'bad-url':'Потрібна адреса https:// (або http://localhost)',
                 'no-server':'Ретранслятор не відповідає за цією адресою',
                 'no-key':'Ретранслятор не віддав ключ VAPID',
                 'denied':'Спершу дозвольте сповіщення',
                 'unsupported':'Браузер не підтримує пуш',
                 'subscribe':'Не вдалося підписатися на push-службу'};
      toast(why[r.why]||'Не вдалося підключити', 3200);
    };
    const off=$('#pOff',sh);
    if(off) off.onclick=async ()=>{ await n.disconnectRelay(); closeSheet(); toast('Пуш вимкнено'); refresh(); };
    const fcm=$('#fcmGo',sh);
    if(fcm) fcm.onclick=async ()=>{
      fcm.disabled=true; fcm.textContent='Реєструємо пристрій…';
      const r=await window.H.cloud.enableFCM();
      fcm.disabled=false; fcm.innerHTML=ic('cloud')+' Увімкнути пуш через Firebase';
      if(r.ok){ closeSheet(); toast('Пристрій зареєстровано у Firebase'); return; }
      const why={'no-vapid':'У налаштуваннях хмари немає vapidKey',
                 unsupported:'Браузер не підтримує FCM',
                 'no-sw':'Service worker ще не зареєстрований',
                 denied:'Спершу дозвольте сповіщення',
                 off:'Спершу підключіть акаунт до хмари'};
      toast(why[r.why]||'Не вдалося увімкнути FCM', 3200);
    };
  });
}
/* Другий шлях до пушу: FCM. Потрібні Cloud Functions із теки
   firebase/functions — вони й надсилають сповіщення. */
function fcmBlock(){
  const cl=window.H.cloud;
  if(!cl.on()) return '';
  const cfg=cl.config()||{};
  if(!cfg.vapidKey)
    return `<p class="hint" style="margin-top:14px">Хмару підключено, але для пушу через Firebase бракує <span class="mono">vapidKey</span> — візьміть його в Project settings → Cloud Messaging → Web Push certificates.</p>`;
  return `<div class="orline" style="margin:16px 0 10px">або</div>
    <button class="btn ghost" id="fcmGo">${ic('cloud')} Увімкнути пуш через Firebase</button>
    <p class="hint" style="margin-top:10px">Сповіщення надсилатиме функція з теки <span class="mono">firebase/functions</span>. Свій ретранслятор тоді не потрібен.</p>`;
}

/* ---------- сховище ---------- */
function mb(n){
  if(!n) return '0 МБ';
  if(n<1024*1024) return Math.max(1,Math.round(n/1024))+' КБ';
  return (n/1048576).toFixed(n<10485760?1:0)+' МБ';
}
async function fillStorageLine(root){
  const el=$('#stStat',root); if(!el) return;
  const st=await window.H.db.stats();
  const cur=current();
  if(!cur || cur.name!=='settings') return;
  const line=$('#stStat',cur.el); if(!line) return;
  line.textContent = st.ok
    ? st.messages+' '+plural(st.messages,'повідомлення','повідомлення','повідомлень')+' · '+
      st.media+' '+plural(st.media,'медіафайл','медіафайли','медіафайлів')+' · '+mb(st.usage)
    : (window.H.db.supported() ? 'База не використовується — дані в localStorage' : 'IndexedDB недоступна — дані в localStorage');
}
async function storageSheet(){
  const st=await window.H.db.stats();
  const db=window.H.db;
  const rows = st.ok ? `

  else toast('Браузер зараз не пропонує встановлення');
}
async function doUpdate(){
  toast('Перевіряємо…', 1200);
  const r=await window.H.pwa.checkUpdate();
  if(r==='update') toast('Є нова версія', 8000, {label:'Оновити', fn:()=>window.H.pwa.applyUpdate()});

}

SCREENS.profile = {
  render(){
    const me=S.me||{name:'',bio:'',id:'',username:'',email:''};
    return `<header class="topbar">
      <button class="icon-btn" data-act="back" aria-label="Назад">${ic('back')}</button>
      <div class="grow"><h1>Мій профіль</h1></div>
      <button class="icon-btn accent" data-act="save" id="saveBtn" hidden aria-label="Зберегти">${ic('check')}</button>
    </header>
    <div class="scroll">
      <div class="phead">
        <button class="avedit" data-act="avatar" aria-label="Змінити фото">
          ${avatarHTML(me,'xl')}<span class="cam">${ic('camera')}</span>
        </button>
        <div class="handle">${ic('user')}@${esc(me.username)}</div>
      </div>
      <div style="padding:6px 16px 24px">
        <label class="field"><span class="lab">Імʼя</span>
          <input class="inp" id="pName" maxlength="40" value="${esc(me.name)}"></label>
        <div class="field"><span class="lab">Юзернейм</span>
          ${unameField('pUser', me.username, 'pUserStat')}
          <div class="hintline">За ним вас знаходять друзі. Якщо змінити — за старим вас більше не знайдуть.</div></div>
        <label class="field"><span class="lab">Емейл</span>
          <input class="inp" id="pMail" type="email" maxlength="80" placeholder="you@example.com" value="${esc(me.email||'')}">
          <div class="hintline">Зберігається лише на цьому пристрої й нікуди не надсилається.</div></label>
        <label class="field"><span class="lab">Про себе</span>
          <textarea class="inp" id="pBio" maxlength="140" placeholder="Кілька слів про вас">${esc(me.bio)}</textarea>
          <div style="text-align:right;font-size:11.5px;color:var(--faint);margin-top:4px" id="bioCnt"></div></label>
        <div class="btn-row" style="margin-top:6px">
          <button class="btn ghost" data-act="share">${ic('copy')} Скопіювати @${esc(me.username)}</button>
        </div>
        ${me.avatar?`<button class="btn danger" style="margin-top:10px" data-act="rmav">Прибрати фото</button>`:''}
      </div>
    </div>`;
  },
  mount(root){
    const name=$('#pName',root), bio=$('#pBio',root), mail=$('#pMail',root),
          sb=$('#saveBtn',root), cnt=$('#bioCnt',root), uinp=$('#pUser',root);
    let uState='idle';
    const upd=()=>{ cnt.textContent=bio.value.length+'/140';
      const u=normUser(uinp.value);
      const changed = name.value.trim()!==S.me.name || bio.value.trim()!==S.me.bio ||
        (mail.value||'').trim()!==(S.me.email||'') || u!==S.me.username;
      const userOk = u===S.me.username || (validUser(u) && (uState==='free'||uState==='unknown'));
      sb.hidden = !(changed && name.value.trim().length>=2 && userOk);
    };
    bindUsername(root,'pUser','pUserStat',(st)=>{ uState=st; upd(); }, 'idle');
    [name,bio,mail,uinp].forEach(el=>el.addEventListener('input',upd));
    upd();
    root.addEventListener('click', e=>{
      const b=e.target.closest('[data-act]'); if(!b) return;
      const a=b.dataset.act;
      if(a==='back') back();
      else if(a==='save'){
        if(name.value.trim().length<2){ toast('Імʼя закоротке'); return; }
        const u=normUser(uinp.value);
        const changedUser = u!==S.me.username;
        if(changedUser){
          if(!validUser(u)){ toast('Некоректний юзернейм'); return; }
          if(uState==='taken'){ toast('Цей юзернейм зайнято'); return; }
        }
        S.me.name=name.value.trim(); S.me.bio=bio.value.trim(); S.me.email=(mail.value||'').trim();
        if(changedUser){ S.me.username=u; S.me.id=idOf(u); }
        save();
        if(changedUser){ window.H.net.restart(); toast('Юзернейм тепер @'+u); }
        else { window.H.net.broadcastProfile(); window.H.cloud.setProfile(S.me); toast('Профіль оновлено'); }
        buzz(10); refresh();
      }
      else if(a==='avatar') window.H.pickAvatar(src=>{ S.me.avatar=src; save(); window.H.net.broadcastProfile();
        window.H.cloud.setProfile(S.me); refresh(); toast('Фото оновлено'); });
      else if(a==='rmav'){ S.me.avatar=null; save(); window.H.net.broadcastProfile();
        window.H.cloud.setProfile(S.me); refresh(); }
      else if(a==='share') window.H.shareId();
    });
  }
};

SCREENS.contact = {

    return `<header class="topbar">

      ${encRow(c)}
      <div class="gh">Чат</div>

        <button class="srow" data-act="pin"><span class="ic" style="background:#B8892B">${ic('pin')}</span>
          <div class="t"><b>${c.pinned?'Відкріпити':'Закріпити чат'}</b></div></button>

          <div class="t"><b>${c.muted?'Увімкнути сповіщення':'Вимкнути сповіщення'}</b></div></button>
        <button class="srow" data-act="clear"><span class="ic" style="background:#C25E36">${ic('trash')}</span>
          <div class="t"><b>Очистити листування</b></div></button>

          <div class="t"><b style="color:var(--danger)">Видалити чат</b></div></button>
      </div>
    </div>`;
  },
  mount(root,{id}){
    /* галерея спільних фото живе в базі — піднімаємо її на місці */
    const db=window.H.db;
    if(db.active() && !db.isHydrated(id)) db.hydrate(id).then(ok=>{
      const cur=current();
      if(ok && cur && cur.name==='contact' && cur.params.id===id) refresh();
    });
    root.addEventListener('click', e=>{
      const im=e.target.closest('[data-act="view"]');
      if(im){ window.H.viewImage(id, im.dataset.mid); return; }
      const b=e.target.closest('[data-act]'); if(!b) return;
      const c=S.chats[id]; const a=b.dataset.act;
      if(a==='back') back();
      else if(a==='msg'){ back(); }
      else if(a==='addfriend'){ window.H.net.friendRequest(id); toast('Запит надіслано'); buzz(12); refresh(); }
      else if(a==='nofriend'){ toast('Запит уже надіслано — чекаємо на відповідь'); }
      else if(a==='audio') window.H.net.startCall(id,'audio');

        openSheet(`<h2>Очистити листування?</h2><p class="hint">Усі повідомлення з ${esc(c.name)} зникнуть на цьому пристрої.</p>

          $('#y',sh).onclick=()=>{ c.messages=[]; c.unread=0; save(); closeSheet(); refresh(); toast('Листування очищено'); };
          $('#n',sh).onclick=()=>closeSheet();
        });
      }
      else if(a==='del'){
        openSheet(`<h2>Видалити чат?</h2><p class="hint">Чат із ${esc(c.name)} буде прибрано зі списку.</p>
          <button class="btn danger" id="y">Видалити</button><button class="btn ghost" style="margin-top:8px" id="n">Скасувати</button>`, sh=>{
          $('#y',sh).onclick=()=>{ delete S.chats[id]; save(); closeSheet(); window.H.switchTab('chats'); toast('Чат видалено'); };
          $('#n',sh).onclick=()=>closeSheet();
        });
      }
      else if(a==='more'){
        openSheet(`<h2>${esc(c.name)}</h2><p class="hint mono" style="font-size:12.5px">@${esc(c.username||userOf(c.id))}</p>
          <button class="btn ghost" id="cp">${ic('copy')} Скопіювати @юзернейм</button>`, sh=>{
          $('#cp',sh).onclick=()=>{ window.H.copy('@'+(c.username||userOf(c.id))); closeSheet(); };
        });
      }
    });
  }
};

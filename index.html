function openCallUI(st){
  closeCallUI(true);
  const el=document.createElement('div');
  el.className='callscreen';
  el.dataset.video = st.kind==='video'?'1':'0';
  el.innerHTML=callHTML(st);
  $('#overlays').appendChild(el);
  /* el має бути останнім: у st воно вже може лежати порожнім,
     поки дзвінок показувався смужкою */
  callUI=Object.assign({}, st, {el});
  el.addEventListener('click', e=>{
    const b=e.target.closest('[data-a]'); if(!b) return;
    const a=b.dataset.a;
    if(a==='end') endCall('Завершено');
    else if(a==='decline') declineCall();
    else if(a==='accept') answerCall();
    else if(a==='mute') toggleMute();
    else if(a==='cam') toggleCam();
    else if(a==='speaker'){ callUI.speaker=!callUI.speaker; repaintCall(); toast(callUI.speaker?'Гучний звʼязок':'Звичайний режим'); }
  });
  return el;
}
function repaintCall(){
  if(!callUI || !callUI.el) return;
  const el=callUI.el;
  el.dataset.video = callUI.kind==='video'?'1':'0';
  el.classList.toggle('connected', !!callUI.connected);
  el.innerHTML=callHTML(callUI);
  bindStreams();
}
function bindStreams(){
  if(!callUI || !callUI.el) return;
  const lv=$('#localVideo',callUI.el), rv=$('#remoteVideo',callUI.el);
  if(lv && localStream){ lv.srcObject=localStream; }
  if(rv && remoteStream){ rv.srcObject=remoteStream; rv.play&&rv.play().catch(()=>{}); }
  if(!callUI.audioEl && remoteStream && callUI.kind==='audio'){
    const a=document.createElement('audio'); a.autoplay=true; a.srcObject=remoteStream;
    callUI.el.appendChild(a); callUI.audioEl=a;
  }
}
function closeCallUI(instant){
  ringStop();
  hideRingBar(instant);
  clearInterval(callTimer);
  if(callUI && callUI.el){
    const el=callUI.el;
    if(instant) el.remove();
    else { el.classList.add('out'); setTimeout(()=>el.remove(),300); }
  }
  callUI=null;
}
function stopLocal(){
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  remoteStream=null;
}
async function getMedia(kind){
  const cons = kind==='video'
    ? {audio:{echoCancellation:true}, video:{facingMode:'user', width:{ideal:1280}, height:{ideal:720}}}
    : {audio:{echoCancellation:true, noiseSuppression:true}};
  return navigator.mediaDevices.getUserMedia(cons);
}

async function startCall(id, kind){
  const chat=S.chats[id]; if(!chat) return;
  if(callUI){ toast('Уже триває дзвінок'); return; }
  if(!peer || peer.destroyed || !peer.open){
    toast('Немає зʼєднання з мережею — дзвінок неможливий', 3000);
    net.start(); return;
  }
  try{ localStream=await getMedia(kind); }
  catch(e){ toast(kind==='video'?'Немає доступу до камери':'Немає доступу до мікрофона'); return; }
  openCallUI({chat, peerId:id, kind, label:'Виклик…', connected:false, incoming:false, muted:false, camOff:false});
  bindStreams();
  callT0=0; ringStart();
  const conn=conns[id];
  if(conn && conn.open){ try{ conn.send({t:'ring', kind}); }catch(e){} }
  else window.H.notify.wake(chat, 'call');   /* друг офлайн — хай телефон задзвонить */
  try{ callObj = peer.call(targetOf(id), localStream, {metadata:{kind, profile:shortProfile()}}); }
  catch(e){ endCall('Не вдалося зателефонувати', true); return; }
  wireCall(callObj);
  setTimeout(()=>{ if(callUI && !callUI.connected) endCall('Немає відповіді', true); }, 45000);
}
function wireCall(call){
  call.on('stream', rs=>{
    remoteStream=rs; ringStop();
    if(!callUI) return;
    callUI.connected=true; callUI.label='0:00'; repaintCall(); startTimer(); snd.call();
  });
  call.on('close', ()=>{ if(callUI) endCall('Завершено'); });
  call.on('error', ()=>{ if(callUI) endCall('Помилка зʼєднання', true); });
}
function startTimer(){
  callT0=Date.now();
  clearInterval(callTimer);
  callTimer=setInterval(()=>{
    if(!callUI){ clearInterval(callTimer); return; }
    const s=(Date.now()-callT0)/1000;
    callUI.label=durLong(s);
    const el=callUI.el && $('#callSt',callUI.el); if(el) el.textContent=callUI.label;
  },500);
}

/* Вхідний дзвінок не забирає екран одразу: спершу зверху
   зʼявляється смужка з тим, хто дзвонить, і двома кнопками —
   так само, як у звичних месенджерах. Повний екран відкриється,
   коли на дзвінок відповіли (або коли торкнутися смужки). */
let ringBar=null;
function showRingBar(chat, kind){
  hideRingBar(true);
  const el=document.createElement('div');
  el.className='ringbar';
  el.innerHTML=`${avatarHTML(chat,'m')}
    <button class="who" data-a="open">
      <b>${esc(chat.name)}</b>
      <small><i></i>${kind==='video'?'Вхідний відеодзвінок':'Вхідний дзвінок'}</small>
    </button>
    <button class="rb no" data-a="decline" aria-label="Відхилити">${ic('phoneOff')}</button>
    <button class="rb yes" data-a="accept" aria-label="Відповісти">${ic('phone')}</button>`;
  $('#overlays').appendChild(el);
  el.addEventListener('click', e=>{
    const b=e.target.closest('[data-a]'); if(!b) return;
    const a=b.dataset.a;
    if(a==='accept') answerCall();
    else if(a==='decline') declineCall();
    else if(a==='open'){ hideRingBar(); if(callUI && !callUI.el) openCallUI(callUI); }
  });
  ringBar=el;
  return el;
}
function hideRingBar(instant){
  const el=ringBar; ringBar=null;
  if(!el) return;
  if(instant){ el.remove(); return; }
  el.classList.add('out');
  setTimeout(()=>el.remove(), 280);
}

function incomingCall(call){
  const kind=(call.metadata&&call.metadata.kind)||'audio';
  const prof=call.metadata&&call.metadata.profile;
  const chat=ensureChat(canon(call.peer), prof&&prof.name);
  if(prof){ chat.name=prof.name||chat.name; chat.avatar=prof.avatar||chat.avatar; save(); }
  if(callUI){ try{ call.close(); }catch(e){} return; }
  callObj=call;
  callUI={chat, peerId:canon(call.peer), kind,
          label:kind==='video'?'Вхідний відеодзвінок':'Вхідний дзвінок',
          connected:false, incoming:true, muted:false, camOff:false, el:null};
  showRingBar(chat, kind);
  window.H.notify.call(chat, kind);
  ringStart();
  wireCall(call);
}
async function answerCall(){
  if(!callUI||!callObj) return;
  hideRingBar();
  window.H.notify.clear(callUI.peerId);
  try{ localStream=await getMedia(callUI.kind); }
  catch(e){ toast('Немає доступу до пристрою'); declineCall(); return; }
  ringStop();
  try{ callObj.answer(localStream); }catch(e){}
  callUI.incoming=false; callUI.label='Зʼєднання…';
  if(!callUI.el){ const st=callUI; callUI=null; openCallUI(st); }
  repaintCall(); bindStreams();
}
function declineCall(){
  if(!callUI) return;
  hideRingBar();
  const id=callUI.peerId;
  window.H.notify.clear(callUI.peerId);
  try{ callObj&&callObj.close(); }catch(e){}
  try{ conns[id]&&conns[id].open&&conns[id].send({t:'callend'}); }catch(e){}
  logCall(id, 'in', callUI.kind, 0, true);
  stopLocal(); closeCallUI(); toast('Дзвінок відхилено');
}
function hangup(){ endCall('Завершено'); }
function endCall(reason, missed){
  if(!callUI) return;
  const {peerId, kind, incoming, connected}=callUI;
  const secs = connected && callT0 ? (Date.now()-callT0)/1000 : 0;
  try{ callObj&&callObj.close(); }catch(e){}
  try{ conns[peerId]&&conns[peerId].open&&conns[peerId].send({t:'callend'}); }catch(e){}
  callObj=null;
  logCall(peerId, incoming?'in':'out', kind, secs, !!missed&&!connected);
  stopLocal(); closeCallUI();
  if(reason) toast(reason+(secs?' · '+durLong(secs):''));
}
function toggleMute(){
  if(!localStream) return;
  callUI.muted=!callUI.muted;
  localStream.getAudioTracks().forEach(t=>t.enabled=!callUI.muted);
  repaintCall(); buzz(8);
}
function toggleCam(){
  if(!localStream) return;
  callUI.camOff=!callUI.camOff;
  localStream.getVideoTracks().forEach(t=>t.enabled=!callUI.camOff);
  repaintCall(); buzz(8);
}
function logCall(peerId, dir, kind, secs, missed){
  const chat=S.chats[peerId];
  S.calls.unshift({id:uid(8), peerId, name:chat?chat.name:peerId, dir, kind, ts:Date.now(), dur:Math.round(secs), missed:!!missed});
  if(chat){
    const label = missed ? (dir==='in'?'Пропущений дзвінок':'Немає відповіді')
      : (kind==='video'?'Відеодзвінок':'Дзвінок')+(secs?' · '+durLong(secs):'');
    chat.messages.push({id:uid(10), type:'call', from:dir==='in'?'them':'me', text:label, missed:!!missed, ts:Date.now(), status:'read'});
    if(missed && dir==='in') window.H.notify.missed(chat);
    else window.H.notify.clear(peerId);
    window.H.repaintChat(peerId);
  }
  save(); window.H.repaintList();
}

window.H.seedDemo = function(){ return {}; };
})();
</script>
<script>
/* ============================================================
   ГОМІН — сповіщення та пуш

   Два рівні, які доповнюють один одного:

   1. Локальні сповіщення. Поки застосунок запущений (навіть у
      фоні), нове повідомлення, запит у друзі чи дзвінок показує
      системне сповіщення через service worker.

   2. Пуш. Коли застосунок закритий, зʼєднання немає — розбудити
      пристрій може лише push-служба браузера. Для цього потрібен
      маленький ретранслятор з ключами VAPID (тека push-relay).
      Свою адресу підписки Гомін передає друзям просто через
      зʼєднання; надсилаючи повідомлення офлайновому другові,
      застосунок стукає в ЙОГО ретранслятор. Спільного сервера,
      який бачив би все листування, не зʼявляється: ретранслятор
      знає лише, кому й від кого прийшло сповіщення.
   ============================================================ */
(function(){
'use strict';
const {S, save, toast} = window.H;

let subCache=null;       // {endpoint, keys:{p256dh, auth}}
let autoRunning=false;
let relayCache='';       // адреса ретранслятора цього пристрою
const woke={};           // коли востаннє будили друга — не частіше разу на хвилину

function supported(){ return typeof Notification!=='undefined' && 'serviceWorker' in navigator; }
function permission(){ try{ return supported()?Notification.permission:'unsupported'; }catch(e){ return 'unsupported'; } }
function granted(){ return permission()==='granted'; }
function on(){ return granted() && S.cfg.notifications!==false; }

/* navigator.serviceWorker.ready ніколи не спрацює там, де service
   worker не зареєстрований, — тому чекаємо на нього з таймером. */
function reg(){
  if(!('serviceWorker' in navigator)) return Promise.resolve(null);
  const r=window.H.pwa && window.H.pwa.reg;
  if(r) return Promise.resolve(r);
  return Promise.race([
    navigator.serviceWorker.ready.catch(()=>null),
    new Promise(res=>setTimeout(()=>res(null), 1500))
  ]);
}

async function ask(){
  if(!supported()) return 'unsupported';
  if(Notification.permission==='granted') return 'granted';
  if(Notification.permission==='denied') return 'denied';
  let r='default';
  try{ r=await Notification.requestPermission(); }catch(e){ r='denied'; }
  return r;
}

/* ---------- показ ---------- */
async function show(o){
  if(!on()) return false;
  const opts={
    body:o.body||'',
    icon:'icons/icon-192.png',
    badge:'icons/favicon-64.png',
    tag:o.tag||'homin',
    renotify:true,
    lang:'uk',
    timestamp:Date.now(),
    silent:!S.cfg.sounds,
    requireInteraction:!!o.sticky,
    data:Object.assign({chatId:o.chatId||null, url:'./'}, o.data||{}),
    vibrate:o.vibrate||[60,40,60]
  };
  try{
    const r=await reg();
    if(r && r.showNotification){
      /* кнопки під сповіщенням існують лише в service worker */
      const full=o.actions ? Object.assign({}, opts, {actions:o.actions}) : opts;
      await r.showNotification(o.title||'Гомін', full);
      return true;
    }
  }catch(e){}
  try{ new Notification(o.title||'Гомін', opts); return true; }catch(e){}
  return false;
}

function preview(m){
  if(S.cfg.notifPreview===false) return 'Нове повідомлення';
  if(m.type==='image') return m.text ? '📷 '+m.text : '📷 Фото';
  if(m.type==='voice') return '🎤 Голосове повідомлення';
  const t=(m.text||'').trim();
  return t.length>140 ? t.slice(0,140)+'…' : (t||'Нове повідомлення');
}

/* Сповіщення тільки тоді, коли людина не дивиться саме в цей чат. */
function idle(chatId){ return document.hidden || S.active!==chatId; }

const notify = {
  supported, permission, granted, ask, show,
  registration:reg,

  message(chat, m){
    if(!chat || chat.muted || !idle(chat.id)) return;
    show({ title:chat.name || ('@'+(chat.username||'')), body:preview(m), tag:'chat:'+chat.id,
           chatId:chat.id, actions:[{action:'open', title:'Відкрити'}] });
  },
  friendRequest(chat){
    show({ title:'Запит у друзі', body:(chat.name||('@'+chat.username))+' хоче спілкуватися',
           tag:'req:'+chat.id, chatId:chat.id });
  },
  friendOk(chat){
    show({ title:chat.name||('@'+chat.username), body:'Прийняв(ла) ваш запит у друзі',
           tag:'req:'+chat.id, chatId:chat.id });
  },
  call(chat, kind){
    show({ title:chat.name||('@'+chat.username),
           body:kind==='video'?'Вхідний відеодзвінок':'Вхідний дзвінок',
           tag:'call:'+chat.id, chatId:chat.id, sticky:true,
           vibrate:[300,150,300,150,300,150,300],
           data:{kind:'call'},
           actions:[{action:'accept', title:'Відповісти'},
                    {action:'decline', title:'Відхилити'}] });
  },
  missed(chat){
    show({ title:chat.name||('@'+chat.username), body:'Пропущений дзвінок',
           tag:'call:'+chat.id, chatId:chat.id });
  },

  /* Чат відкрили — прибираємо його сповіщення з шторки. */
  async clear(chatId){
    try{
      const r=await reg(); if(!r || !r.getNotifications) return;
      const list=await r.getNotifications();
      list.forEach(n=>{
        const tag=n.tag||'';
        if(!chatId || tag==='chat:'+chatId || tag==='call:'+chatId || tag==='req:'+chatId) n.close();
      });
    }catch(e){}
  },

  /* Кружечок з числом на іконці застосунку. */
  badge(){
    try{
      const n=window.H.totalUnread();
      if(n>0 && navigator.setAppBadge) navigator.setAppBadge(n).catch(()=>{});
      else if(navigator.clearAppBadge) navigator.clearAppBadge().catch(()=>{});
    }catch(e){}
  },

  /* Після входу все налаштовується саме: підписка на пуш,
     реєстрація пристрою у Firebase — жодних адрес і ключів
     вводити не треба. Питаємо лише дозвіл на сповіщення, бо
     його дає людина. */
  async afterLogin(){
    try{ await notify.restore(); }catch(e){}
    notify.badge();
    if(granted()){ notify.autoPush(); return; }
    if(!supported() || permission()!=='default') return;
    setTimeout(()=>{
      toast('Показувати сповіщення про нові повідомлення?', 9000, {label:'Увімкнути', fn:async ()=>{
        const r=await ask();
        if(r==='granted'){
          S.cfg.notifications=true; save(); notify.badge();
          const how=await notify.autoPush();
          toast(how ? 'Сповіщення увімкнено — приходитимуть навіть із закритим застосунком'
                    : 'Сповіщення увімкнено');
        }
        else if(r==='denied') toast('Браузер заблокував сповіщення для цього сайту');
      }});
    }, 2600);
  },

  /* Пуш сам обирає, чим його доставляти: спершу Firebase, потім
     ретранслятор, адресу якого залишив той, хто розгортав Гомін. */
  async autoPush(){
    if(!granted() || autoRunning) return null;
    autoRunning=true;
    try{
      const cl=window.H.cloud;
      const cfg=cl.config()||{};
      if(cl.on() && cfg.vapidKey){
        const r=await cl.enableFCM();
        if(r.ok) return 'fcm';
      }
      const url=notify.relay();
      if(url && !subCache){
        const r=await notify.connectRelay(url);
        if(r.ok) return 'relay';
      }
      return subCache ? 'relay' : null;
    }catch(e){ return null; }
    finally{ autoRunning=false; }
  },

  /* ---------- пуш ---------- */
  pushSupported(){ return supported() && 'PushManager' in window; },
  relay(){
    const cfg=window.H.cloud.config()||{};
    return relayCache || S.cfg.pushRelay || cfg.relay || '';
  },
  subscription(){ return subCache; },

  /* Те, що ми віддаємо друзям: куди стукати, щоб нас розбудили. */
  card(){
    if(!subCache || !notify.relay()) return null;
    return { relay:notify.relay(), sub:subCache };
  },

  async restore(){
    if(!notify.pushSupported()) return;
    try{
      relayCache = await window.H.db.kvGet('pushRelay', S.cfg.pushRelay||'') || '';
      const r=await reg(); if(!r || !r.pushManager) return;
      const s=await r.pushManager.getSubscription();
      subCache = s ? s.toJSON() : null;
      if(subCache && !subCache.keys) subCache=null;
    }catch(e){}
  },

  /* Підписка на push-службу браузера через власний ретранслятор. */
  async connectRelay(url){
    if(!notify.pushSupported()) return {ok:false, why:'unsupported'};
    url=String(url||'').trim().replace(/\/+$/,'');
    if(!/^https:\/\/[^\s]+$/i.test(url) && !/^http:\/\/localhost(:\d+)?$/i.test(url))
      return {ok:false, why:'bad-url'};
    if(!granted()){
      const p=await ask();
      if(p!=='granted') return {ok:false, why:'denied'};
    }
    let key='';
    try{
      const res=await fetch(url+'/key', {cache:'no-store'});
      if(!res.ok) return {ok:false, why:'no-server'};
      key=(await res.json()).key||'';
    }catch(e){ return {ok:false, why:'no-server'}; }
    if(!key) return {ok:false, why:'no-key'};
    try{
      const r=await reg(); if(!r || !r.pushManager) return {ok:false, why:'unsupported'};
      let s=await r.pushManager.getSubscription();
      if(s){
        const same = s.options && s.options.applicationServerKey &&
                     b64url(s.options.applicationServerKey)===key;
        if(!same){ try{ await s.unsubscribe(); }catch(e){} s=null; }
      }
      if(!s) s=await r.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:fromB64url(key)});
      subCache=s.toJSON();
      relayCache=url;
      S.cfg.pushRelay=url; save();
      await window.H.db.kvSet('pushRelay', url);
      await window.H.db.kvSet('pushSub', subCache);
      window.H.net && window.H.net.sharePush && window.H.net.sharePush();
      window.H.cloud.publishPushCard(notify.card());
      return {ok:true};
    }catch(e){ return {ok:false, why:'subscribe'}; }
  },

  async disconnectRelay(){
    try{
      const r=await reg();
      const s=r && r.pushManager ? await r.pushManager.getSubscription() : null;
      if(s) await s.unsubscribe();
    }catch(e){}
    subCache=null; relayCache='';
    S.cfg.pushRelay=''; save();
    try{ await window.H.db.kvSet('pushRelay',''); await window.H.db.kvSet('pushSub', null); }catch(e){}
    window.H.net && window.H.net.sharePush && window.H.net.sharePush();
    window.H.cloud.publishPushCard(null);
  },

  /* Друг офлайн — просимо його ретранслятор розбудити пристрій.
     Туди йде лише імʼя відправника, без тексту листування. */
  async wake(chat, what){
    const card = chat && chat.push;
    if(!card || !card.relay || !card.sub) return false;
    const now=Date.now();
    const gap = what==='call' ? 15000 : 60000;
    if(woke[chat.id] && now-woke[chat.id] < gap) return false;
    woke[chat.id]=now;
    const me=S.me ? (S.me.name || '@'+S.me.username) : 'Гомін';
    const body = what==='call' ? me+' дзвонить' : what==='friend' ? me+' хоче додати вас у друзі'
               : 'Нове повідомлення від '+me;
    const mine=S.me?S.me.id:'';
    try{
      const res=await fetch(card.relay+'/push', {
        method:'POST', mode:'cors', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ subscription:card.sub,
          payload:{ title: what==='call' ? me : 'Гомін', body, chatId:mine,
                    kind: what==='call' ? 'call' : 'msg',
                    tag: (what==='call'?'call:':'chat:')+mine } })
      });
      return res.ok;
    }catch(e){ return false; }
  }
};

function b64url(buf){
  const a=new Uint8Array(buf); let s='';
  for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromB64url(s){
  const pad='='.repeat((4-s.length%4)%4);
  const bin=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}

/* Натиск на сповіщення відкриває потрібний чат. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', e=>{
    const d=e.data||{};
    if(d.type!=='OPEN_CHAT') return;
    const id=d.chatId;
    try{ window.focus(); }catch(err){}
    if(!S.me) return;
    /* кнопки «Відповісти» й «Відхилити» просто зі шторки */
    if(d.action==='accept'){ window.H.net.answerCall(); return; }
    if(d.action==='decline'){ window.H.net.hangup(); return; }
    if(id && S.chats[id]) window.H.openChat(id);
    else window.H.switchTab('chats');
  });
}

window.H.notify = notify;
})();
</script>
<script>
/* ============================================================
   ГОМІН — наскрізне шифрування

   Хмара зберігає листування, але читати його не може.

   У кожного акаунта є пара ключів ECDH (P-256). Публічний
   лежить у профілі — його бачать усі. Приватний ніколи не
   виходить назовні у відкритому вигляді: він загорнутий у
   AES-GCM ключем, похідним від пароля (PBKDF2, 150 000
   ітерацій), і в такому вигляді лежить поруч із профілем. Тому
   на новому пристрої достатньо ввести пароль — і ключ знову
   ваш; сервер же має лише шматок шифротексту.

   Ключ розмови рахують обидві сторони самостійно: ECDH зі
   свого приватного й чужого публічного, далі HKDF з іменем
   чату. Однаковий у двох, невідомий більше нікому — Firebase
   бачить тільки час, тип і відправника.

   Прямий звʼязок (WebRTC) і без цього шифрований самим
   браузером, тож там повідомлення йдуть як є.
   ============================================================ */
(function(){
'use strict';
const {store} = window.H;

const TE=new TextEncoder(), TD=new TextDecoder();
const subtle = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;

let priv=null;          // CryptoKey — лише в памʼяті
let pubRaw=null;        // мій публічний ключ, base64
const shared=new Map(); // uid співрозмовника -> CryptoKey розмови
const theirPub=new Map();

function b64(buf){
  const a=buf instanceof Uint8Array?buf:new Uint8Array(buf);
  let s=''; for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));
  return btoa(s);
}
function unb64(s){
  const bin=atob(s), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}
function rnd(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return a; }

/* ---------- обгортка приватного ключа паролем ---------- */
async function wrapKey(password, saltB64){
  const base=await subtle.importKey('raw', TE.encode(password), 'PBKDF2', false, ['deriveKey']);
  return subtle.deriveKey(
    {name:'PBKDF2', salt:unb64(saltB64), iterations:150000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function packPriv(password){
  const salt=b64(rnd(16));
  const kek=await wrapKey(password, salt);
  const pkcs8=await subtle.exportKey('pkcs8', priv);
  const iv=rnd(12);
  const ct=await subtle.encrypt({name:'AES-GCM', iv}, kek, pkcs8);
  return {v:1, salt, iv:b64(iv), ct:b64(ct), pub:pubRaw};
}
async function unpackPriv(password, box){
  const kek=await wrapKey(password, box.salt);
  const pkcs8=await subtle.decrypt({name:'AES-GCM', iv:unb64(box.iv)}, kek, unb64(box.ct));
  priv=await subtle.importKey('pkcs8', pkcs8, {name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
  pubRaw=box.pub;
}

async function generate(){
  const pair=await subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
  priv=pair.privateKey;
  pubRaw=b64(await subtle.exportKey('raw', pair.publicKey));
}

/* Локальна копія: обгортка для хмари (щоб було що віддати
   новому пристрою) і сам ключ — зашифрований ключем акаунта,
   як і решта бази. Завдяки їй автоматичний вхід не питає пароль. */
async function saveLocal(box){
  const db=window.H.db;
  try{
    if(box) await db.kvSet('e2e', box);
    const pkcs8=await subtle.exportKey('pkcs8', priv);
    await db.secretSet('e2ePriv', {priv:b64(pkcs8), pub:pubRaw});
  }catch(e){}
}

/* ---------- ключ конкретної розмови ---------- */
async function keyFor(uid, pubB64, chatId){
  if(shared.has(uid)) return shared.get(uid);
  if(!priv || !pubB64) return null;
  try{
    const their=await subtle.importKey('raw', unb64(pubB64), {name:'ECDH', namedCurve:'P-256'}, false, []);
    const bits=await subtle.deriveBits({name:'ECDH', public:their}, priv, 256);
    const hk=await subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    const key=await subtle.deriveKey(
      {name:'HKDF', hash:'SHA-256', salt:TE.encode(chatId||'homin'), info:TE.encode('homin-msg-v1')},
      hk, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    shared.set(uid, key);
    theirPub.set(uid, pubB64);
    return key;
  }catch(e){ return null; }
}
/* Співрозмовник змінив ключі — старий спільний ключ уже не той. */
function forget(uid, pubB64){
  if(theirPub.get(uid)!==pubB64){ shared.delete(uid); theirPub.delete(uid); }
}

const e2e = {
  supported(){ return !!subtle; },
  ready(){ return !!priv; },
  pub(){ return pubRaw; },

  /* Реєстрація: нова пара ключів. Повертає те, що можна
     покласти в хмару. */
  async create(password){
    if(!subtle) return null;
    try{
      await generate();
      const box=await packPriv(password);
      await saveLocal(box);
      return box;
    }catch(e){ priv=null; pubRaw=null; return null; }
  },

  /* Вхід: розгортаємо ключ паролем. box — з хмари або з
     локальної бази, якщо хмари немає. */
  async unlock(password, box){
    if(!subtle) return false;
    try{
      const b=box || await window.H.db.kvGet('e2e', null);
      if(!b || !b.ct) return false;
      await unpackPriv(password, b);
      shared.clear(); theirPub.clear();
      await saveLocal(b);
      return true;
    }catch(e){ priv=null; pubRaw=null; return false; }
  },

  /* Автоматичний вхід: пароля вже немає, зате є локальна копія
     ключа — вона лежить у базі під ключем акаунта. */
  async resume(){
    if(!subtle) return false;
    try{
      const local=await window.H.db.secretGet('e2ePriv', null);
      if(!local || !local.priv) return false;
      priv=await subtle.importKey('pkcs8', unb64(local.priv), {name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
      pubRaw=local.pub;
      shared.clear(); theirPub.clear();
      return true;
    }catch(e){ return false; }
  },

  /* Пароль змінився — переобгортаємо ключ новим. */
  async rewrap(newPassword){
    if(!priv) return null;
    try{
      const box=await packPriv(newPassword);
      await saveLocal(box);
      return box;
    }catch(e){ return null; }
  },

  forget,
  known(uid){ return theirPub.has(uid) || shared.has(uid); },

  /* {e:1, iv, ct} або null, якщо шифрувати нічим */
  async seal(uid, pubB64, chatId, text){
    if(text==null || text==='') return null;
    const key=await keyFor(uid, pubB64, chatId);
    if(!key) return null;
    try{
      const iv=rnd(12);
      const ct=await subtle.encrypt({name:'AES-GCM', iv}, key, TE.encode(text));
      return {e:1, iv:b64(iv), ct:b64(ct)};
    }catch(e){ return null; }
  },
  async open(uid, pubB64, chatId, box){
    if(!box || !box.ct) return null;
    const key=await keyFor(uid, pubB64, chatId);
    if(!key) return null;
    try{
      const pt=await subtle.decrypt({name:'AES-GCM', iv:unb64(box.iv)}, key, unb64(box.ct));
      return TD.decode(pt);
    }catch(e){ return null; }
  },

  lock(){ priv=null; pubRaw=null; shared.clear(); theirPub.clear(); }
};

window.H.e2e = e2e;
})();
</script>
<script>
/* ============================================================
   ГОМІН — хмара (Firebase)

   Друга база даних — уже не на пристрої, а на сервері. Вона дає
   те, чого прямий звʼязок дати не може:

     * акаунт живе не на одному телефоні. Увійшли з іншого
       пристрою тим самим @юзернеймом і паролем — і бачите ті
       самі чати. Обидва пристрої працюють одночасно;
     * повідомлення доходять, коли співрозмовник офлайн: вони
       лежать у Firestore і зʼявляються в нього миттєво, щойно
       він відкриє застосунок;
     * пуш через FCM.

   Пароль у Firebase не потрапляє: для входу туди йде похідна
   SHA-256 від пароля й юзернейма. Ключ, яким шифрується база на
   пристрої, рахується окремо (PBKDF2) і не залишає телефон.

   Що бачить власник проєкту Firebase: профілі, списки чатів і
   текст повідомлень — так само, як у будь-якому месенджері з
   сервером. Кому цього не треба, може не вмикати хмару: прямий
   звʼязок працює як раніше.

   Налаштування — у firebase-config.js або через
   Налаштування → Хмара.
   ============================================================ */
(function(){
'use strict';
const {S, save, toast, store, uid, idOf, userOf, normUser} = window.H;

const SDK='https://www.gstatic.com/firebasejs/12.18.0/';
const CFG='homin.fb';
const DEV='homin.device';
const KEEP='homin.fbk.';   // памʼять про вхід у Firebase (лише якщо просили запамʼятати)
const MEDIA_MAX=700000;      // більше в документ Firestore не влізе
const KEEP_DEVICE=3*86400000; // скільки памʼятати чужий пристрій у списку

let cfg=null, app=null, auth=null, fs=null;
let A=null, F=null;                 // модулі firebase-auth / firebase-firestore
let user=null;                      // акаунт Firebase
let state='off';                    // off | init | ready | on | error
let started=false, booting=null;
let unsubChats=null, unsubMe=null;
const unsubMsgs={};                 // cloudId -> unsubscribe
const profiles=new Map();           // uid -> профіль
const link=new Map();               // локальний chatId -> {cloudId, uid}
let deviceId=null;
let lastError='', fcmToken=null, authError='';
let peopleCount=null;
let authReady=null, authSeen=null;

/* ---------- налаштування ---------- */
function readCfg(){
  const saved=store.get(CFG, null);
  if(saved && saved.apiKey) return saved;
  const file=window.HOMIN_FIREBASE;
  if(file && file.apiKey) return file;
  return null;
}
function configured(){ return !!readCfg(); }
function device(){
  if(deviceId) return deviceId;
  deviceId=store.get(DEV, null);
  if(!deviceId){ deviceId='d'+uid(10); store.set(DEV, deviceId); }
  return deviceId;
}

/* Пароль у Firebase не йде — тільки похідна від нього.
   Заразом це знімає вимогу Firebase до довжини пароля. */
const TE=new TextEncoder();
async function secret(username, password){
  const src='homin-auth|'+username+'|'+password;
  try{
    const h=await crypto.subtle.digest('SHA-256', TE.encode(src));
    const a=new Uint8Array(h); let s='';
    for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]);
    return btoa(s);
  }catch(e){ return 'homin-'+password+'-'+username; }
}

/* ---------- підняття SDK ---------- */
async function init(){
  if(app) return true;
  if(booting) return booting;
  cfg=readCfg();
  if(!cfg) return false;
  state='init';
  booting=(async()=>{
    try{
      const [fa, fauth, ffs] = await Promise.all([
        import(SDK+'firebase-app.js'),
        import(SDK+'firebase-auth.js'),
        import(SDK+'firebase-firestore.js')
      ]);
      A=fauth; F=ffs;
      app = fa.getApps().length ? fa.getApp() : fa.initializeApp(cfg);
      auth = A.getAuth(app);
      try{ await A.setPersistence(auth, A.indexedDBLocalPersistence); }catch(e){}
      try{
        fs = F.initializeFirestore(app, {
          localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})
        });
      }catch(e){ fs = F.getFirestore(app); }
      authReady=new Promise(res=>{ authSeen=res; });
      let first=true;
      A.onAuthStateChanged(auth, u=>{
        user=u||null;
        if(!u) stop();
        if(first){ first=false; authSeen(u||null); }
      });
      state='ready';
      return true;
    }catch(e){
      lastError=String(e&&e.message||e);
      state='error';
      return false;
    }finally{ booting=null; }
  })();
  return booting;
}

function mapAuthError(e){
  const c=String((e&&e.code)||'');
  if(c.indexOf('email-already-in-use')>=0) return 'taken';
  if(c.indexOf('invalid-credential')>=0 || c.indexOf('wrong-password')>=0) return 'wrong';
  if(c.indexOf('user-not-found')>=0) return 'wrong';
  if(c.indexOf('too-many-requests')>=0) return 'too-many';
  if(c.indexOf('network')>=0) return 'net';
  if(c.indexOf('operation-not-allowed')>=0) return 'auth-off';
  if(c.indexOf('configuration-not-found')>=0) return 'auth-none';
  if(c.indexOf('permission-denied')>=0) return 'rules';
  return 'error';
}
const emailOf = u => u+'@homin.app';

/* Firestore, не діставшись сервера, чекає на нього скільки
   завгодно довго. Там, де на відповідь чекає людина, обмежуємо
   очікування й повертаємось до прямого звʼязку.

   А якщо база мовчить раз за разом (її просто не створили в
   консолі), більше не чекаємо на неї по кілька секунд щоразу —
   інакше пошук і перевірка юзернейма здаються зламаними. */
let fsFails=0;
function within(promise, ms, fallback){
  const limit = fsFails>=2 ? 1200 : (ms||8000);
  return Promise.race([
    promise.then(v=>{ fsFails=0; return v; }).catch(()=>fallback),
    new Promise(res=>setTimeout(()=>{ fsFails++; res(fallback); }, limit))
  ]);
}

/* ---------- акаунти ---------- */
async function usernameFree(u){
  if(!await init()) return null;
  const s=await within(F.getDoc(F.doc(fs,'usernames',u)), 5000, null);
  return s ? !s.exists() : null;
}

async function signUp(username, password, profile){
  if(!await init()) return 'no-config';
  try{
    const free=await usernameFree(username);
    if(free===false) return 'taken';
    const cred=await A.createUserWithEmailAndPassword(auth, emailOf(username), await secret(username,password));
    user=cred.user;
    /* ключі наскрізного шифрування: приватний іде в хмару лише
       загорнутий у пароль, тож сервер його не прочитає */
    const keys=await window.H.e2e.create(password);
    /* помилку транзакції (зокрема «юзернейм зайнято») пропускаємо
       назовні — її розбирає catch нижче */
    const done=await Promise.race([F.runTransaction(fs, async t=>{
      const ref=F.doc(fs,'usernames',username);
      const cur=await t.get(ref);
      if(cur.exists() && cur.data().uid!==user.uid) throw new Error('taken');
      t.set(ref, {uid:user.uid});
      t.set(F.doc(fs,'users',user.uid), Object.assign({
        username, name:profile.name||username, bio:profile.bio||'',
        avatar:profile.avatar||null, seen:Date.now(), peers:{}, push:null
      }, keys ? {pub:keys.pub, keys} : {}));
      return 'ok';
    }), new Promise(res=>setTimeout(()=>res('slow'), 12000))]);
    return done==='ok' ? 'ok' : 'net';
  }catch(e){
    if(String(e&&e.message)==='taken'){ try{ await A.deleteUser(auth.currentUser); }catch(e2){} return 'taken'; }
    return mapAuthError(e);
  }
}

async function signIn(username, password){
  if(!await init()) return {error:'no-config'};
  try{
    authError='';
    const cred=await A.signInWithEmailAndPassword(auth, emailOf(username), await secret(username,password));
    user=cred.user;
    const s=await within(F.getDoc(F.doc(fs,'users',user.uid)), 10000, null);
    const prof=(s && s.exists()) ? s.data() : null;
    await restoreKeys(password, prof);
    return {ok:true, profile: prof};
  }catch(e){ const w=mapAuthError(e); authError=w; return {error:w}; }
}

/* Локальний акаунт, створений до вмикання хмари. */
async function linkAccount(username, password, profile){
  const r=await signIn(username, password);
  if(r.ok){
    authError='';
    await setProfile(profile, true);
    return 'ok';
  }
  if(r.error==='wrong'){
    const up=await signUp(username, password, profile);
    authError = up==='ok' ? '' : up;
    return up;
  }
  authError=r.error;
  return r.error;
}

async function changePassword(username, newPass){
  if(!user) return 'no-session';
  try{
    await A.updatePassword(user, await secret(username,newPass));
    /* приватний ключ загорнутий старим паролем — перезагортаємо */
    const box=await window.H.e2e.rewrap(newPass);
    if(box) await publishKeys(box);
    return 'ok';
  }
  catch(e){ return mapAuthError(e); }
}

/* Автоматичний вхід у застосунок має так само тихо заходити і в
   хмару — інакше пристрій лишається без синхронізації, а людину
   поза вашою мережею неможливо ані знайти, ані дописатися. */
async function rememberLogin(username, password){
  try{ store.set(KEEP+username, await secret(username, password)); }catch(e){}
}
function forgetLogin(username){ store.del(KEEP+username); }
async function resumeSession(username){
  if(!await init()) return false;
  if(user) return true;
  const kept=store.get(KEEP+username, null);
  if(!kept) return false;
  try{
    const cred=await A.signInWithEmailAndPassword(auth, emailOf(username), kept);
    user=cred.user; authError='';
    return true;
  }catch(e){ authError=mapAuthError(e); return false; }
}

/* Головний автомат: привести акаунт до ладу в хмарі, скільки б
   разів це не знадобилося. Реєстрація могла не вдатися (не було
   мережі, проєкт ще не налаштували), вхід міг не відбутися —
   тут усе доводиться до кінця, без жодного питання до людини.

   Пароль для цього не потрібен: похідна від нього збережена
   поруч із сесією ще тоді, коли людина його вводила, а
   приватний ключ уже загорнутий у неї ж. */
async function ensure(username){
  if(!configured()) return 'off';
  if(!await init()) return 'no-sdk';
  if(user){ await completeProfile(); start(); return 'ok'; }

  const kept=store.get(KEEP+username, null);
  if(!kept) return 'need-password';

  try{
    const cred=await A.signInWithEmailAndPassword(auth, emailOf(username), kept);
    user=cred.user;
  }catch(e){
    const c=String((e&&e.code)||'');
    if(c.indexOf('invalid-credential')>=0 || c.indexOf('user-not-found')>=0){
      /* акаунта в хмарі ще немає — доробляємо реєстрацію тепер */
      try{
        const cred=await A.createUserWithEmailAndPassword(auth, emailOf(username), kept);
        user=cred.user;
      }catch(e2){
        authError=mapAuthError(e2);
        return authError==='taken' ? 'need-password' : 'retry';
      }
    } else {
      authError=mapAuthError(e);
      return 'retry';
    }
  }
  authError='';
  await completeProfile();
  start();
  return 'ok';
}

/* Дописати в хмару те, чого там бракує: профіль, публічний ключ,
   загорнутий приватний і бронь юзернейма. */
async function completeProfile(){
  if(!user || !fs) return;
  const me=S.me||{};
  if(!me.username) return;
  const patch={username:me.username, name:me.name||'', bio:me.bio||'',
               avatar:me.avatar||null, seen:Date.now()};
  try{
    const box=await window.H.db.kvGet('e2e', null);
    if(box && box.pub && box.ct){ patch.pub=box.pub; patch.keys=box; }
  }catch(e){}
  try{ await F.setDoc(F.doc(fs,'users',user.uid), patch, {merge:true}); }catch(e){}
  try{
    const ref=F.doc(fs,'usernames',me.username);
    const cur=await within(F.getDoc(ref), 6000, null);
    if(cur && !cur.exists()) await F.setDoc(ref, {uid:user.uid});
  }catch(e){}
}

async function signOutCloud(){
  stop();
  try{ if(auth) await A.signOut(auth); }catch(e){}
  user=null;
}

/* Ключі шифрування: беремо з хмари й відмикаємо паролем.
   Немає — створюємо й публікуємо (старі акаунти). */
async function restoreKeys(password, prof){
  const e=window.H.e2e;
  if(!e.supported()) return false;
  if(prof && prof.keys && await e.unlock(password, prof.keys)) return true;
  if(await e.unlock(password, null)) {           /* лишився з минулого разу */
    if(user) publishKeys(await e.rewrap(password));
    return true;
  }
  const box=await e.create(password);
  if(box) publishKeys(box);
  return !!box;
}
async function publishKeys(box){
  if(!user || !box) return;
  try{ await F.setDoc(F.doc(fs,'users',user.uid), {pub:box.pub, keys:box}, {merge:true}); }catch(e){}
}

/* ---------- профілі ---------- */
async function profileOf(uidStr){
  if(profiles.has(uidStr)) return profiles.get(uidStr);
  const s=await within(F.getDoc(F.doc(fs,'users',uidStr)), 10000, null);
  if(!s || !s.exists()) return null;
  const p=Object.assign({uid:uidStr}, s.data());
  profiles.set(uidStr, p);
  return p;
}
async function setProfile(mePr, force){
  if(!user || !mePr) return false;
  try{
    await F.setDoc(F.doc(fs,'users',user.uid), {
      username:mePr.username, name:mePr.name||'', bio:mePr.bio||'',
      avatar:mePr.avatar||null, seen:Date.now()
    }, {merge:true});
    return true;
  }catch(e){ return false; }
}

/* Пошук людини за юзернеймом — тепер без здогадок: у хмарі є
   таблиця зайнятих юзернеймів. */
/* Повертає профіль; null — такого юзернейма немає;
   undefined — хмара не відповіла, шукаємо далі напряму. */
async function lookup(username){
  username=normUser(username);
  if(!await init()) return undefined;
  const s=await within(F.getDoc(F.doc(fs,'usernames',username)), 8000, undefined);
  if(s===undefined) return undefined;
  if(!s.exists()) return null;
  const p=await profileOf(s.data().uid);
  return p || undefined;
}

/* База користувачів: скільки людей уже зареєструвалося.
   Заразом це перевірка, що читання профілів справді працює. */
async function countPeople(){
  if(!user || !fs) return null;
  try{
    const snap=await within(F.getDocs(F.query(F.collection(fs,'users'), F.limit(200))), 8000, null);
    if(!snap) return null;
    peopleCount=snap.size;
    return peopleCount;
  }catch(e){ return null; }
}

/* ---------- пристрої та присутність ---------- */
function freshPeers(map){
  const out={}, now=Date.now();
  for(const k in (map||{})){
    const v=map[k];
    if(v && v.id && now-(v.ts||0) < KEEP_DEVICE) out[k]=v;
  }
  return out;
}
async function touch(peerId){
  if(!user) return;
  const now=Date.now();
  try{
    const mine=profiles.get(user.uid)||{};
    const peers=freshPeers(mine.peers);
    if(peerId) peers[device()]={id:peerId, ts:now};
    await F.setDoc(F.doc(fs,'users',user.uid), {seen:now, peers}, {merge:true});
  }catch(e){}
}
/* Куди дзвонити: найсвіжіший пристрій співрозмовника. */
function peersOf(uidStr){
  const p=profiles.get(uidStr);
  if(!p) return [];
  return Object.values(freshPeers(p.peers)).sort((a,b)=>b.ts-a.ts).map(v=>v.id);
}

/* ---------- чати ---------- */
const chatIdFor = (a,b) => [a,b].sort().join('__');

async function ensureCloudChat(localId, peerUid, extra){
  if(!user || !peerUid) return null;
  const cloudId=chatIdFor(user.uid, peerUid);
  link.set(localId, {cloudId, uid:peerUid});
  try{
    await F.setDoc(F.doc(fs,'chats',cloudId), Object.assign({
      members:[user.uid, peerUid].sort(), updated:Date.now()
    }, extra||{}), {merge:true});
  }catch(e){ return null; }
  return cloudId;
}

/* Хмарний чат -> локальний. Локальний ключ лишається тим самим
   homin-<юзернейм>, тож увесь інтерфейс працює без змін. */
async function applyChatDoc(id, data){
  if(!data || !data.members) return;
  const peerUid=data.members.find(x=>x!==user.uid);
  if(!peerUid) return;
  const prof=await profileOf(peerUid);
  if(!prof || !prof.username) return;
  const localId=idOf(prof.username);
  link.set(localId, {cloudId:id, uid:peerUid});

  const c=window.H.net.ensureChat(localId, prof.name||('@'+prof.username), prof.username);
  c.uid=peerUid; c.cloudId=id;
  if(prof.name) c.name=prof.name;
  if(prof.bio!==undefined) c.bio=prof.bio||'';
  if(prof.avatar!==undefined) c.avatar=prof.avatar||null;
  if(prof.push!==undefined) c.push=prof.push||null;
  if(prof.pub){ window.H.e2e.forget(peerUid, prof.pub); c.pub=prof.pub; }
  if(prof.seen) c.lastSeen=Math.max(c.lastSeen||0, prof.seen);

  const wasFriend=c.friend, wasPending=c.pendingIn;
  c.friend=!!data.friend;
  c.pendingIn = !!(!data.friend && data.reqFrom && data.reqFrom!==user.uid);
  c.pendingOut = !data.friend && data.reqFrom===user.uid;
  /* сповіщаємо лише про зміну, а не на кожне оновлення документа */
  if(!wasFriend && c.friend) window.H.notify.friendOk(c);
  if(!wasPending && c.pendingIn) window.H.notify.friendRequest(c);

  /* прочитання з боку співрозмовника */
  const seen=(data.reads||{})[peerUid]||0;
  if(seen){
    let ch=false;
    c.messages.forEach(m=>{ if(m.from==='me' && m.ts<=seen && m.status!=='read'){ m.status='read'; ch=true; } });
    if(ch) window.H.repaintChat(localId);
  }
  /* прочитане з мого ж іншого пристрою */
  const mineRead=(data.reads||{})[user.uid]||0;
  if(mineRead && c.unread){
    const last=c.messages[c.messages.length-1];
    if(last && last.ts<=mineRead){ c.unread=0; window.H.syncTabbar(); }
  }
  save();
  window.H.repaintList();
  watchMsgs(id, localId);
}

function watchMsgs(cloudId, localId){
  if(unsubMsgs[cloudId]) return;
  const c=S.chats[localId];
  const since=(c && c.cloudTs) || 0;
  try{
    const q=F.query(F.collection(fs,'chats',cloudId,'msgs'),
                    F.where('ts','>',since), F.orderBy('ts'), F.limit(300));
    unsubMsgs[cloudId]=F.onSnapshot(q, snap=>{
      snap.docChanges().forEach(ch=>{
        if(ch.type==='removed') return;
        applyMsg(localId, ch.doc.id, ch.doc.data());
      });
    }, err=>{ lastError=String(err&&err.message||err); });
  }catch(e){ lastError=String(e&&e.message||e); }
}

async function applyMsg(localId, mid, d){
  if(!d || !d.ts) return;
  const c=S.chats[localId]; if(!c) return;
  const mine = d.from===user.uid;
  const l=link.get(localId)||{};
  const e=window.H.e2e;
  let text=d.text||'', src=d.media||null;
  if(d.etext){
    const open=await e.open(l.uid, c.pub, l.cloudId, d.etext);
    text = open==null ? '🔒 Не вдалося розшифрувати' : open;
  }
  if(d.emedia){
    const open=await e.open(l.uid, c.pub, l.cloudId, d.emedia);
    if(open) src=open;
  }
  const m={
    id:mid, from:mine?'me':'them', type:d.type||'text', text,
    ts:d.ts, dur:d.dur||0, wave:d.wave||null, src,
    status: mine?'sent':'read', seen: !mine && S.active===localId
  };
  c.cloudTs=Math.max(c.cloudTs||0, d.ts);
  window.H.net.receive(localId, m, mine);
}

/* ---------- надсилання ---------- */
async function send(localId, m){
  if(!on()) return false;
  const l=link.get(localId);
  const c=S.chats[localId];
  if(!l){
    if(!c || !c.uid) return false;
    await ensureCloudChat(localId, c.uid);
  }
  const cloudId=(link.get(localId)||{}).cloudId;
  if(!cloudId) return false;
  const doc={from:user.uid, type:m.type||'text', ts:m.ts||Date.now(),
             dur:m.dur||0, wave:m.wave||null};
  const e=window.H.e2e;
  const pub=c&&c.pub, peerUid=(link.get(localId)||{}).uid;
  const etext = await e.seal(peerUid, pub, cloudId, m.text||'');
  if(etext){ doc.etext=etext; doc.enc=1; }
  else doc.text=m.text||'';
  if(m.src){
    if(m.src.length>MEDIA_MAX) doc.big=true;   /* завелике для хмари — піде напряму */
    else {
      const emedia = doc.enc ? await e.seal(peerUid, pub, cloudId, m.src) : null;
      if(emedia) doc.emedia=emedia;
      else if(!doc.enc) doc.media=m.src;
      else doc.big=true;
    }
  }
  try{
    await F.setDoc(F.doc(fs,'chats',cloudId,'msgs',m.id), doc);
    /* у картці чату тексту не тримаємо: він однаково зашифрований,
       а серверу вистачає часу останнього повідомлення */
    await F.setDoc(F.doc(fs,'chats',cloudId), {
      updated:doc.ts,
      last:{from:user.uid, type:doc.type, ts:doc.ts}
    }, {merge:true});
    if(c) c.cloudTs=Math.max(c.cloudTs||0, doc.ts);
    return true;
  }catch(e){ lastError=String(e&&e.message||e); return false; }
}

async function markRead(localId){
  if(!on()) return;
  const l=link.get(localId); if(!l) return;
  try{
    await F.setDoc(F.doc(fs,'chats',l.cloudId), {reads:{[user.uid]:Date.now()}}, {merge:true});
  }catch(e){}
}

async function friendRequest(localId, peerUid){
  if(!on()) return false;
  const id=await ensureCloudChat(localId, peerUid, {friend:false, reqFrom:user.uid, created:Date.now()});
  return !!id;
}
async function acceptFriend(localId){
  if(!on()) return false;
  const l=link.get(localId); if(!l) return false;
  try{ await F.setDoc(F.doc(fs,'chats',l.cloudId), {friend:true, reqFrom:null}, {merge:true}); return true; }
  catch(e){ return false; }
}
async function declineFriend(localId){
  if(!on()) return false;
  const l=link.get(localId); if(!l) return false;
  stopChat(l.cloudId);
  try{ await F.deleteDoc(F.doc(fs,'chats',l.cloudId)); }catch(e){}
  link.delete(localId);
  return true;
}

/* ---------- пуш ---------- */
async function publishPushCard(card){
  if(!user) return;
  try{ await F.setDoc(F.doc(fs,'users',user.uid), {push:card||null}, {merge:true}); }catch(e){}
}
async function enableFCM(){
  if(!on()) return {ok:false, why:'off'};
  if(!cfg.vapidKey) return {ok:false, why:'no-vapid'};
  try{
    const m=await import(SDK+'firebase-messaging.js');
    if(!(await m.isSupported())) return {ok:false, why:'unsupported'};
    const reg=await window.H.notify.registration();
    if(!reg) return {ok:false, why:'no-sw'};
    const messaging=m.getMessaging(app);
    const token=await m.getToken(messaging, {vapidKey:cfg.vapidKey, serviceWorkerRegistration:reg});
    if(!token) return {ok:false, why:'denied'};
    fcmToken=token;
    await F.setDoc(F.doc(fs,'users',user.uid,'devices',device()),
      {fcm:token, seen:Date.now(), ua:navigator.userAgent.slice(0,120)}, {merge:true});
    return {ok:true, token};
  }catch(e){ return {ok:false, why:'error', err:String(e&&e.message||e)}; }
}

/* Перевірка проєкту: що вже налаштовано в консолі, а що ні.
   Обидві проби лише читають — нічого не створюють. */
async function diagnose(){
  const cfg=readCfg()||{};
  const out={config:!!cfg.apiKey, project:cfg.projectId||'', vapid:!!cfg.vapidKey,
             relay:!!cfg.relay, sdk:false, auth:'?', db:'?'};
  if(!await init()) return out;
  out.sdk=true;

  try{
    await A.signInWithEmailAndPassword(auth,
      'zz-homin-probe-'+Date.now()+'@homin.app', 'probe-'+Date.now()+'-x');
    out.auth='ok';
  }catch(e){
    const c=String((e&&e.code)||'');
    out.auth = c.indexOf('configuration-not-found')>=0 ? 'none'
             : c.indexOf('operation-not-allowed')>=0 ? 'off'
             : (c.indexOf('invalid-credential')>=0 || c.indexOf('user-not-found')>=0
                || c.indexOf('wrong-password')>=0) ? 'ok'
             : c.indexOf('network')>=0 ? 'net' : 'error';
  }

  try{
    await Promise.race([
      F.getDocFromServer(F.doc(fs,'usernames','zz-homin-probe')),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 8000))
    ]);
    out.db='ok';
  }catch(e){
    const c=String((e&&e.code)||(e&&e.message)||'');
    out.db = c.indexOf('permission-denied')>=0 ? 'rules'
           : c.indexOf('timeout')>=0 ? 'none'
           : c.indexOf('unavailable')>=0 ? 'net' : 'error';
  }

  await window.H.loadIce();
  out.turn = await turnWorks();
  return out;
}

/* Чи справді проходить TURN: збираємо кандидати й дивимось, чи
   зʼявився relay. Це найчесніша перевірка «чи буде дзвінок між
   різними мережами». */
function turnWorks(){
  if(!window.H.hasTurn()) return Promise.resolve(null);
  return new Promise(res=>{
    let pc, done=false;
    const fin=v=>{ if(done) return; done=true; try{ pc.close(); }catch(e){} res(v); };
    try{ pc=new RTCPeerConnection({iceServers:window.H.iceServers()}); }
    catch(e){ return res(false); }
    pc.onicecandidate=e=>{
      if(!e.candidate) return fin(false);
      if((e.candidate.candidate||'').indexOf(' typ relay')>=0) fin(true);
    };
    try{
      pc.createDataChannel('probe');
      pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(()=>fin(false));
    }catch(e){ return fin(false); }
    setTimeout(()=>fin(false), 8000);
  });
}

/* ---------- підписки ---------- */
function start(){
  if(!user || started || !fs) return;
  started=true; state='on';
  profileOf(user.uid).then(()=>touch(window.H.net.peerId()));
  countPeople();
  try{
    unsubMe=F.onSnapshot(F.doc(fs,'users',user.uid), s=>{
      if(!s.exists()) return;
      profiles.set(user.uid, Object.assign({uid:user.uid}, s.data()));
    });
    unsubChats=F.onSnapshot(
      F.query(F.collection(fs,'chats'), F.where('members','array-contains', user.uid)),
      snap=>{ snap.docChanges().forEach(ch=>{
        if(ch.type==='removed'){ stopChat(ch.doc.id); return; }
        applyChatDoc(ch.doc.id, ch.doc.data());
      }); },
      err=>{ lastError=String(err&&err.message||err); state='error'; }
    );
  }catch(e){ lastError=String(e&&e.message||e); state='error'; }
}
function stopChat(cloudId){
  if(unsubMsgs[cloudId]){ try{ unsubMsgs[cloudId](); }catch(e){} delete unsubMsgs[cloudId]; }
}
function stop(){
  started=false;
  if(unsubChats){ try{ unsubChats(); }catch(e){} unsubChats=null; }
  if(unsubMe){ try{ unsubMe(); }catch(e){} unsubMe=null; }
  Object.keys(unsubMsgs).forEach(stopChat);
  link.clear(); profiles.clear();
  if(state==='on') state='ready';
}

function on(){ return !!(user && fs); }
function syncing(){ return !!(user && fs && started); }

window.H.cloud = {
  configured, state:()=>state, error:()=>lastError, on, syncing,
  authError:()=>authError,
  uid:()=>user&&user.uid, device,
  config:readCfg,
  setConfig(o){ store.set(CFG, o||null); cfg=readCfg(); },
  clearConfig(){ store.del(CFG); cfg=null; },
  init, signUp, signIn, signOutCloud, linkAccount, changePassword, usernameFree, diagnose,
  rememberLogin, forgetLogin, resumeSession, ensure,
  waitAuth(){ return authReady || Promise.resolve(null); },
  start, stop, lookup, profileOf, setProfile, peersOf, touch,
  ensureCloudChat, send, markRead, friendRequest, acceptFriend, declineFriend,
  publishPushCard, enableFCM, fcm:()=>!!fcmToken,
  countPeople, people:()=>peopleCount,
  chats:()=>link.size
};
})();
</script>
<script>
/* ============================================================
   ГОМІН — запуск
   ============================================================ */
(function(){
'use strict';
const {S,$,$$,applyTheme,resetTo,switchTab,back,current,closeSheet,save,toast} = window.H;

applyTheme();

/* system theme changes */
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(S.cfg.theme==='system') applyTheme(); }); }catch(e){}

/* tab bar */
$('#tabbar').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  switchTab(b.dataset.tab); window.H.buzz(6);
});

/* keyboard-aware height on phones */
const vv=window.visualViewport;
if(vv){
  const fit=()=>{
    const app=$('.app');
    if(window.innerWidth<720){ app.style.height=vv.height+'px'; }
    else app.style.height='';
  };
  vv.addEventListener('resize', fit);
  window.addEventListener('orientationchange', ()=>setTimeout(fit,250));
  fit();
}

/* hardware / browser back */
try{
  history.replaceState({h:0},'');
  window.addEventListener('popstate', ()=>{
    const ov=$('#overlays');
    if(ov.querySelector('.viewer')){ ov.querySelector('.viewer').click(); }
    if(ov.querySelector('.sheet')){ closeSheet(); }
    else if(window.H.stack.length>1) back();
    history.pushState({h:1},'');
  });
  history.pushState({h:1},'');
}catch(e){}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    const v=$('#overlays .viewer'); if(v){ v.classList.add('out'); setTimeout(()=>v.remove(),240); return; }
    if($('#overlays .sheet')){ closeSheet(); return; }
    if(window.H.stack.length>1) back();
  }
});

/* keep connections warm */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden || !S.me) return;
  window.H.net.wake();
  window.H.cloudEnsure && window.H.cloudEnsure();
  window.H.notify.clear(S.active||null);
  window.H.notify.badge();
});
window.addEventListener('online', ()=>{ if(S.me) window.H.net.wake(); });
/* Якщо зʼєднання так і не піднялося, пробуємо ще — тихо, у фоні. */
setInterval(()=>{
  if(S.me && document.visibilityState==='visible' && S.net!=='ok') window.H.net.wake();
}, 30000);

/* Те саме для хмари: доки акаунт не в ній, застосунок раз за
   разом доводить справу до кінця сам. Людина про це не знає й
   нічого не натискає. */
let cloudTry=0, cloudAsked=false;
async function cloudEnsure(force){
  const cl=window.H.cloud;
  if(!S.me || !cl.configured() || cl.on()) return;
  const now=Date.now();
  if(!force && now-cloudTry < 60000) return;
  cloudTry=now;
  const r=await cl.ensure(S.me.username);
  if(r==='ok'){
    S.me.uid=cl.uid(); save();
    window.H.notify.autoPush();
    toast('Акаунт підключено до хмари', 2600);
    const c=window.H.current&&window.H.current();
    if(c && c.name==='settings') window.H.refresh();
  } else if(r==='need-password' && !cloudAsked){
    cloudAsked=true;
    if(window.H.cloudNeedsLink) window.H.cloudNeedsLink();
  }
}
window.H.cloudEnsure=cloudEnsure;
setInterval(()=>{ if(document.visibilityState==='visible') cloudEnsure(); }, 60000);
window.addEventListener('online', ()=>cloudEnsure(true));
window.addEventListener('offline', ()=>{ S.net='off'; window.H.refresh&&window.H.refresh(); });
window.addEventListener('beforeunload', ()=>{ save(); });

/* prevent pinch-zoom of the shell (the photo viewer handles its own) */
document.addEventListener('gesturestart', e=>e.preventDefault());

/* ============================================================
   PWA: service worker, встановлення, оновлення
   ============================================================ */
const pwa = {
  reg:null, waiting:null, prompt:null,
  installed(){
    try{
      return matchMedia('(display-mode: standalone)').matches ||
             matchMedia('(display-mode: minimal-ui)').matches ||
             window.navigator.standalone === true;
    }catch(e){ return false; }
  },
  canInstall(){ return !!pwa.prompt; },
  isIOS(){
    return /iP(hone|ad|od)/.test(navigator.userAgent) ||
           (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  },
  async install(){
    if(!pwa.prompt) return 'unavailable';
    const ev=pwa.prompt; pwa.prompt=null;
    ev.prompt();
    let outcome='dismissed';
    try{ outcome=(await ev.userChoice).outcome; }catch(e){}
    if(window.H.current && window.H.current() && window.H.current().name==='settings') window.H.refresh();
    return outcome;
  },
  applyUpdate(){
    const w=pwa.waiting; if(!w) return;
    w.postMessage({type:'SKIP_WAITING'});
    setTimeout(()=>location.reload(), 400);
  },
  async checkUpdate(){
    if(!pwa.reg) return 'unsupported';
    try{ await pwa.reg.update(); }catch(e){ return 'failed'; }
    return pwa.waiting ? 'update' : 'current';
  }
};
window.H.pwa = pwa;

window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  pwa.prompt=e;
  const c=window.H.current && window.H.current();
  if(c && c.name==='settings') window.H.refresh();
});
window.addEventListener('appinstalled', ()=>{
  pwa.prompt=null;
  toast('Гомін встановлено на пристрій');
});

const inWebView = location.hostname==='appassets.androidplatform.net';
if('serviceWorker' in navigator && !inWebView && window.isSecureContext){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      pwa.reg=reg;
      const track=w=>{
        if(!w) return;
        w.addEventListener('statechange', ()=>{
          if(w.state==='installed' && navigator.serviceWorker.controller){
            pwa.waiting=w;
            toast('Доступна нова версія', 9000, {label:'Оновити', fn:()=>pwa.applyUpdate()});
          }
        });
      };
      if(reg.waiting && navigator.serviceWorker.controller){
        pwa.waiting=reg.waiting;
        toast('Доступна нова версія', 9000, {label:'Оновити', fn:()=>pwa.applyUpdate()});
      }
      reg.addEventListener('updatefound', ()=>track(reg.installing));
      setInterval(()=>{ reg.update().catch(()=>{}); }, 60*60*1000);
    }).catch(()=>{});
  });
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloading) return; reloading=true;
  });
}

/* ярлики з маніфесту: ./?a=find, ./?a=calls */
function shortcut(){
  let a='', c='', act='';
  try{
    const q=new URLSearchParams(location.search);
    a=q.get('a')||''; c=q.get('c')||''; act=q.get('act')||'';
  }catch(e){}
  if(!a) return;
  try{ history.replaceState({h:1}, '', location.pathname); }catch(e){}
  if(a==='find') setTimeout(()=>window.H.go('newchat'), 420);
  else if(a==='calls') setTimeout(()=>window.H.switchTab('calls'), 420);
  /* застосунок відкрили з пуш-сповіщення */
  else if(a==='chat' && c) setTimeout(()=>{ if(S.chats[c]) window.H.openChat(c); }, 520);
  else if(a==='call' && c){
    /* Прийшли з дзвінка: піднімаємо звʼязок і чекаємо, доки той,
       хто дзвонить, достукається — він дзвонить 45 секунд. */
    window.H.net.start();
    window.H.net.addPeer(c, true);
    setTimeout(()=>{
      if(window.H.net.ringing()){ if(act==='accept') window.H.net.answerCall(); return; }
      const chat=S.chats[c];
      toast(act==='decline' ? 'Дзвінок відхилено'
        : (chat?chat.name:'Абонент')+' дзвонив — можна передзвонити', 5000,
        act==='decline'?null:{label:'Подзвонити', fn:()=>window.H.net.startCall(c,'audio')});
    }, 3500);
  }
}

/* ---------- вибір стартового екрана ---------- */
(async function boot(){
  const auth = window.H.auth;
  try{
    if(await auth.resume()){
      applyTheme();
      resetTo('chats');
      window.H.net.start();
      window.H.notify.afterLogin();
      shortcut();
      return;
    }
  }catch(e){}
  if(auth.legacy()){ resetTo('adopt'); return; }
  if(auth.hasAccounts()) resetTo('login');
  else resetTo('onboard');
})();
})();
</script>
